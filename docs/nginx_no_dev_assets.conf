# Deny public access to developer-only frontend pages and unminified
# source assets. Include inside the chat vhost's :443 block. Belongs
# BEFORE the catch-all `location / { try_files ... }` so the deny
# rules win.
#
#   include /etc/nginx/snippets/biochirp_no_dev_assets.conf;
#
# Two protected surfaces:
#
# 1. /_dev/ — internal debug consoles (see frontend/_dev/README.md).
#    These are part of the dev workflow but ship in the same docroot,
#    so we 404 them at the edge rather than maintain a separate dist/
#    pipeline.
#
# 2. Unminified .js / .css siblings of .min.* bundles. Every production
#    HTML loads only the .min.* variant (verified by
#    scripts/check_html_loads_minified.py in CI). Keeping the source
#    accessible on the public origin is a small bandwidth + IP-leak
#    issue with no upside.
location ^~ /_dev/ {
    return 404;
}

# Unminified bundle paths used during development. Names match the
# pairs scripts/check_asset_drift.py enforces.
location = /assets/chat-main.js          { return 404; }
location = /assets/chat-shared.css       { return 404; }
location = /assets/decomp_tree.js        { return 404; }
location = /assets/decomp_tree.css       { return 404; }
location = /assets/event-delegation.js   { return 404; }
location = /assets/insights.js           { return 404; }
location = /assets/insights.css          { return 404; }
location = /assets/share.js              { return 404; }
location = /assets/share.css             { return 404; }
