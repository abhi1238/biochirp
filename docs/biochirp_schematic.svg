<svg xmlns="http://www.w3.org/2000/svg" width="190mm" height="150mm" viewBox="0 0 190 150" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a" markerUnits="userSpaceOnUse" markerWidth="3.4" markerHeight="3.4" refX="2.8" refY="1.7" orient="auto">
      <path d="M0,0 L3.4,1.7 L0,3.4 Z" fill="#7c8aa0"/>
    </marker>
    <marker id="ag" markerUnits="userSpaceOnUse" markerWidth="3.4" markerHeight="3.4" refX="2.8" refY="1.7" orient="auto">
      <path d="M0,0 L3.4,1.7 L0,3.4 Z" fill="#c0492f"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="190" height="150" fill="#ffffff"/>

  <!-- ===== HEADER : BioChirp logo + wordmark ===== -->
  <g transform="translate(6.37,1.7) scale(0.0295)">
    <path fill="#006633" d="M121.7,276.8c-0.6,32.7-3.3,95.3,5.1,123.7c19.9,67.2,93.2,103.3,158.5,81.1c106.4-36.3,111-180.5,14.8-227.3c-50.8-24.7-117.4,3.4-164.5-56.5c-5.3-6.7-5.2-8.8-8.6-14.5l-2.8-4c-0.1-0.6-0.5-0.7-0.8-0.9c-1.9,22.2,3.8,55.4,11.2,73.5c37.8,91.5,126.4,31.1,157.9,88.9c24.9,46-28.3,95.8-72.5,70.5c-11.2-6.4-35.3-29-25.1-51.9c6.8-15.1,33.7-26,49.8,2.1c1.7-39.3-33.4-31.6-63.6-40C141.5,310.4,129.8,281.7,121.7,276.8z"/>
  </g>
  <text x="19" y="10.6" font-size="6.4" font-weight="700" fill="#006633">BioChirp</text>
  <text x="19" y="15.2" font-size="2.5" fill="#5a6b85">Federated biomedical retrieval — one shared engine, many pluggable datasets</text>
  <line x1="8" y1="18.5" x2="182" y2="18.5" stroke="#e3e7ee" stroke-width="0.4"/>

  <!-- ===== SECTION 1 : QUERY PIPELINE ===== -->
  <text x="8" y="25.5" font-size="3.6" font-weight="700" fill="#15233f">How a query flows</text>
  <text x="48" y="25.5" font-size="2.5" fill="#5a6b85">— the shared pipeline, identical for every dataset</text>

  <!-- feedback loop -->
  <path d="M149.4,29 C149.4,25 127.6,25 127.6,29" fill="none" stroke="#c0492f" stroke-width="0.55" marker-end="url(#ag)"/>
  <text x="138.5" y="25.4" font-size="2" fill="#c0492f" text-anchor="middle">reject → fix (≤2×)</text>

  <!-- connecting arrows -->
  <g stroke="#7c8aa0" stroke-width="0.5">
    <line x1="26.4" y1="36" x2="33.1" y2="36" marker-end="url(#a)"/>
    <line x1="48.1" y1="36" x2="54.9" y2="36" marker-end="url(#a)"/>
    <line x1="69.9" y1="36" x2="76.6" y2="36" marker-end="url(#a)"/>
    <line x1="91.6" y1="36" x2="98.4" y2="36" marker-end="url(#a)"/>
    <line x1="113.4" y1="36" x2="120.1" y2="36" marker-end="url(#a)"/>
    <line x1="135.1" y1="36" x2="141.9" y2="36" marker-end="url(#a)"/>
    <line x1="156.9" y1="36" x2="163.6" y2="36" marker-end="url(#a)"/>
  </g>

  <!-- chip 1 : Question -->
  <rect x="11.9" y="29" width="14" height="14" rx="3" fill="#64748b"/>
  <text x="18.9" y="39.2" font-size="8" font-weight="700" fill="#ffffff" text-anchor="middle">?</text>
  <text x="18.9" y="47.2" font-size="2.35" fill="#15233f" text-anchor="middle">Question</text>

  <!-- chip 2 : Clarifier (sparkle) -->
  <rect x="33.6" y="29" width="14" height="14" rx="3" fill="#2f63cf"/>
  <path d="M40.6,30.4 L42,34.6 L46.2,36 L42,37.4 L40.6,41.6 L39.2,37.4 L35,36 L39.2,34.6 Z" fill="#ffffff"/>
  <text x="40.6" y="47.2" font-size="2.35" fill="#15233f" text-anchor="middle">Clarifier</text>
  <text x="40.6" y="50" font-size="1.95" fill="#7c8aa0" text-anchor="middle">canonical form</text>

  <!-- chip 3 : Router (branch) -->
  <rect x="55.4" y="29" width="14" height="14" rx="3" fill="#2f63cf"/>
  <g stroke="#ffffff" stroke-width="1.3" fill="#ffffff" stroke-linecap="round">
    <line x1="58.4" y1="36" x2="62.4" y2="36"/>
    <line x1="62.4" y1="36" x2="65.6" y2="32.6"/>
    <line x1="62.4" y1="36" x2="65.6" y2="39.4"/>
    <circle cx="58.4" cy="36" r="1.2" stroke="none"/>
    <circle cx="65.8" cy="32.5" r="1.2" stroke="none"/>
    <circle cx="65.8" cy="39.5" r="1.2" stroke="none"/>
  </g>
  <text x="62.4" y="47.2" font-size="2.35" fill="#15233f" text-anchor="middle">Router</text>
  <text x="62.4" y="50" font-size="1.95" fill="#7c8aa0" text-anchor="middle">in-scope?</text>

  <!-- chip 4 : Interpreter (braces) -->
  <rect x="77.1" y="29" width="14" height="14" rx="3" fill="#2f63cf"/>
  <text x="84.1" y="39" font-size="7.5" font-weight="700" fill="#ffffff" text-anchor="middle">{ }</text>
  <text x="84.1" y="47.2" font-size="2.35" fill="#15233f" text-anchor="middle">Interpreter</text>
  <text x="84.1" y="50" font-size="1.95" fill="#7c8aa0" text-anchor="middle">entities → filters</text>

  <!-- chip 5 : Database tool (cylinder) -->
  <rect x="98.9" y="29" width="14" height="14" rx="3" fill="#dd8a2c"/>
  <ellipse cx="105.9" cy="32.6" rx="4.4" ry="1.5" fill="#ffffff"/>
  <path d="M101.5,32.6 v6.8 a4.4,1.5 0 0 0 8.8,0 v-6.8" fill="#ffffff"/>
  <ellipse cx="105.9" cy="32.6" rx="4.4" ry="1.5" fill="none" stroke="#dd8a2c" stroke-width="0.5"/>
  <text x="105.9" y="47.2" font-size="2.35" font-weight="700" fill="#15233f" text-anchor="middle">Database tool</text>
  <text x="105.9" y="50" font-size="1.95" fill="#7c8aa0" text-anchor="middle">match · plan · join</text>

  <!-- chip 6 : Synthesizer (pencil) -->
  <rect x="120.6" y="29" width="14" height="14" rx="3" fill="#2f63cf"/>
  <g transform="rotate(45 127.6 36)">
    <rect x="126.3" y="30.5" width="2.6" height="9" fill="#ffffff"/>
    <path d="M126.3,30.5 L127.6,28.3 L128.9,30.5 Z" fill="#ffffff"/>
    <rect x="126.3" y="39.5" width="2.6" height="1.6" fill="#ffd9a0"/>
  </g>
  <text x="127.6" y="47.2" font-size="2.35" fill="#15233f" text-anchor="middle">Synthesizer</text>
  <text x="127.6" y="50" font-size="1.95" fill="#7c8aa0" text-anchor="middle">writes answer</text>

  <!-- chip 7 : Critic (check) -->
  <rect x="142.4" y="29" width="14" height="14" rx="3" fill="#2f63cf"/>
  <path d="M145.6,36.2 L148.4,39 L153.6,32.8" fill="none" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="149.4" y="47.2" font-size="2.35" fill="#15233f" text-anchor="middle">Critic</text>
  <text x="149.4" y="50" font-size="1.95" fill="#7c8aa0" text-anchor="middle">verifies grounding</text>

  <!-- chip 8 : Answer (speech bubble) -->
  <rect x="164.1" y="29" width="14" height="14" rx="3" fill="#00a957"/>
  <rect x="166.1" y="31.6" width="10" height="7" rx="1.6" fill="#ffffff"/>
  <path d="M168.4,38.6 L168.4,41.2 L171.2,38.6 Z" fill="#ffffff"/>
  <text x="171.1" y="47.2" font-size="2.35" font-weight="700" fill="#15233f" text-anchor="middle">Answer</text>

  <!-- ===== SECTION 2 : SHARED vs PER-DATASET ===== -->
  <text x="8" y="60.5" font-size="3.6" font-weight="700" fill="#15233f">What is shared vs what you add</text>

  <!-- left panel : shared -->
  <rect x="8" y="64" width="84" height="44" rx="2.6" fill="#eef4fe" stroke="#2f63cf" stroke-width="0.6"/>
  <text x="50" y="70" font-size="2.9" font-weight="700" fill="#1d4ed8" text-anchor="middle">SHARED ENGINE — built once</text>
  <g>
    <!-- web interface -->
    <rect x="13" y="73" width="7" height="6" rx="0.8" fill="none" stroke="#2f63cf" stroke-width="0.6"/>
    <line x1="13" y1="75" x2="20" y2="75" stroke="#2f63cf" stroke-width="0.6"/>
    <text x="24" y="75.4" font-size="2.5" font-weight="700" fill="#15233f">Web interface</text>
    <text x="24" y="78.3" font-size="2" fill="#5a6b85">one chat UI for every database</text>
    <!-- services -->
    <g stroke="#2f63cf" stroke-width="0.55" fill="#2f63cf">
      <circle cx="14.3" cy="82.3" r="1.15"/><circle cx="18.7" cy="82.3" r="1.15"/><circle cx="16.5" cy="86" r="1.15"/>
      <line x1="14.3" y1="82.3" x2="18.7" y2="82.3"/><line x1="14.3" y1="82.3" x2="16.5" y2="86"/><line x1="18.7" y1="82.3" x2="16.5" y2="86"/>
    </g>
    <text x="24" y="83.2" font-size="2.5" font-weight="700" fill="#15233f">Support services</text>
    <text x="24" y="86.1" font-size="2" fill="#5a6b85">router · interpreter · matcher · planner · web</text>
    <!-- pipeline -->
    <g stroke="#2f63cf" stroke-width="1.1" fill="none" stroke-linecap="round">
      <path d="M13.3,90 L15.5,92.3 L13.3,94.6"/><path d="M16.3,90 L18.5,92.3 L16.3,94.6"/><path d="M19.3,90 L21.5,92.3 L19.3,94.6"/>
    </g>
    <text x="24" y="91.6" font-size="2.5" font-weight="700" fill="#15233f">Query pipeline</text>
    <text x="24" y="94.5" font-size="2" fill="#5a6b85">the flow shown above + 3-tier prompt body</text>
    <!-- packaging -->
    <rect x="13.4" y="99.2" width="6.4" height="6.4" rx="0.6" fill="none" stroke="#2f63cf" stroke-width="0.6"/>
    <line x1="13.4" y1="101.4" x2="19.8" y2="101.4" stroke="#2f63cf" stroke-width="0.6"/>
    <text x="24" y="101.8" font-size="2.5" font-weight="700" fill="#15233f">Packaging</text>
    <text x="24" y="104.7" font-size="2" fill="#5a6b85">one container template + shared base image</text>
  </g>

  <!-- connector -->
  <line x1="92" y1="86" x2="98" y2="86" stroke="#7c8aa0" stroke-width="0.7" marker-end="url(#a)"/>
  <text x="95" y="83.6" font-size="2" fill="#5a6b85" text-anchor="middle">plug</text>

  <!-- right panel : per-dataset -->
  <rect x="98" y="64" width="84" height="44" rx="2.6" fill="#fdf6ec" stroke="#dd8a2c" stroke-width="0.6"/>
  <text x="140" y="70" font-size="2.9" font-weight="700" fill="#b9701f" text-anchor="middle">PER-DATASET — the only new work</text>
  <g>
    <!-- parquet -->
    <ellipse cx="106" cy="74" rx="3.4" ry="1.1" fill="none" stroke="#dd8a2c" stroke-width="0.6"/>
    <path d="M102.6,74 v4 a3.4,1.1 0 0 0 6.8,0 v-4" fill="none" stroke="#dd8a2c" stroke-width="0.6"/>
    <text x="113" y="74.6" font-size="2.5" font-weight="700" fill="#15233f">Preprocessed parquet</text>
    <text x="113" y="77.5" font-size="2" fill="#5a6b85">the cleaned dataset tables — the data itself</text>
    <!-- schema -->
    <rect x="102.8" y="81.2" width="6.4" height="6.4" rx="0.5" fill="none" stroke="#dd8a2c" stroke-width="0.6"/>
    <line x1="106" y1="81.2" x2="106" y2="87.6" stroke="#dd8a2c" stroke-width="0.5"/>
    <line x1="102.8" y1="84.4" x2="109.2" y2="84.4" stroke="#dd8a2c" stroke-width="0.5"/>
    <text x="113" y="83.2" font-size="2.5" font-weight="700" fill="#15233f">Schema</text>
    <text x="113" y="86.1" font-size="2" fill="#5a6b85">declared tables &amp; columns</text>
    <!-- scope yaml -->
    <path d="M103,90.4 h4.2 l2,2 v5.4 h-6.2 z" fill="none" stroke="#dd8a2c" stroke-width="0.6"/>
    <path d="M107.2,90.4 v2 h2" fill="none" stroke="#dd8a2c" stroke-width="0.6"/>
    <line x1="104" y1="94.4" x2="108.2" y2="94.4" stroke="#dd8a2c" stroke-width="0.5"/>
    <line x1="104" y1="96" x2="108.2" y2="96" stroke="#dd8a2c" stroke-width="0.5"/>
    <text x="113" y="92.4" font-size="2.5" font-weight="700" fill="#15233f">Scope YAML (manifest)</text>
    <text x="113" y="95.3" font-size="2" fill="#5a6b85">coverage · example queries · routing hints</text>
    <!-- prompt notes -->
    <rect x="102.8" y="99.4" width="6.4" height="6.6" rx="0.5" fill="none" stroke="#dd8a2c" stroke-width="0.6"/>
    <line x1="104" y1="101.6" x2="108" y2="101.6" stroke="#dd8a2c" stroke-width="0.5"/>
    <line x1="104" y1="103.4" x2="108" y2="103.4" stroke="#dd8a2c" stroke-width="0.5"/>
    <text x="106" y="105.6" font-size="2.4" font-weight="700" fill="#dd8a2c" text-anchor="middle">*</text>
    <text x="113" y="101.4" font-size="2.5" font-weight="700" fill="#15233f">Prompt notes (Tier 2)</text>
    <text x="113" y="104.3" font-size="2" fill="#5a6b85">enums, quirks &amp; failure modes for this DB</text>
  </g>

  <!-- ===== SECTION 3 : 3-TIER PROMPT ===== -->
  <text x="8" y="117.5" font-size="3.6" font-weight="700" fill="#15233f">3-tier prompt</text>
  <text x="44" y="117.5" font-size="2.5" fill="#5a6b85">— teaching a new dataset = one notes block, no code change</text>

  <g text-anchor="middle">
    <rect x="8" y="121" width="41" height="15" rx="2.2" fill="#f0ecfb" stroke="#6f54c4" stroke-width="0.55"/>
    <text x="28.5" y="126.6" font-size="2.6" font-weight="700" fill="#4a3a8f">Shared rules</text>
    <text x="28.5" y="130.6" font-size="2.05" fill="#5a6b85">generic — written once</text>
    <text x="28.5" y="133.8" font-size="2.05" font-weight="700" fill="#2faf63">never edited</text>

    <rect x="53" y="121" width="41" height="15" rx="2.2" fill="#f0ecfb" stroke="#6f54c4" stroke-width="0.55"/>
    <text x="73.5" y="126.6" font-size="2.6" font-weight="700" fill="#4a3a8f">Dataset notes</text>
    <text x="73.5" y="130.6" font-size="2.05" fill="#5a6b85">per-DB enums &amp; quirks</text>
    <text x="73.5" y="133.8" font-size="2.05" font-weight="700" fill="#e0922a">the one block you write</text>

    <rect x="98" y="121" width="41" height="15" rx="2.2" fill="#f0ecfb" stroke="#6f54c4" stroke-width="0.55"/>
    <text x="118.5" y="126.6" font-size="2.6" font-weight="700" fill="#4a3a8f">Live data</text>
    <text x="118.5" y="130.6" font-size="2.05" fill="#5a6b85">entities + retrieved rows</text>
    <text x="118.5" y="133.8" font-size="2.05" font-weight="700" fill="#2f7fd0">filled automatically</text>

    <rect x="150" y="121" width="32" height="15" rx="2.2" fill="#6f54c4"/>
    <text x="166" y="127" font-size="2.6" font-weight="700" fill="#ffffff">Tailored</text>
    <text x="166" y="131" font-size="2.6" font-weight="700" fill="#ffffff">prompt</text>
  </g>
  <g fill="#6f54c4" font-size="3.4" font-weight="700" text-anchor="middle">
    <text x="51" y="129.8">+</text>
    <text x="96" y="129.8">+</text>
  </g>
  <line x1="139" y1="128.5" x2="149" y2="128.5" stroke="#7c8aa0" stroke-width="0.6" marker-end="url(#a)"/>

  <!-- footer -->
  <rect x="8" y="140.5" width="174" height="7" rx="2" fill="#eafaf0" stroke="#2faf63" stroke-width="0.5"/>
  <text x="95" y="144.9" font-size="2.55" font-weight="700" fill="#1a7a44" text-anchor="middle">Add a database = preprocessed data + 3 declarative files.  The shared engine is never modified.</text>
</svg>
