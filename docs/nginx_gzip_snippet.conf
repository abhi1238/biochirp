# BioChirp gzip tuning for /etc/nginx/nginx.conf
#
# Current state on this host (audited 2026-05-18):
#   /etc/nginx/nginx.conf:46  →  `gzip on;` IS set
#   /etc/nginx/nginx.conf:53  →  `gzip_types` IS COMMENTED OUT
#
# With no explicit gzip_types directive, nginx only compresses `text/html` —
# CSS, JS, JSON, and SVG go out uncompressed. That nullifies the recent
# minification + script-extraction wins (chat-main.js 82 KB, chat-shared.css
# 15 KB, db_chats.json 25 KB).
#
# Drop-in replacement for the commented `gzip_types` block in nginx.conf:
#
# ─────────────────── BEGIN PATCH ─────────────────────────────────────────
#   gzip on;
#   gzip_vary on;
#   gzip_proxied any;
#   gzip_comp_level 6;
#   gzip_min_length 1024;
#   gzip_types
#       text/plain
#       text/css
#       text/javascript
#       application/javascript
#       application/json
#       application/xml
#       application/xml+rss
#       image/svg+xml
#       font/woff2;
# ─────────────────── END PATCH ───────────────────────────────────────────
#
# Apply (sudo required):
#
#   sudo cp /etc/nginx/nginx.conf /etc/nginx/nginx.conf.bak.$(date +%s)
#
#   sudo sed -i \
#     -e 's|^\s*# gzip_vary on;|\tgzip_vary on;|' \
#     -e 's|^\s*# gzip_proxied any;|\tgzip_proxied any;|' \
#     -e 's|^\s*# gzip_comp_level 6;|\tgzip_comp_level 6;\n\tgzip_min_length 1024;|' \
#     -e 's|^\s*# gzip_types .*|\tgzip_types text/plain text/css text/javascript application/javascript application/json application/xml application/xml+rss image/svg+xml font/woff2;|' \
#     /etc/nginx/nginx.conf
#
#   sudo nginx -t && sudo systemctl reload nginx
#
# Verify with a curl probe (Content-Encoding: gzip should appear):
#   curl -sIH "Accept-Encoding: gzip" https://biochirp.iiitd.edu.in/assets/chat-shared.min.css?v=20260518min | grep -i -E "content-encoding|content-length"
#
# Expected savings: ~70% on the wire for CSS/JS/JSON. For the chat assets
# combined that's ~15 KB total -> ~5 KB after gzip on first paint.
#
# Brotli (optional, ~15-20% better than gzip):
#   sudo apt install libnginx-mod-http-brotli-filter libnginx-mod-http-brotli-static
#   then add to http {} block:
#     brotli on;
#     brotli_comp_level 5;
#     brotli_types text/css text/javascript application/javascript application/json image/svg+xml;
#   sudo nginx -t && sudo systemctl reload nginx
