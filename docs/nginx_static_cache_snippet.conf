# ── Static asset cache headers ──────────────────────────────────────────────
# These location blocks belong INSIDE the `server { listen 443 ssl … }` block of
# the active site config, BEFORE the SPA fallback `location /`. They coexist with
# the existing `root /home/abhishekh/abhi/biochirp/frontend`.
#
# RECOMMENDED apply (via include, keeps the big site file clean):
#   sudo cp docs/nginx_static_cache_snippet.conf /etc/nginx/snippets/biochirp-static-cache.conf
#   # then, inside the 443 server block (just above `location / {`), add:
#   #     include /etc/nginx/snippets/biochirp-static-cache.conf;
#   sudo nginx -t && sudo systemctl reload nginx
# (Or paste these blocks directly into the server block above `location /`.)
#
# The active enabled config is /etc/nginx/sites-enabled/biochirp — confirm the
# loaded file with `sudo nginx -T | grep -n 'server_name biochirp'`.
#
# Rationale:
#  - /assets/brand/* are videos / images with stable filenames (biochirp8.mp4
#    is 22 MB and reloads every visit without these headers). Immutable +
#    1 year = browser never re-requests once seen.
#  - /assets/*.{css,js} use cache-busting `?v=YYYYMMDD` query strings in
#    db_chat.html / index.html, so they get a long TTL; bumping `?v=` forces a
#    fresh fetch. (This is why CSS edits "don't show" until either ?v= bumps OR
#    the HTML is re-fetched.)
#  - .html responses use `no-cache` (revalidate every time) so a freshly-edited
#    page — and the new `?v=` asset links inside it — show up on a normal reload,
#    with NO manual hard-refresh. nginx returns a cheap 304 when unchanged.
# ─────────────────────────────────────────────────────────────────────────────

# NOTE on headers: we set Cache-Control via add_header ONLY — do NOT add an
# `expires` directive here. `expires` auto-emits its own Cache-Control header,
# which would result in TWO conflicting Cache-Control headers on the response.

# Branded media (videos, logos, GIFs) — filenames are versioned by hand.
location ^~ /assets/brand/ {
    root /home/abhishekh/abhi/biochirp/frontend;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    add_header X-Content-Type-Options "nosniff" always;
    access_log off;
    try_files $uri =404;
}

# CSS / JS bundles — cache-busted via ?v= query string in HTML.
location ~* ^/assets/.*\.(css|js)$ {
    root /home/abhishekh/abhi/biochirp/frontend;
    add_header Cache-Control "public, max-age=2592000" always;
    add_header X-Content-Type-Options "nosniff" always;
    access_log off;
    try_files $uri =404;
}

# Other /assets/* (configs/, fonts, etc.) — short cache.
# NOTE: this MUST be a plain prefix (no `^~`). With `^~`, nginx would treat the
# longest-prefix match as final and SKIP the css|js regex block above, so those
# bundles would silently fall back to this 1h rule. A plain prefix is still the
# longest-prefix fallback, but lets the css|js regex win when it matches.
location /assets/ {
    root /home/abhishekh/abhi/biochirp/frontend;
    add_header Cache-Control "public, max-age=3600" always;
    try_files $uri =404;
}

# HTML (db_chat.html, index.html, *_api.html stubs) — MUST always revalidate,
# or freshly-edited pages won't show up without a manual hard-refresh.
# "no-cache" = browser may store the file but must revalidate with the server
# (via ETag / Last-Modified) on every use. nginx answers 304 when unchanged
# (cheap) or 200 with the new bytes the instant the file changes on disk.
location ~* \.html$ {
    root /home/abhishekh/abhi/biochirp/frontend;
    add_header Cache-Control "no-cache" always;
    try_files $uri =404;
}
