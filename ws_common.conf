# Shared WebSocket proxy headers — included by every chat-route block.
# Drop this at /etc/nginx/snippets/ws_common.conf
proxy_http_version 1.1;
proxy_set_header Upgrade $http_upgrade;
proxy_set_header Connection $connection_upgrade;
proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_read_timeout 600s;
proxy_send_timeout 600s;

# Cost-runaway protection (P0 fix). Bounds WS handshake rate and concurrent
# open WS per IP. Zones declared at http{} scope in deploy/nginx-rate-limits.conf
# (install via /etc/nginx/conf.d/biochirp-rate-limits.conf). limit_req only
# counts the HTTP upgrade request, not steady-state frames — that's the right
# semantic: stops reconnect storms without throttling an established session.
# Tuned tight because each accepted message fans out to 5+ LLM calls.
limit_req  zone=biochirp_ws burst=5 nodelay;
limit_conn biochirp_conn 3;
