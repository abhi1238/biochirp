name: prompt-invariants

# Gate on PRs / pushes that touch prompts or the prompt-invariant scripts.
# Lives in its own workflow file (not appended to ci.yml) so the path filter
# only suppresses this job, not the rest of CI.
on:
  push:
    branches: [main]
    paths:
      - 'resources/prompts/**'
      - 'resources/db_field_aliases.md'
      - 'resources/db_column_descriptions.md'
      - 'scripts/check_prompt_*'
      - '.github/workflows/prompt-invariants.yml'
  pull_request:
    branches: [main]
    paths:
      - 'resources/prompts/**'
      - 'resources/db_field_aliases.md'
      - 'resources/db_column_descriptions.md'
      - 'scripts/check_prompt_*'
      - '.github/workflows/prompt-invariants.yml'

# Enforces two of the prompt-consistency invariants surfaced by the
# 2026-05-23 audit:
#   1. medical-advice disclaimer = 5 byte-identical occurrences — Bash
#   2. provenance disclaimer = 10 byte-identical occurrences — Bash
#
# A third invariant (gene_symbol/gene_name canonical check) previously ran
# here via scripts/check_prompt_gene_field_canonical.py, but that script
# targeted resources/prompts/interpreter_db_notes.yaml, a filename that no
# longer exists (renamed to db_notes.yaml). The script was retired along
# with the rest of the legacy per-DB architecture; removed from this
# workflow rather than restored, since fixing it requires re-deriving the
# check against the current db_notes.yaml schema, not just restoring a file.

jobs:
  invariants:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install minimal deps
        run: pip install --quiet pyyaml

      - name: Disclaimer counts + miRBase ghost
        # LC_ALL=C.UTF-8 ensures grep handles the em-dash (U+2014) and
        # ⚠️ (U+26A0 U+FE0F) in the provenance string consistently across
        # the runner's default locale.
        env:
          LC_ALL: C.UTF-8
        run: bash scripts/check_prompt_invariants.sh
