loader:
  generated: false      # bespoke hand-written loader (DuckDB views + per-parquet reads; no _CTD_TABLES tuple)
  renames: {'# ChemicalName': drug_name, ChemicalName: drug_name, ChemicalID: drug_id, GeneSymbol: gene_symbol,
    '# GeneSymbol': gene_symbol, GeneID: gene_id, GeneForms: gene_forms, DiseaseName: disease_name, '# DiseaseName': disease_name,
    DiseaseID: disease_id, PathwayName: pathway_name, '# PathwayName': pathway_name, PathwayID: pathway_id,
    InferenceGeneSymbol: gene_symbol}
rules:
  mandatory_entity_columns:
    drug:
    - drug_name
    gene:
    - gene_symbol
    disease:
    - disease_name
    pathway:
    - pathway_name
  xref_id_columns:
  - drug_id
  - gene_id
  - disease_id
  - pathway_id
  - chemical_gene_organism_id
  - chemical_phenotype_organism_id
  - phenotype_id
  - stressor_id
  - cas_rn
  - pubchem_cid
  - inchikey
  - omim_ids
  schema_grounding_notes:
  - 'chem_disease_direct_evidence (chemical_disease_association_ctd): valid values ''marker/mechanism''
    and ''therapeutic''; gene_disease_direct_evidence (gene_disease_association_ctd): valid values
    ''marker/mechanism'' (31,993 rows) and ''therapeutic'' (1,950 rows); null = inferred-only in both'
  - 'chemical_gene_interaction_actions (chemical_gene_association_ctd) / interaction_actions
    (chemical_phenotype_ixn_ctd): pipe-separated compound codes, e.g. ''increases^expression'' or ''decreases^activity'';
    use LIKE ''%expression%'' for text search'
  - 'pubmed_ids columns (chem_gene_pubmed_ids, gene_disease_pubmed_ids, chem_disease_pubmed_ids, chem_phenotype_pubmed_ids): pipe-separated string of PMIDs; for single-PMID lookup use LIKE ''%<pmid>%'''
  - 'inference_score: numeric; higher scores indicate stronger inferred associations'
  co_output_rules:
  - trigger_columns:
    - chemical_gene_interaction_actions
    - interaction_actions
    - interaction_text
    require_column: drug_name
    require_behavior: requested
    reason: interaction details are not interpretable without identifying the chemical
  - trigger_columns:
    - chemical_gene_interaction_actions
    - interaction_text
    require_column: gene_symbol
    require_behavior: requested
    reason: interaction details are not interpretable without identifying the target gene
  - trigger_columns:
    - gene_disease_direct_evidence
    - chem_disease_direct_evidence
    - inference_score
    require_column: disease_name
    require_behavior: requested
    reason: evidence fields require disease context
  - trigger_columns:
    - corrected_p_value
    - p_value
    - target_match
    require_column: pathway_name
    require_behavior: requested
    reason: enrichment statistics require pathway context
  stressor_class_map:
    PCB: stressor_name ILIKE '%biphenyl%'
    polychlorinated biphenyl: stressor_name ILIKE '%biphenyl%'
    dioxin: stressor_name ILIKE '%dioxin%'
    furan: stressor_name ILIKE '%furan%'
    phthalate: stressor_name ILIKE '%phthalate%'
    PAH: stressor_name ILIKE '%pyrene%' OR stressor_name ILIKE '%fluorene%' OR stressor_name ILIKE '%phenanthrene%'
      OR stressor_name ILIKE '%anthracene%'
    polycyclic aromatic hydrocarbon: stressor_name ILIKE '%pyrene%' OR stressor_name ILIKE '%fluorene%'
      OR stressor_name ILIKE '%phenanthrene%'
    PBDE: stressor_name ILIKE '%diphenyl ether%'
    brominated flame retardant: stressor_name ILIKE '%diphenyl ether%' OR stressor_name ILIKE '%bromo%'
    organophosphate: stressor_name ILIKE '%phosphate%' OR stressor_name ILIKE '%phosphorus%'
    heavy metal: stressor_name ILIKE 'Lead' OR stressor_name ILIKE 'Arsenic' OR stressor_name ILIKE 'Mercury'
      OR stressor_name ILIKE 'Cadmium' OR stressor_name ILIKE 'Chromium' OR stressor_name ILIKE 'Nickel'
      OR stressor_name ILIKE 'Manganese'
    organotin: stressor_name ILIKE '%tributyltin%' OR stressor_name ILIKE '%triphenyltin%' OR stressor_name
      ILIKE 'organotin%'
    pesticide: stressor_name ILIKE '%chlordane%' OR stressor_name ILIKE '%aldrin%' OR stressor_name ILIKE
      '%dieldrin%' OR stressor_name ILIKE '%DDT%' OR stressor_name ILIKE '%endrin%'
    PFAS: stressor_name ILIKE '%perfluoro%' OR stressor_name ILIKE '%PFOA%' OR stressor_name ILIKE '%PFOS%'
    per- and polyfluoroalkyl: stressor_name ILIKE '%perfluoro%'
  action_synonym_map:
    upregulates: increases^expression
    upregulate: increases^expression
    overexpresses: increases^expression
    overexpress: increases^expression
    induces expression: increases^expression
    downregulates: decreases^expression
    downregulate: decreases^expression
    silences: decreases^expression
    suppresses: decreases^expression
    activates: increases^activity
    stimulates: increases^activity
    inhibits: decreases^activity
    blocks: decreases^activity
    binds: affects^binding
    methylates: affects^methylation
    phosphorylates: increases^phosphorylation
    ubiquitinates: affects^ubiquitination
    stabilizes: increases^stability
    degrades: decreases^abundance
  abbreviation_map:
    AD: Alzheimer Disease
  trade_name_map:
    Glivec: imatinib
    Herceptin: trastuzumab
    Keytruda: pembrolizumab
    Avastin: bevacizumab
  gene_alias_map:
    p53: TP53
    PD-1: PDCD1
  class_entity_rules:
  - '"TKI" expands to "tyrosine kinase inhibitor" — do NOT replace with a specific drug like imatinib'
  - '"checkpoint inhibitor" stays as-is — do NOT replace with pembrolizumab or nivolumab'
  - '"mAb" expands to "monoclonal antibody" — do NOT replace with a specific antibody'
  class_column: drug_name
  pathway_alias_map:
    MAPK: MAPK signaling pathway
    PI3K/AKT: PI3K-Akt signaling pathway
    NF-kB: NF-kappa B signaling pathway
    Wnt: Wnt signaling pathway
    mTOR pathway: mTOR signaling pathway
