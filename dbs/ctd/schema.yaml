      diseases they study; derived from exposure_studies_v2. 2,836 rows.
    columns:
    - {name: reference, key_column: true, description: PubMed ID of the source exposure study — FK to
        exposure_studies_ctd.study_reference}
    - {name: disease_id, key_column: true, description: CTD/MeSH disease identifier — FK to disease_master_table_ctd.disease_id}
  exposure_study_stressor_association:
    parquet: exposure_study_stressor_association_v2.parquet
    role: association
    exec_schema: true
    kg_schema: false
    description: Many-to-many cross-reference between exposure studies (by PubMed reference) and the
      chemical stressors examined; derived from exposure_studies_v2. 12,003 rows.
    columns:
    - {name: reference, key_column: true, description: PubMed ID of the source exposure study — FK to
        exposure_studies_ctd.study_reference}
