  schema_grounding_notes:
  - 'pathway vs disease MUTUAL EXCLUSION: pathway_name and disease_name must NEVER both be ''requested''
    in the same parsed_value — they are separate relationships via separate tables. If the query asks
    for pathways → pathway_name: ''requested'', omit disease_name entirely. If the query asks for diseases
    → disease_name: ''requested'', omit pathway_name entirely. Mixing both causes a cross-join explosion.
    The words ''pathway'', ''pathways'', ''signaling'', ''KEGG'', ''gene set'', ''biological process''
    → pathway_name. The words ''disease'', ''diseases'', ''indication'', ''disorder'', ''condition'',
    ''treat'', ''therapy'' → disease_name.'
  - ki_nm / ic50_nm / kd_nm (binding affinity columns) belong ONLY to explicit binding-potency questions
    where the user says 'Ki', 'IC50', 'Kd', 'affinity', or 'potency'. NEVER include them for disease-indication
    queries ('which drugs treat X?') or general drug-target queries ('which drugs target EGFR?') — those
    use drug_disease_association or drug_gene_association WITHOUT drug_target_negative. drug_gene_association
    and drug_target_negative are MUTUALLY EXCLUSIVE in the same parsed_value.
  - 'gene_symbol: use HGNC official symbol only. Apply these common aliases: PD-1→PDCD1, PD-L1→CD274,
    p53→TP53. Never emit an alias or synonym as the gene_symbol filter value.'
  - 'drug CLASS queries (TKI, kinase inhibitor, checkpoint inhibitor, CDK inhibitor, mAb, etc.): HCDT
    has no mechanism-of-action column. Rule: (a) the class term itself (e.g. ''TKI'', ''kinase inhibitor'')
    is NOT a valid drug_name filter — omit it; (b) emit drug_name: ''requested'' as output; (c) if the
    query ALSO names a specific gene/target (e.g. ''Which kinase inhibitors target EGFR?''), KEEP gene_symbol:
    [''EGFR''] as a filter — the gene filter is valid even though the class term is not. Example CORRECT:
    q=''Which CDK inhibitors target CDK4?'' → {gene_symbol: [''CDK4''], drug_name: ''requested''}. Example
    WRONG: {drug_name: [''CDK inhibitor''], gene_symbol: [''CDK4'']} — class term as drug filter is invalid.'
  - brand/trade name lookup (Glivec→imatinib, Iressa→gefitinib, Keytruda→pembrolizumab, Tarceva→erlotinib,
    etc.) is resolved via trade_name_map → drug_name before querying; emit the INN name as the filter,
    not the brand name.
  - 'drug_name FORBIDDEN as output in disease-gene and gene-pathway queries: if the query asks ONLY for
    (gene + disease) or ONLY (gene + pathway), drug_name must be ABSENT from parsed_value — it is a join-key
    intermediate, never an output. Correct: {disease_name: [''X''], gene_symbol: ''requested''}. Wrong:
    {disease_name: [''X''], gene_symbol: ''requested'', drug_name: ''requested''}.'
