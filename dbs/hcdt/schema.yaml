    - smpdb
    - chebi
    - xref
    - identifier
    - pathway id
    - cross-reference
    - cross reference
    - external id
    reason: pathway xref IDs surface alongside pathway_name only when user requests an external pathway
      identifier (KEGG, SMPDB, ChEBI, or general xref)
  - trigger_columns:
    - drug_name
    - gene_symbol
    require_columns:
    - ki_nm
    - ic50_nm
    - kd_nm
    require_behavior: infer_from_question
    trigger_keywords:
    - ki
    - ic50
    - kd
    - potency
    - affinity
    - binding constant
    - inhibition constant
    - dissociation constant
    - binding affinity
    - binding potency
    reason: binding affinity values (ki_nm, ic50_nm, kd_nm) exist ONLY in drug_target_negative — not in
      drug_gene_association; surface only when user asks about potency, affinity, Ki, IC50, or Kd
  - trigger_columns:
    - omim_xref
    - icd11
    require_columns:
    - disease_name
    require_behavior: requested
    reason: disease cross-reference IDs (OMIM, ICD-11) are not interpretable without the accompanying
