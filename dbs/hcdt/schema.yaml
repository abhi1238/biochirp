    trigger_keywords:
    - omim
    - icd
    - icd11
    - icd-11
    - code
    - identifier
    - disease id
    - xref
    - cross-reference
    - cross reference
    reason: disease xref IDs surface alongside disease_name only when user explicitly requests a cross-reference
      code
  - trigger_columns:
