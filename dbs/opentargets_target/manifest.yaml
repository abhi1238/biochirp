name: opentargets_target
display_name: opentargets_target
description: 'Open Targets Platform live GraphQL. Maps a gene symbol to the ranked list of
  associated diseases with overall + per-data-source evidence scores. Returns gene_id, gene_symbol,
  disease.name, overall association_score, and per-source breakdown across 10 evidence types:
  genetic_association, somatic_mutation, drugs, literature, affected_pathway, animal_model,
  rna_expression, score_known_variant, score_clinical, score_genetic_literature.

  '
is_remote: true
domain_hint: drug_discovery
schema:
  inputs:
  - field: gene_symbol
  outputs:
  - field: gene_id
  - field: gene_symbol
  - field: disease_id
  - field: disease_name
  - field: association_score
  - field: score_genetic_association
  - field: score_somatic_mutation
  - field: score_drugs
  - field: score_affected_pathway
  - field: score_literature
  - field: score_animal_model
  - field: score_rna_expression
  - field: score_known_variant
  - field: score_clinical
  - field: score_genetic_literature
valid_queries:
- Which diseases are associated with the BRAF gene in Open Targets?
- What is the overall association score between TP53 and lung cancer?
- Give the per-data-source evidence breakdown for EGFR in non-small cell lung cancer.
- What are the top-ranked diseases associated with KRAS by overall score?
- Which diseases have genetic_association evidence linking them to CFTR?
- How strongly is MYC associated with cancer across Open Targets evidence types?
- What diseases show somatic_mutation evidence for PIK3CA?
- Rank the diseases linked to APOE by Open Targets evidence score.
- What pathways does KRAS participate in?
- Which Reactome pathways is EGFR involved in?
invalid_queries:
- What is the mechanism of action of imatinib? (use opentargets_drug — this DB is target/gene-centric,
  not drug-centric)
- What protein-protein interactions exist for EGFR? (use BioGRID/STRING — Open Targets aggregates
  evidence, not raw PPI networks)
- What is the molecular function of BRCA1? (use UniProt — Open Targets does not store GO/Swiss-Prot
  function annotations)
- What experimental PDB structures contain TP53? (use PDBe — Open Targets has no 3D structure data)
force_relations:
  drug_target: 0.7
  gene_disease: 0.95
  disease_gene: 0.85
  cancer_genomics: 0.55
derived:
  relation_weights:
    drug_target: 0.7
    gene_disease: 0.95
    disease_gene: 0.85
    cancer_genomics: 0.55
