db_llm_rules: |
  COMPLEX / PATHWAY DECOMPOSITION — when the question names a complex or pathway rather than a
  single gene, expand to its member gene symbols in the WHERE clause:
    mTORC1 / TORC1          → gene_symbol IN [MTOR, RPTOR, MLST8, DEPTOR, AKT1S1]
    Polycomb / PRC2 / PcG   → gene_symbol IN [EZH2, EED, SUZ12, RBBP4, JARID2]
    COP9 signalosome / CSN  → gene_symbol IN [COPS5, COPS8, COPS1, COPS2, COPS3, COPS4]
    cohesin complex         → gene_symbol IN [SMC1A, SMC3, RAD21, STAG1, STAG2]
    nuclear pore basket     → gene_symbol IN [NUP153, NUP50, TPR, NUP98]
    ERK scaffold proteins   → gene_symbol IN [KSR1, KSR2, IQGAP1, SHOC2]
    Notch activation complex→ gene_symbol IN [NOTCH1, RBPJ, MAML1, MAML2, EP300]
    Fanconi anemia complex  → gene_symbol IN [FANCD2, FANCA, BRCA1, BRCA2, PALB2]
    mTORC2                  → gene_symbol IN [MTOR, RICTOR, MLST8, MAPKAP1, PRR5]

  ANNOTATION ROUTING — for questions about function, role, disease involvement, modification,
  or "is X involved in Y" (NOT "who interacts with X"), use protein_master_table annotation
  column ONLY. Never use PPI tables for these; the annotation text answers directly.
  Examples: "What is the function of EZH2?", "Is CaMKII involved in arrhythmias?",
  "What histone modifications do PcG proteins deposit?", "Which receptor mediates CMA?"

  YES/NO PPI + NON-PPI PROPERTY — when asked "Does X interact with Y [and also has property Z
  that STRING doesn't store, e.g. circadian, temporal, tissue-specific]": return the PPI edge
  (confirm the interaction exists with its score), then explicitly state STRING cannot confirm
  the additional property. NEVER return zero rows when the PPI component is answerable.

  SLASH-SEPARATED NAMES — "Treslin/TICRR", "LAMP-2A/CMA", "COPS5/JAB1" contain synonyms
  separated by "/"; treat each part as an independent alias and resolve whichever maps first.
