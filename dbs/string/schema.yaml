# REVIEW before use: verify dtypes, factor `questions.literal` into params/templates,
# and confirm exec_schema/kg_schema flags on denormalised columns.
db: string
display_name: STRING
description: STRING protein-protein association network — scored confidence interactions across seven
  evidence channels (physical binding, co-expression, text mining, curated databases, gene fusion, genomic
  neighbourhood, co-occurrence)
parquet_dir: string
tables:
  protein_master_table:
    parquet: protein_master_table_string_v2.parquet
    role: master
    columns:
    - {name: protein_id, role: pk, key_column: true, description: STRING protein
        identifier (e.g. '9606.ENSP00000275493') — join key only; disk column already named protein_id; loader rename is a no-op (canonical name since v2)}
    - {name: gene_symbol, queryable: true, key_column: true, concept_type: gene_symbol, llm_note: HGNC
        official symbol (protein_master_table only) — p53→TP53, description: 'HGNC short gene symbol of
        the protein (e.g. ''EGFR'', ''TP53'', ''KRAS''); used to find which protein you are asking about'}
    - {name: protein_size, queryable: true, key_column: true, concept_type: protein_size, description: 'Protein
        length in amino acids (integer, e.g. 1210 for EGFR) of THIS protein. When this table is joined
        to a PPI edge it is the QUERY/anchor protein''s size; for a PARTNER''s size use the PPI table''s
        association_partner_protein_size / physical_partner_protein_size / channels_partner_protein_size
        column instead (table-prefixed to avoid spurious FK cross-joins)'}
    - {name: annotation, queryable: true, key_column: true, concept_type: gene_function, description: Free-text
        functional protein description from STRING (e.g. 'Receptor tyrosine kinase'); used when asking
        for protein function or annotation}
  ppi_association:
    parquet: ppi_association_string_v2.parquet
    role: association
    columns:
    - {name: protein_id, key_column: true, description: STRING protein ID for the query-side protein (non-queryable
        FK → protein_master_table_string.protein_id)}
    - {name: association_gene_symbol, queryable: true, key_column: true, concept_type: gene_symbol, llm_note: HGNC
        official symbol for the query side in ppi_association — p53→TP53, description: HGNC gene symbol
        of the query-side protein in the functional association table — use this to find all functional
        interaction partners of a named gene (edges are stored bidirectionally so a single filter returns
        ALL partners)}
    - {name: protein_partner_id, key_column: true, description: STRING protein ID for the partner-side
        protein (non-queryable FK → protein_master_table_string.protein_id)}
    - {name: association_partner_gene_symbol, queryable: true, key_column: true, concept_type: gene_symbol,
      description: HGNC gene symbol of the partner-side protein in the functional association table —
        this is the interacting partner returned to the user}
    - {name: association_score, queryable: true, key_column: true, concept_type: interaction_score, llm_note: INTEGER
        700–999 in this snapshot (overall confidence across all channels). NOT a fraction., description: 'STRING
        overall confidence score across all seven evidence channels (integer 0–1000; this snapshot pre-filtered
        to ≥ 700; 900+ = highest confidence). Users may ask for ''combined score'', ''STRING score'',
        or ''interaction confidence'''}
    - {name: association_partner_protein_size, added_at_load: true, key_column: true, description: 'Amino-acid length of the PARTNER protein on this edge
        (integer, e.g. 393), denormalized from protein_master_table via protein_partner_id. Use THIS column
        for any question about the SIZE / LENGTH / amino-acid count of a gene''s interaction PARTNERS
        (e.g. ''partners larger than 1000 aa'', ''average partner protein size''). NOTE: the master-table
        protein_size column is the QUERY/anchor protein''s size, not the partner''s'}
  ppi_physical:
    parquet: ppi_physical_string_v2.parquet
    role: association
    columns:
    - {name: protein_id, key_column: true, description: STRING protein ID for the query-side protein (non-queryable
        FK → protein_master_table_string.protein_id)}
    - {name: physical_gene_symbol, queryable: true, key_column: true, concept_type: gene_symbol, llm_note: HGNC
        official symbol for the query side in ppi_physical — p53→TP53, description: HGNC gene symbol of
        the query-side protein in the physical-binding table — use this to find proteins that physically
        bind a named gene (direct binding / complex evidence only; subset of ppi_association)}
    - {name: protein_partner_id, key_column: true, description: STRING protein ID for the physical-binding
        partner (non-queryable FK → protein_master_table_string.protein_id)}
    - {name: physical_partner_gene_symbol, queryable: true, key_column: true, concept_type: gene_symbol,
      description: HGNC gene symbol of the physical-binding partner — the partner gene that has direct
        physical / binding evidence with the query gene}
    - {name: physical_score, queryable: true, key_column: true, concept_type: interaction_score, llm_note: INTEGER
        700–999 in this snapshot (physical/binding evidence only). NOT a fraction., description: 'STRING
        physical-interaction confidence score from binding and complex evidence only (integer 700–999).
        Users may ask for ''physical interaction'', ''binding evidence'', or ''physical PPI'''}
    - {name: physical_partner_protein_size, added_at_load: true, key_column: true, description: 'Amino-acid length of the PARTNER protein on this edge
        (integer, e.g. 393), denormalized from protein_master_table via protein_partner_id. Use THIS column
        for any question about the SIZE / LENGTH / amino-acid count of a gene''s physical-binding PARTNERS.
        NOTE: the master-table protein_size column is the QUERY/anchor protein''s size, not the partner''s'}
  ppi_detailed_channels:
    parquet: ppi_detailed_channels_string_v2.parquet
    role: association
    columns:
    - {name: protein_id, key_column: true, description: STRING protein ID for the query-side protein (non-queryable
        FK → protein_master_table_string.protein_id)}
    - {name: channel_gene_symbol, queryable: true, key_column: true, concept_type: gene_symbol, llm_note: HGNC
        official symbol for the query side in ppi_detailed_channels — p53→TP53, description: HGNC gene
        symbol of the query-side protein in the per-channel evidence table — use this to retrieve per-channel
        evidence scores for a named gene's interaction partners}
    - {name: protein_partner_id, key_column: true, description: STRING protein ID for the partner-side
        protein (non-queryable FK → protein_master_table_string.protein_id)}
    - {name: channel_partner_gene_symbol, queryable: true, key_column: true, concept_type: gene_symbol,
      description: HGNC gene symbol of the partner-side protein in the per-channel evidence table — returned
        alongside per-channel scores}
    - {name: neighborhood, queryable: true, key_column: true, concept_type: interaction_score, llm_note: INTEGER
        SCORE 0–1000 (NOT boolean). Set as 'requested' (output) when user asks about neighbourhood/genomic
        co-location scores., description: 'Per-channel score: genomic neighbourhood co-location evidence
        (integer 0–357 in this snapshot; STRING protocol range 0–1000). Users may ask for ''neighborhood score'' or ''genomic neighbourhood'''}
    - {name: fusion, queryable: true, key_column: true, concept_type: interaction_score, llm_note: INTEGER
        SCORE 0–1000 (NOT boolean). Set as 'requested' (output) when user asks about gene-fusion evidence.,
      description: 'Per-channel score: gene-fusion evidence from organism comparisons (integer 0–900 in this snapshot; STRING protocol range 0–1000).
        Users may ask for ''fusion score'''}
    - {name: cooccurence, queryable: true, key_column: true, concept_type: interaction_score, llm_note: 'IMPORTANT:
        spelled ''cooccurence'' (single ''r'') on disk — use this exact spelling in all filters', description: 'Per-channel
        score: phylogenetic co-occurrence / profile evidence (integer 0–537 in this snapshot; STRING protocol range 0–1000; note schema spelling). Users
        may ask for ''co-occurrence score'' or ''phylogenetic profile'''}
    - {name: coexpression, queryable: true, key_column: true, concept_type: interaction_score, llm_note: INTEGER
        SCORE 0–1000 (NOT boolean). Set as 'requested' (output) when user asks about co-expression evidence.,
      description: 'Per-channel score: gene co-expression evidence across organisms (integer 0–1000).
        Users may ask for ''co-expression score'''}
    - {name: experimental, queryable: true, key_column: true, concept_type: interaction_score, llm_note: 'INTEGER
        SCORE 0–1000 (NOT boolean). When user asks for ''experimental evidence'' or ''experimental score'',
        set experimental=''requested'' (SELECT output), not a filter value. Only set it as a filter if
        the user specifies a numeric threshold (e.g. ''experimental > 500'').', description: 'Per-channel
        score: experimental/biochemical evidence from BioGRID, IntAct etc. (integer 0–1000). Users may
        ask for ''experimental score'' or ''experimental evidence'''}
    - {name: database, queryable: true, key_column: true, concept_type: interaction_score, llm_note: INTEGER
        SCORE 0–1000 (NOT boolean). Set as 'requested' (output) when user asks about curated-database
        evidence., description: 'Per-channel score: curated-database evidence from Reactome, KEGG etc.
        (integer 0–984 in this snapshot; STRING protocol range 0–1000). Users may ask for ''database score'' or ''curated evidence'''}
    - {name: textmining, queryable: true, key_column: true, concept_type: interaction_score, llm_note: INTEGER
        SCORE 0–1000 (NOT boolean). Set as 'requested' (output) when user asks about text-mining / literature
        evidence., description: 'Per-channel score: text-mining evidence from co-mentions in PubMed (integer
        0–1000). Users may ask for ''text-mining score'' or ''literature evidence'''}
    - {name: channel_combined_score, queryable: true, key_column: true, concept_type: interaction_score,
      llm_note: INTEGER 700–999 in this snapshot (overall combined confidence). NOT a fraction., description: STRING
        combined confidence score across all channels for this edge (integer 700–999 in this pre-filtered
        snapshot) — returned alongside per-channel scores for context}
    - {name: channels_partner_protein_size, added_at_load: true, key_column: true, description: 'Amino-acid length of the PARTNER protein on this edge
        (integer, e.g. 393), denormalized from protein_master_table via protein_partner_id. Use THIS column
        for any question about the SIZE / LENGTH / amino-acid count of a gene''s interaction PARTNERS.
        NOTE: the master-table protein_size column is the QUERY/anchor protein''s size, not the partner''s'}
  protein_alias:
    parquet: protein_alias_string_v2.parquet
    role: association
    columns:
    - {name: protein_id, key_column: true, description: STRING protein identifier
        (join key to protein_master_table_string.protein_id) — non-queryable FK; disk column already named protein_id; loader rename is a no-op (canonical name since v2)}
    - {name: alias, queryable: true, key_column: true, concept_type: alias_id, description: 'Alternate
        identifier or synonym for the protein (e.g. RefSeq accession, Ensembl ID, gene symbol). Users
        may ask for ''alias'', ''synonym'', or ''alternate ID'''}
    - {name: source, queryable: true, key_column: true, concept_type: xref_source, description: 'Source
        database for the alias (e.g. ''Ensembl_EMBL'', ''UniProt_AC'', ''Ensembl_HGNC''). Users may ask
        for ''alias source'' or ''source database'''}
loader:
  generated: false      # bespoke hand-written loader (reads each parquet directly; no _TABLES tuple). Renames string_id→protein_id on master+alias; injects partner_protein_size via utils/partner_denorm.py then renames to association_/physical_/channels_partner_protein_size per table
rules:
  mandatory_entity_columns:
    gene:
    - gene_symbol
    - association_gene_symbol
    - physical_gene_symbol
    - channel_gene_symbol
  xref_id_columns:
  - protein_id
  - protein_partner_id
  - alias
  - source
  schema_grounding_notes:
  - 'THREE disjoint PPI tables — each is independent, never join two of them together; pick ONE based
    on what the user asked:'
  - '  ppi_association_string  → general functional interaction partners (all evidence); columns: association_gene_symbol,
    association_partner_gene_symbol, association_score'
  - '  ppi_physical_string     → physical binding / complex subset only; columns: physical_gene_symbol,
    physical_partner_gene_symbol, physical_score'
  - '  ppi_detailed_channels_string → per-channel evidence breakdown; columns: channel_gene_symbol, channel_partner_gene_symbol,
    neighborhood/fusion/cooccurence/coexpression/experimental/database/textmining, channel_combined_score'
  - ALL per-channel scores (experimental, neighborhood, fusion, cooccurence, coexpression, database, textmining)
    are INTEGER SCORES 0–1000, never boolean. When the user asks 'with experimental evidence' or 'by experimental
    score', set experimental='requested' (SELECT it as output) — do NOT set it to 'True' or any boolean
    filter value
  - association_score / physical_score / channel_combined_score are integers 700–999 in this snapshot
    (pre-filtered to high-confidence edges ≥ 700); 900+ is highest confidence
  - 'ppi_association_string is bidirectional: every undirected edge appears in both directions, so a single
    filter on association_gene_symbol returns ALL of that gene''s interaction partners in association_partner_gene_symbol
    — do NOT also match association_partner_gene_symbol'
  - ppi_physical_string is the subset of ppi_association_string based solely on physical/binding evidence;
    same physical_gene_symbol/physical_partner_gene_symbol layout
  - protein_alias_string maps STRING protein IDs to external aliases (Ensembl, UniProt, RefSeq); query
    through protein_master_table_string.gene_symbol first
  - cooccurence is spelled without the double 'r' on disk — use this spelling verbatim in filters
  co_output_rules:
  - trigger_columns:
    - neighborhood
    - fusion
    - cooccurence
    - coexpression
    - experimental
    - database
    - textmining
    require_column: channel_combined_score
    require_behavior: requested
    reason: per-channel scores are not interpretable without the overall combined score for context
  - trigger_columns:
    - alias
    require_column: gene_symbol
    require_behavior: requested
    reason: raw alias strings are not interpretable without the canonical gene symbol
  gene_alias_map:
    # Data-driven: all entries confirmed in protein_alias_string_v2.parquet
    # (sources: Ensembl_HGNC_alias_symbol, Ensembl_external_synonym_HGNC,
    #  KEGG_NAME_SYNONYM, UniProt_GN_Synonyms, UniProt_DE_AltName_Short,
    #  UniProt_DE_RecName_Short, UniProt_DE_AltName_CD_antigen)
    # Removed: CDK4/6 (no parquet hit), p21 (ambiguous: TCEAL1/CDKN1A), p27 (ambiguous: ZNRD2/PAK2/CDKN1B)
    # Added: HER2 (4 parquet hits → ERBB2)
    Bcl-2: BCL2
    Bcl-XL: BCL2L1
    beta-catenin: CTNNB1
    c-KIT: KIT
    c-MET: MET
    c-Myc: MYC
    c-Raf: RAF1
    c-Src: SRC
    CTLA-4: CTLA4
    E-cadherin: CDH1
    FAK: PTK2
    HER2: ERBB2
    HER3: ERBB3
    HER4: ERBB4
    HSP90: HSP90AA1
    LAG-3: LAG3
    mTOR: MTOR
    N-cadherin: CDH2
    p53: TP53
    PD-1: PDCD1
    PD-L1: CD274
    PI3K: PIK3CA
    Rb: RB1
    TIM-3: HAVCR2
    VEGFR2: KDR
    # ── Complex / pathway hub aliases (sub-mode A+B+C BioASQ fix) ──
    # Complex names: map to the hub subunit; db_llm_rules expands to full member list
    mTORC1: MTOR
    mTORC2: RICTOR
    TORC1: MTOR
    Raptor: RPTOR
    Rictor: RICTOR
    cohesin: RAD21
    "cohesin complex": RAD21
    "COP9 signalosome": COPS5
    CSN: COPS5
    "nuclear pore basket": NUP153
    "ERK scaffold": KSR1
    "Notch complex": NOTCH1
    "Notch transcriptional activation complex": NOTCH1
    "Fanconi anemia complex": FANCD2
    # Annotation-routed aliases (sub-mode B)
    Treslin: TICRR
    CaMKII: CAMK2D
    CMA: LAMP2
    "LAMP-2A": LAMP2
    "P-body": DDX6
    "processing body": DDX6
    "membrane scission": DNM1L
    Groucho: TLE1
    sclerostin: SOST
    "Polycomb group": EZH2
    "Polycomb repressor complex": EZH2
    PcG: EZH2
    PRC2: EZH2
    # Yeast ortholog names (both proteins confirmed in protein_alias_string_v2.parquet)
    CTF4: WDHD1
    Ctf4: WDHD1
    CTF18: CHTF18
    Ctf18: CHTF18
    AND1: WDHD1
