name: opentargets_drug
display_name: opentargets_drug
description: 'Open Targets Platform live GraphQL. Maps a drug name to its full Open Targets
  profile: mechanisms of action (target + action_type), approved/investigational indications
  (disease name + ID), top-frequency adverse events, max clinical stage, drug type, description,
  synonyms, and trade names. Built from a single GraphQL turn via the search wrapper.

  '
is_remote: true
domain_hint: drug_discovery
schema:
  inputs:
  - field: drug_name
  outputs:
  - field: drug_id
  - field: drug_name
  - field: gene_id
  - field: gene_symbol
  - field: disease_id
  - field: disease_name
  - field: phase
  - field: status
  - field: mechanism_of_action
valid_queries:
- What is the mechanism of action of imatinib in Open Targets?
- Which diseases is pembrolizumab approved or investigated for?
- What targets does vemurafenib act on and what is the action type?
- What is the maximum clinical trial stage of olaparib?
- List the most frequent adverse events reported for metformin.
- What are the trade names and synonyms of atorvastatin?
- What drug type and description does Open Targets give for trastuzumab?
- What are the approved indications of gefitinib?
invalid_queries:
- What is the SMILES structure of aspirin? (use ChEBI/ChEMBL — Open Targets does not store
  small-molecule structures)
- Which genes are associated with breast cancer? (use opentargets_target — this DB is drug-centric,
  not target/disease-centric)
- What is the IC50 of imatinib against ABL1? (use ChEMBL — Open Targets does not store quantitative
  bioactivity values)
- What experimental PDB structures contain EGFR? (use PDBe — Open Targets has no 3D structure data)
- What transcription factors regulate TNF? (use TRRUST/OmniPath — Open Targets has no TF-regulation data)
force_relations:
  drug_target: 0.85
  drug_indication: 0.85
derived:
  relation_weights:
    drug_target: 0.85
    drug_indication: 0.85
