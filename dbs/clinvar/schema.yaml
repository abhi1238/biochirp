    - aggregate_clinical_significance
  - label: gene+clinical
    question: what is the clinical significance of variants in MYC?
    required:
    - gene_symbol
    - disease_clinical_significance
  - label: gene+clinical
    question: what is the clinical significance of variants in TP53?
    required:
    - gene_symbol
    - disease_clinical_significance
  - label: gene+clinical
    question: pathogenic variants in TP53
    required:
    - gene_symbol
    - aggregate_clinical_significance
  - label: gene+clinical
    question: pathogenic variants in MYC
    required:
    - gene_symbol
