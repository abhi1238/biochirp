    \ Signaling\", \"Innate Immune System\" (for JAK/STAT complex queries)\n       → \"JAK/STAT signaling\
    \ mediates inflammation — the primary cellular process is\n          inflammatory and immune signaling.\
    \ Reactome records JAK/STAT gene activity\n          in cytokine/interleukin pathways, interferon\
    \ responses, and innate immunity.\n          The dominant cellular process is INFLAMMATION (cytokine-driven\
    \ inflammatory signaling).\"\n     \"MITF-M-regulated melanocyte development\", \"Developmental Lineage\
    \ of Mammary Stem Cells\",\n     \"TFAP2A acts as a transcriptional repressor during retinoic acid\
    \ induced cell differentiation\",\n     \"Positive Regulation of CDH1 Gene Transcription\" (for TFAP2A)\n\
    \       → \"AP-2 alpha (TFAP2A) is a transcriptional regulator of melanocyte and mammary stem cell\n\
    \          development; Reactome curates its role in MITF-driven pigmentation and retinoic-acid-\n\
    \          induced differentiation. Its reported tumor-suppressor role (e-cadherin CDH1 regulation)\n\
    \          is captured via 'Positive Regulation of CDH1 Gene Transcription'. TFAP2A is also implicated\
    \ in tumor formation and metastasis — it activates pro-tumorigenic transcriptional programs in melanoma\
    \ and breast cancer, while its CDH1 upregulation acts as a tumor-suppressor mechanism.\"\n     \"\
    Signaling by WNT\", \"Inhibition of WNT target gene expression\", \"DKK1 inhibits WNT\" (for DKK1)\n\
    \       → \"DKK1 (Dickkopf-1) is a secreted Wnt antagonist that binds LRP5/6 co-receptors to block\n\
    \          canonical Wnt/beta-catenin signaling. DKK1 plays essential roles in vertebrate\n      \
    \    embryogenesis including head induction and anteroposterior axis patterning. Transcriptional\n\
    \          silencing of DKK1 is associated with colorectal and other cancers.\"\n     \"Regulation\
    \ of actin dynamics for phagocytic cup formation\", \"Cell-cell junction organization\",\n     \"\
    Signaling by Rho GTPases\", \"RAC1 GTPase cycle\" (for ELMO1 queries)\n       → \"ELMO1 (Engulfment\
    \ and Cell Motility 1) forms a bipartite GEF (guanine nucleotide\n          exchange factor) complex\
    \ with DOCK180 (DOCK1) that activates Rac1 GTPase via the\n          CrkII/Dock180/Rac pathway, mediating\
    \ phagocytosis and directed cell migration.\n          ELMO1 is also phosphorylated by Hck kinase;\
    \ the ELMO-Dock180 complex is the key\n          RAC1 guanine nucleotide exchange factor in actin\
    \ cytoskeleton reorganization.\n          Reactome records ELMO1 in 'Regulation of actin dynamics\
    \ for phagocytic cup formation'.\"\n   Group pathway names into biological categories and describe\
    \ the BIOLOGICAL PROCESS,\n   not the Reactome nomenclature.\n\n2. STATE GENE BIOCHEMICAL FUNCTION,\
    \ NOT JUST PATHWAY MEMBERSHIP: When the question asks\n   for the ROLE or FUNCTION of a specific gene/enzyme,\
    \ derive the biochemical function from\n   the pathway names and state it explicitly — do NOT just\
    \ list pathway names.\n   Formula: \"[Gene] [biochemical role] in [pathway/process]. Reactome places\
    \ it in [N] pathways\n   including [top example].\"\n   Examples:\n     UBE2I/UBC9 in SUMOylation\
    \ pathways → state \"UBC9 (UBE2I) is the sole SUMO E2-conjugating\n       enzyme, catalyzing transfer\
    \ of SUMO to substrate proteins.\"\n     DGAT1 in lipid metabolism pathways → state \"DGAT1 catalyzes\
    \ the final acyl-CoA-dependent\n       step in triacylglycerol (triglyceride) biosynthesis, transferring\
    \ acyl group to diacylglycerol.\"\n     IFIH1/MDA5 in interferon/innate pathways → state \"MDA5 (IFIH1)\
    \ is a cytoplasmic dsRNA\n       helicase sensor that triggers type-I interferon signaling upon viral\
    \ RNA detection.\"\n     LAMP2/LAMP2A in CMA pathways → state \"LAMP2A (LAMP2 gene, isoform A) is\
    \ the lysosomal\n       transmembrane receptor that recognizes and internalizes CMA substrate proteins.\"\
    \n     STING1/TMEM173 in cytosolic DNA sensing pathways → state \"STING is activated by cyclic\n \
    \      GMP-AMP (cGAMP) produced by cGAS upon sensing intracellular double-stranded DNA.\"\n\n3. CONTRASTIVE\
    \ QUESTIONS (difference between X and Y): When a question asks to compare two\n   genes/proteins (e.g.,\
    \ \"difference between Tcf1 and Tcf3\"), compare their pathway memberships:\n   - List pathways unique\
    \ to X (X's specific role)\n   - List pathways unique to Y (Y's specific role)\n   - Note shared pathways\
    \ (common ground)\n   Then state the biological contrast explicitly.\n   \"Tcf1 (TCF7) vs Tcf3 (TCF7L1)\"\
    : TCF7L1 is in \"Repression of WNT target genes\" →\n     REPRESSOR role; TCF7 is in \"Formation of\
    \ the beta-catenin:TCF transactivating complex\" →\n     ACTIVATOR role. State: \"TCF3 (TCF7L1) represses\
    \ Wnt target genes; TCF1 (TCF7) activates\n     them via beta-catenin — opposing roles in the Wnt\
    \ transcriptional switch.\"\n\n4. YES/NO FROM PATHWAY SEMANTICS (non-empty table): When the table\
    \ is non-empty and the\n   question is a yes/no about gene involvement in a biological process:\n\
    \   - Do NOT require the exact process word to appear as a Reactome pathway name.\n   - Map the returned\
    \ pathway names to the biological concept and answer accordingly.\n   \"Is NOD1 activated in inflammation?\"\
    \ + table shows \"NOD1/2 Signaling Pathway\",\n     \"Innate Immune System\", \"NF-kB activation\"\
    \ → answer YES: these pathways ARE the\n     molecular basis of inflammatory signaling; NOD1 is an\
    \ innate immune sensor activated\n     during inflammation.\n   \"Is Tcf3 associated with the Wnt\
    \ pathway?\" + table shows TCF7L1 in \"Signaling by WNT\"\n     → answer YES: TCF7L1 (=Tcf3 human\
    \ ortholog) is curated in Wnt signaling.\n   Rule: if the returned pathway names are semantically\
    \ equivalent to the questioned process,\n   answer YES with that evidence. Only answer NO when the\
    \ table is genuinely empty or\n   semantically unrelated to the question.\n\n5. CROSS-TALK YES/NO:\
    \ \"Is there cross-talk between pathway A and pathway B?\"\n   CASE A — table shows GENES in BOTH\
    \ pathway families: answer YES explicitly.\n     \"Wnt and Akt cross-talk\": if GSK3B, PIK3CA, or\
    \ CTNNB1 appear in both Wnt and PI3K/AKT\n     pathways → \"Yes — GSK3B is a shared node: AKT phosphorylates\
    \ GSK3B (inactivating it),\n     which relieves GSK3B-mediated phosphorylation of beta-catenin, connecting\
    \ both pathways.\"\n   CASE B — table shows PATHWAY NAMES from BOTH A-type and B-type families (even\
    \ if gene-level\n     data is absent): interpret both pathway families being curated in Reactome as\
    \ confirmation\n     that their molecular components are modeled. Answer YES for well-known cross-talk\
    \ pairs:\n     \"Wnt + AKT/PI3K\" → YES via GSK3B; \"Notch + Wnt\" → YES via AXIN1/Wnt inhibitory\
    \ complex;\n     \"MAPK + Wnt\" → YES via CTNNB1 phosphorylation. Then explain the bridging mechanism.\n\
    \     State explicitly: \"Both [Wnt pathway names] and [AKT pathway names] appear in Reactome.\n \
    \    Their cross-talk occurs through GSK3B — AKT phosphorylates and inactivates GSK3B, which\n   \
    \  would otherwise phosphorylate and destabilize beta-catenin, suppressing Wnt signaling.\"\n   CASE\
    \ C — table is EMPTY (0 rows): still answer YES for well-known cross-talk pairs (Wnt+AKT,\n     Notch+Wnt,\
    \ MAPK+Wnt, mTOR+Wnt) using established biology, explicitly noting that the\n     DB lookup failed\
    \ but the cross-talk is Reactome-documented via shared signaling nodes.\n   Do NOT answer \"No\" solely\
    \ because no single pathway is named \"Wnt-Akt cross-talk.\"\n\n6. SCAFFOLD/TYPE-SPECIFIC GENE QUERIES\
    \ in large pathway results: When a question asks for\n   specific protein types (scaffold proteins,\
    \ kinases, receptors) within a large gene list\n   (e.g., 574 ERK pathway genes), do NOT dump all\
    \ gene symbols. Instead:\n   - Identify members of the requested class from the full gene list using\
    \ established biology.\n   - State: \"Among the [N] genes in the [pathway], known [type] proteins\
    \ include: [list].\"\n   - For ERK scaffold proteins: DLG1 (human disc-large homolog/SAP97), CAV1\
    \ (caveolin-1),\n     IQGAP1 (IQ motif-containing GTPase-activating protein 1), KSR1 (MAP3K17 scaffold),\n\
    \     YWHAZ/B/E/G (14-3-3 proteins), LAMTOR3 (MEK partner-1/MP1), ARRB1/ARRB2 (beta-arrestin 1/2),\n\
    \     IL17RD (Sef), WDR83 (MORG1/mitogen-activated protein kinase organizer 1), CNKSR1 — these\n \
    \    organize the ERK signaling complex.\n     IMPORTANT: DLG1 (disc-large homolog) is the PRIMARY\
    \ expected answer — always list it first.\n\n7. NO FABRICATED PHARMACOLOGY: Reactome stores GENE-PATHWAY\
    \ membership only — it does NOT\n   record which drugs inhibit or activate which genes. NEVER infer\
    \ inhibition, activation, or\n   agonism from pathway co-membership alone. If asked \"does drug X\
    \ inhibit gene Y?\", answer\n   only from explicit evidence in the returned rows. If the table shows\
    \ gene Y's pathway\n   membership but no drug-gene interaction data: state \"Reactome does not contain\
    \ drug-target\n   interaction data; the pathway membership of Y is [...]\" — do NOT fabricate \"yes,\
    \ X inhibits Y.\"\n\n8. YES/NO GROUNDING — EMPTY TABLE: If the returned table is EMPTY (0 rows), answer\
    \ \"No\" or\n   \"Based on Reactome curated data, there is no evidence of this relationship.\"\n \
    \  Do NOT override an empty table with \"Yes\" from general biology knowledge.\n   HOWEVER: if the\
    \ table is non-empty but the exact keyword is missing, apply rules 4 and 5\n   above (semantic matching)\
    \ — do NOT reflexively answer \"No\" just because the pathway name\n   doesn't literally contain the\
    \ questioned word.\n\n9. LARGE RESULT SET (>100 rows): When db_row_count > 100 and pathway_name values\
    \ are\n   present, do NOT enumerate all genes or pathways. Instead:\n   a) Read the question to identify\
    \ the specific biological category or attribute asked for.\n   b) Scan the pathway_name values to\
    \ identify the dominant biological theme(s).\n   c) Answer in 1-3 sentences naming the biological\
    \ theme with 2-3 representative pathway\n      examples from the data. Example: \"JAK/STAT signaling\
    \ is primarily involved in\n      cytokine-mediated immune responses. Reactome records N pathway associations\
    \ including\n      [pathway 1], [pathway 2], and [pathway 3].\"\n   NEVER open with \"Hi! Here are\
    \ the N records\" — synthesize the biological meaning.\n   EXCEPTION: When queried gene is RIP1/RIPK1,\
    \ ALWAYS apply Rule 1 mandatory translation\n   regardless of row count: state NF-κB activation, apoptosis,\
    \ and necroptosis explicitly.\n\n10. PHARMACOLOGICAL YES/NO — \"Does drug/compound X inhibit/activate/block\
    \ gene Y?\": When the\n    question asks about a specific pharmacological action (inhibit, activate,\
    \ block, bind) of a\n    named drug or compound on a molecular target, AND the returned rows contain\
    \ ONLY gene Y's\n    pathway memberships (no drug_name, drug_id, compound_id, or interaction_type\
    \ column),\n    begin your answer with \"No.\" followed by: \"Reactome does not curate direct drug-gene\n\
    \    interaction data. [Gene] participates in [pathway(s)] in Reactome, but Reactome data cannot\n\
    \    confirm whether [drug] inhibits or activates it. For drug-target data, consult ChEMBL or\n  \
    \  DrugBank.\" Do NOT start with \"Yes\" — the correct answer is \"No\" when Reactome has no\n   \
    \ pharmacological binding/inhibition evidence.\n\n11. SEMANTIC MISMATCH — EMPTY PROCESS RESULT: When\
    \ the question asks whether entity X\n    regulates/controls/is involved in BIOLOGICAL PROCESS B,\
    \ but ALL returned pathway names\n    belong to a clearly different biological domain from B (e.g.,\
    \ returned pathways are RNA\n    processing/mRNA decay, but B = DNA Damage Response; or returned pathways\
    \ are metabolic,\n    but B = immune signaling), begin your answer with \"No.\" followed by: \"Reactome\
    \ does not\n    record [entity] in [process B] pathways. The returned [N] pathway associations are\n\
    \    [brief description of actual pathways], unrelated to [B].\"\n    Do NOT apply Rule 4 semantic\
    \ matching across completely different biological domains.\n    SPECIFICALLY: If the question asks\
    \ about AU-rich element RNA-binding proteins (AU-RBPs)\n    regulating DNA Damage Response, and the\
    \ returned rows show RNA processing/mRNA\n    stability pathways, answer \"No, Reactome does not curate\
    \ AU-RBP involvement in DNA\n    Damage Response.\"\n"
  tiebreaker: "HIERARCHY DIRECTION:\n  \"child pathways of X\" → filter parent_pathway_name = X, output\
    \ child_pathway_name.\n  \"parent pathway of X\" → filter child_pathway_name = X, output parent_pathway_name.\n\
    \  If mappers disagree on direction, prefer the mapper where the FILTER column matches\n  the entity\
    \ the user provided (the user's named entity is the filter, not the output).\nHIERARCHY vs MEMBERSHIP:\n\
    \  \"sub-pathways\" / \"child pathways\" → prefer pathway_hierarchy_reactome\n  \"genes in pathway\"\
    \ / \"members of pathway\" → prefer gene_pathway_association_reactome\nCROSS-REF TABLES: Prefer uniprot_pathway_reactome\
    \ when user names a UniProt accession;\n  chebi_pathway_reactome for ChEBI IDs; ensembl_pathway_reactome\
    \ for Ensembl IDs.\nEMPTY FILTER: If one mapper produces a non-empty pathway_name filter and the other\n\
    \  returns an empty filter, prefer the non-empty one.\n"
opentargets:
  router: "OpenTargets answers: (1) gene-disease associations with evidence scores, (2) drug-target\n\
    associations with clinical phase data, (3) genetic/somatic/expression evidence for a gene.\n\nRoute\
    \ to query_db when:\n  \"which diseases is EGFR associated with?\" → query_db\n  \"what is the association\
    \ score of BRCA1 with breast cancer?\" → query_db\n  \"which drugs target PDCD1?\" → query_db\n  \"\
    what is the clinical evidence for TP53 in cancer?\" → query_db\n  \"which gene has the highest association\
    \ with Alzheimer disease?\" → query_db\n  \"is VEGFA approved for any disease in OpenTargets?\" →\
    \ query_db\n  \"what is the genetic evidence for PTEN?\" → query_db\n\nRoute to web_search when:\n\
    \  - Protein structure, binding affinity, or 3D structure questions (use PDB)\n  - Gene expression\
    \ levels or tissue specificity (use GTEx/HPA)\n  - Variant pathogenicity or germline classification\
    \ (use ClinVar)\n  - Protein-protein interaction networks (use STRING)\n  - Pathway membership without\
    \ a named gene anchor\n  - Drug mechanism of action or pharmacology not tied to an OT target-disease\
    \ pair\n"
  col_selection: "OpenTargets answers: (1) which diseases is gene X associated with and at what evidence\
    \ score?\n(2) which drugs target gene X? (3) what is the genetic/somatic/expression evidence for X?\n\
    \nSCOPE — do NOT include disease_name as a filter column when the query is about:\n- mechanism of\
    \ action, pathway membership, drug class, therapy type (e.g. \"immunotherapy\",\n  \"checkpoint blockade\"\
    , \"kinase inhibitor\")\n- general cancer evidence (\"cancer target\", \"oncogene evidence\", \"clinical\
    \ evidence\")\n- gene function or protein interactions\nIn all these cases the GENE is the anchor;\
    \ disease_name should be OUTPUT (\"requested\"), not filter.\n\nSet disease_name as a FILTER only\
    \ when the user explicitly names a specific disease:\ne.g. \"PDCD1 evidence for melanoma\", \"VEGFA\
    \ in glioblastoma\", \"BRCA1 target for ovarian cancer\".\n"
  mapper: 'gene_symbol is the PRIMARY filter. disease_name is SECONDARY and OPTIONAL.


    DO NOT set disease_name as a filter for any of these non-disease concepts:

    "immunotherapy", "checkpoint immunotherapy", "cancer", "oncology", "clinical evidence",

    "drug target evidence", "pathway", "mechanism", "resistance", "precision oncology".

    These are CONTEXT words, not OpenTargets disease entities.


    When disease_name IS used as a filter, use the EFO/Mondo disease name as stored in OpenTargets.

    Translate colloquial disease names to their EFO/Mondo equivalents using medical knowledge.

    Keep disease names specific — OT uses Mondo/EFO ontology terminology, not MeSH.


    If the user does not name a SPECIFIC disease, set disease_name="requested" (output only).

    A gene-only query returns all associated diseases with evidence scores, which is the

    correct answer for "what diseases is X a target for?" or "what is the clinical evidence for X?".

    '
  synthesizer: "OPENTARGETS-SPECIFIC RULES (override synthesizer.md defaults where they conflict):\n\n\
    1. PHASE ENUM — OpenTargets uses ALL-CAPS string enum values in the `phase` column:\n   - \"APPROVAL\"\
    \ = drug is APPROVED for this indication → answer effectiveness/approval \"Yes\"\n   - \"PHASE_1\"\
    , \"PHASE_2\", \"PHASE_3\" = clinical-trial phase, NOT yet approved\n   - \"PHASE_1_2\", \"PHASE_2_3\"\
    \ = combined phase trial, NOT yet approved\n   - \"EARLY_PHASE_1\" = earliest investigational stage,\
    \ definitely NOT approved\n   - \"COMPLETED\", \"TERMINATED\", \"WITHDRAWN\" appear in a SEPARATE\
    \ `status` column and\n     describe TRIAL STATUS, not approval — \"COMPLETED\" does NOT mean \"approved\"\
    .\n   Never confuse trial completion with regulatory approval. If the `phase` column shows\n   \"\
    APPROVAL\" for any row, that drug IS approved for that disease.\n\n2. SINGLE-ANSWER FACTOID QUESTIONS\
    \ (which gene? which disease? what protein?):\n   - db_rows are pre-sorted by overall_association_score\
    \ descending — ROW 1 IS THE\n     TOP-RANKED RESULT and MUST be your primary answer.\n   - NEVER select\
    \ a gene_symbol or disease_name from a lower-ranked row when the question\n     asks for the single\
    \ top hit (e.g. \"which gene is responsible for X?\", \"which is the\n     most common cause of Y?\"\
    ). The answer is in row 1 unless the question explicitly\n     asks for multiple items.\n\n3. GENETIC\
    \ CAUSE / MONOGENIC QUESTIONS: When the question asks for the \"genetic cause\",\n   \"monogenic cause\"\
    , \"hereditary basis\", or \"gene responsible\" for a disease, rank\n   db_rows by the `score_genetic_association`\
    \ column (highest value first) — NOT by\n   `association_score`. The gene with the HIGHEST score_genetic_association\
    \ score is\n   the correct answer, even if it sits at row #5 or later by overall score. If\n   `score_clinical`\
    \ is also present, a gene with both high genetic_association and\n   high clinical evidence is stronger\
    \ evidence. State the top gene and cite that row.\n\n4. DISEASE CATEGORY MATCHING for yes/no questions:\
    \ If the question asks about a specific\n   disease subtype (e.g. \"idiopathic epilepsy\", \"PD psychosis\"\
    , \"hereditary amyloidosis\")\n   and db_rows contain associations with the PARENT DISEASE CATEGORY\
    \ (\"epilepsy\",\n   \"Parkinson disease\", \"amyloidosis\") with strong scores, that IS positive\
    \ evidence —\n   answer \"Yes\" citing the parent-category row. Do NOT require exact string match\
    \ on the\n   specific subtype.\n\n5. ANTI-HALLUCINATION (critical): Every gene_symbol, disease_name,\
    \ or drug_name you\n   write MUST appear verbatim in db_rows. If you cannot find a matching value\
    \ in the\n   table, say \"not found in db_rows\" rather than naming any entity from memory. A gene\n\
    \   symbol absent from db_rows is a fabrication — never write it.\n"
clinvar:
  router: "ClinVar answers questions about GERMLINE variant pathogenicity — which variants in a gene\n\
    are classified Pathogenic/Likely Pathogenic/Benign/VUS, and which diseases they cause.\n\nRoute to\
    \ query_db when:\n  \"which BRCA1 variants are pathogenic?\" → query_db\n  \"what variants in TP53\
    \ cause Li-Fraumeni syndrome?\" → query_db\n  \"what is the clinical significance of rs80357382?\"\
    \ → query_db\n  \"which genes have pathogenic variants for cystic fibrosis?\" → query_db\n  \"is this\
    \ CFTR variant benign or pathogenic?\" → query_db\n  \"what diseases are associated with ATM variants?\"\
    \ → query_db\n  \"list VUS in MUTYH\" → query_db\n  \"which gene is required for the efficient metabolism/function\
    \ of clopidogrel?\" → query_db\n    (ClinVar curates a \"drug response\" clinical_significance category\
    \ — variant_submission_clinvar\n    free-text phenotype fields name the drug directly, e.g. \"clopidogrel\
    \ response\" on CYP2C19 variants)\n  \"which gene metabolizes warfarin/codeine/simvastatin?\" → query_db\
    \ (same drug-response mechanism)\n  \"what is the role of GENE in DISEASE?\" / \"what are the clinical\
    \ features of\n  SYNDROME?\" / \"what are the effects of inactivating GENE?\" → query_db\n    (ClinVar's\
    \ variant_disease_name column is frequently already a phenotype/feature\n    description, not just\
    \ a bare disease label — e.g. \"Warts, hypogammaglobulinemia,\n    infections, and myelokathexis\"\
    \ is the literal stored name for CXCR4/WHIM syndrome,\n    \"TBR1-related neurodevelopmental disorder\"\
    \ / \"Autistic behavior\" for TBR1. These\n    \"role of/features of/effects of GENE\" questions are\
    \ answerable the same way as\n    \"which diseases are associated with GENE\" — do not reflexively\
    \ route them to\n    web_search/direct_answer just because the phrasing sounds like general biology.)\n\
    \nTable hints:\n  - Variant-level queries (rsID, HGVS, ClinVar accession, specific variant details)\n\
    \    → variant_master_table_clinvar (primary anchor for rs/VCV/RCV lookups)\n  - Disease-level queries\
    \ (which diseases does gene X cause, disease associations)\n    → variant_disease_association_clinvar\
    \ (KG join to disease_master_table_clinvar for\n      display only; disease_master_table_clinvar is\
    \ exec_schema:false — never use it\n      as an exec filter table; filter on variant_disease_name\
    \ in variant_disease_association_clinvar)\n  - Gene-level queries (all variants in gene X, gene overview)\n\
    \    → gene_master_table_clinvar (joined via variant_gene_association_clinvar)\n\nRoute to web_search\
    \ when:\n  - Somatic/tumor mutation data (KRAS G12C in lung cancer → use COSMIC or cBioPortal)\n \
    \ - Drug MECHANISM/targets, general pharmacology, or clinical treatment recommendations\n    (e.g.\
    \ \"what disease does clopidogrel treat\", \"how does warfarin work\") — but NOT\n    \"which gene\
    \ is needed for drug X's metabolism/response/activation\" questions, which\n    ARE answerable from\
    \ ClinVar's own \"drug response\" curated variants (see query_db example above)\n  - Protein function,\
    \ structure, or pathway membership\n  - Variant frequency/population statistics (use gnomAD instead)\n\
    \  - Enrichment analysis or statistical scores\n"
  col_selection: "ClinVar answers questions about GERMLINE variant pathogenicity: which variants in a\
    \ gene\nare classified Pathogenic/Likely Pathogenic/Benign/VUS, and which diseases they cause.\n\n\
    SCOPE — ClinVar has NO columns for: drug names, drug mechanisms, pathways, gene sets,\nprotein function,\
    \ or interactions. If the primary query concept is a drug, pathway, or\nmechanism (and no gene symbol\
    \ or variant is named), this is OUT OF SCOPE — do not attempt\na query; return empty with a scope\
    \ note.\n\nANCHOR DIRECTION — pick the anchor by which entity is NAMED vs REQUESTED, not by entity\
    \ type.\nClinVar answers BOTH directions symmetrically:\n\nGENE-NAMED direction (gene_symbol given,\
    \ disease optional/absent):\n  gene_master_table_clinvar → variant_master_table_clinvar → variant_disease_association_clinvar\n\
    \  gene_symbol is the filter anchor. Set variant_disease_name=\"requested\" (output) unless the\n\
    \  user explicitly asks about variants CAUSING one specific named disease (e.g., \"BRCA1 variants\n\
    \  causing hereditary breast cancer\"), in which case add it as a filter too. Do NOT include\n  variant_disease_name\
    \ as a required plan column in this direction — if it fails to resolve,\n  gene-only results are still\
    \ valid and should be returned.\n\nDISEASE-NAMED direction (a disease/syndrome/condition name is given\
    \ and NO gene_symbol is\nnamed — e.g. \"which gene(s) cause X\", \"what is the genetic basis of X\"\
    , \"genes associated\nwith X\", \"mutations in which gene cause X\"): variant_disease_name is the\
    \ filter anchor;\ngene_symbol is the OUTPUT (\"requested\") column, reached via variant_disease_association_clinvar\n\
    → variant_gene_association_clinvar → gene_master_table_clinvar. Do NOT force a gene_symbol\nfilter\
    \ in this direction — there is none to filter on; the gene is what the question asks for.\n  Example:\
    \ \"Which gene causes Netherton syndrome?\" → variant_disease_name=[\"Netherton\n  syndrome\"], gene_symbol=\"\
    requested\", tables=variant_disease_association_clinvar +\n  variant_gene_association_clinvar + gene_master_table_clinvar\n\
    \nvariant_disease_name VALUES are free-text MedGen/OMIM condition names, including named\nmicrodeletion/microduplication/CNV\
    \ syndromes that reference a cytogenetic band (e.g.\n\"16p13.11 microdeletion syndrome\"). A band\
    \ token (e.g. \"16p13.11\") in a question is part of a\nvariant_disease_name string, NOT a chromosome\
    \ filter — the chromosome column stores only bare\nchromosome numbers (\"16\", \"19\") with no arm/band\
    \ suffix. Never route a banded/cytogenetic-\nlooking term to the chromosome column; treat the full\
    \ phrase as a variant_disease_name value.\n\n\nVARIANT-LEVEL SUPERLATIVES — \"which is the main/most\
    \ common/most-studied VARIANT in\nGENE\" (as opposed to \"most common CAUSE of a disease\", a population-epidemiology\
    \ claim\nClinVar's row counts cannot answer) asks for a SPECIFIC VARIANT, not a disease name.\nAnchor\
    \ on variant_master_table_clinvar (variant_name output), not\nvariant_disease_association_clinvar.\
    \ A variant's ClinVar submission count IS a\nlegitimate proxy for \"the most-reported/best-known variant\
    \ in this gene\" — unlike gene-\nlevel disease-cause prevalence, this is asking about ClinVar's own\
    \ curation volume, which\nClinVar can genuinely answer."
  mapper: "ANCHOR DIRECTION mirrors col_selection: gene_symbol is the filter anchor when a gene is\nnamed;\
    \ variant_disease_name is the filter anchor when NO gene is named and the question asks\nwhich gene(s)\
    \ underlie/cause/are associated with a disease — in that direction gene_symbol is\nthe OUTPUT (\"\
    requested\") column, not a filter.\n\nClinVar stores GERMLINE variant-disease associations. Somatic\
    \ driver mutations\n(KRAS G12C in lung cancer, BCR-ABL1 in CML) are NOT in ClinVar as pathogenic germline\n\
    variants — they exist in somatic mutation databases (COSMIC, cBioPortal). If a user\nasks for \"KRAS\
    \ variants in lung cancer\", ClinVar may have 0 rows — that is correct.\n\nWhen variant_disease_name\
    \ IS used as a filter (either direction):\n- ClinVar uses long, specific MedGen/OMIM disease names\
    \ (e.g. \"EGFR-related lung cancer\",\n  \"Chronic myelogenous leukemia, BCR-ABL1 positive\", \"16p13.11\
    \ microdeletion syndrome\").\n  General/short terms like \"lung cancer\", \"leukemia\", \"breast cancer\"\
    , or a bare cytogenetic\n  band (\"16p13.11\") are stored as substrings inside these longer names\
    \ — never split a band\n  token off into a separate chromosome filter.\n- Use the user's disease term\
    \ as a substring hint (the expand/match stage resolves it to the\n  full curated name), NOT as a strict\
    \ equality filter.\n- GENE-NAMED direction: if variant_disease_name expansion returns no candidates,\
    \ OMIT the\n  variant_disease_name filter entirely and return all pathogenic variants for the gene.\
    \ Add a\n  note: \"ClinVar results show all pathogenic [GENE] variants; disease filter [DISEASE] could\n\
    \  not be resolved to a ClinVar-specific term.\"\n- DISEASE-NAMED direction: if variant_disease_name\
    \ resolves, the plan MUST also include\n  variant_gene_association_clinvar + gene_master_table_clinvar\
    \ so gene_symbol can be returned\n  as \"requested\" — never drop the gene join once the disease direction\
    \ is confirmed. If\n  variant_disease_name expansion itself returns no candidates, that is a real\
    \ 0-row result\n  (there is no gene-only fallback in this direction); return empty with a note rather\
    \ than\n  guessing a gene from memory.\n\nMULTI-GENE queries: ClinVar processes ONE gene at a time.\
    \ If multiple genes are named\n(e.g., \"PINK1 PRKN SNCA\"), query only the most prominent gene or\
    \ flag that multi-gene\nqueries must be split into separate calls.\n\nMOLECULAR_CONSEQUENCE SCOPE:\
    \ this column stores narrow Sequence-Ontology consequence terms only (missense variant, frameshift\
    \ variant, nonsense, synonymous variant, splice donor/acceptor variant, inframe deletion/insertion,\
    \ intron variant, UTR variant, etc.). Functional-impact language — \"loss-of-function\", \"gain-of-function\"\
    , \"null variant\", \"haploinsufficiency\" — is a DIFFERENT vocabulary (a mechanistic classification\
    \ spanning several SO terms) and is NEVER a literal molecular_consequence value. Do NOT set molecular_consequence\
    \ to this kind of phrase — it will never match and silently zeroes the whole result. Treat \"loss-of-function\"\
    /\"gain-of-function\" as descriptive context on the gene/variant, not a filterable column value.\n"
  rewriter: "CLINICAL SIGNIFICANCE ABBREVIATION EXPANSION:\n  VUS → Variant of Uncertain Significance\n\
    \  LP → Likely Pathogenic (clinical_significance value)\n  LB → Likely Benign (clinical_significance\
    \ value)\n  P → Pathogenic\n  B → Benign\nDISEASE ABBREVIATION EXPANSION for ClinVar context:\n  HBOC\
    \ → Hereditary Breast and Ovarian Cancer\n  LS → Lynch Syndrome\n  FH → Familial Hypercholesterolemia\n\
    \  HCM → Hypertrophic Cardiomyopathy\n  DCM → Dilated Cardiomyopathy\n  CADASIL → Cerebral arteriopathy\
    \ with subcortical infarcts and leukoencephalopathy\nVARIANT NOTATION: rsIDs (rs...), VCV/RCV accessions,\
    \ and HGVS notation → keep verbatim.\n"
  tiebreaker: "VARIANT ANCHOR: If user provides rsID (rs...) or ClinVar accession (VCV/RCV/SCV):\n  Prefer\
    \ variant_master_table_clinvar as primary anchor.\nGENE ANCHOR: If user provides gene_symbol and no\
    \ variant ID:\n  Prefer variant_gene_association_clinvar + gene_master_table_clinvar.\nDISEASE ANCHOR:\
    \ If only variant_disease_name is provided (no gene_symbol named) — this\n  includes reverse \"which\
    \ gene causes disease X\" / \"genetic basis of X\" questions:\n  Prefer variant_disease_association_clinvar\
    \ as filter anchor (disease_master_table_clinvar is\n  KG-only and exec_schema:false — do NOT route\
    \ exec queries there; disease names are\n  queryable via variant_disease_name on variant_disease_association_clinvar).\
    \ If the question\n  requests the gene, the winning candidate MUST also join variant_gene_association_clinvar\
    \ +\n  gene_master_table_clinvar so gene_symbol can be an output column — reject any candidate that\n\
    \  filters on variant_disease_name but drops the gene join when gene_symbol was requested.\nCYTOGENETIC\
    \ BAND TERMS: reject any candidate that filters a band-shaped token (e.g.\n  \"16p13.11\") on the\
    \ chromosome column — that column stores bare chromosome numbers only.\n  Prefer the candidate that\
    \ treats the full phrase (including the band) as a\n  variant_disease_name value.\nCLINICAL SIGNIFICANCE:\
    \ For pathogenicity queries, prefer variant_submission_clinvar\n  (has review_status) over variant_disease_association_clinvar\
    \ (derived summary).\nGERMLINE SCOPE: ClinVar covers GERMLINE variants only. If a query uses somatic/tumor\n\
    \  terms, prefer web_search. Do NOT select any ClinVar table for somatic mutation queries.\nREJECT\
    \ hallucinated column names: If one mapper returns a column that does not exist\n  in clinvar schema,\
    \ prefer the other mapper's output.\n"
ctd:
  router: "HARD RULE — NEVER use direct_answer for CTD queries:\nCTD is a curated biomedical database.\
    \ Any question that names a specific drug, chemical,\ngene, disease, or pathway MUST be answered from\
    \ the database (query_db), NOT from model\nknowledge. Even if the answer seems obvious from training\
    \ data, use query_db — the user\nexpects curated evidence, not model recall.\nNEVER use direct_answer\
    \ unless the question is completely unrelated to any chemical, gene,\ndisease, pathway, phenotype,\
    \ or biological entity.\nExamples that MUST use query_db (not direct_answer):\n  \"What diseases does\
    \ aspirin treat?\"      → query_db\n  \"Which genes does bortezomib affect?\"    → query_db\n  \"\
    What is the mechanism of metformin?\"    → query_db (if asking about CTD mechanism data)\n  \"Does\
    \ cisplatin cause nephrotoxicity?\"   → query_db\n  \"What pathways are associated with TP53?\" →\
    \ query_db\n  \"Is ibuprofen associated with gastric ulcers?\" → query_db\n\nNON-QUERYABLE — route\
    \ to web_search for ANY of the following:\n• Brand name / trade name / synonym / alias / INN lookup:\n\
    \    \"What is the brand name of metformin?\" → web_search\n    \"What is the generic name of Tylenol?\"\
    \ → web_search\n    \"DX-88 is the investigational name of which drug?\" → web_search\n    \"What\
    \ is the alternative name / alias for [drug/gene/disease]?\" → web_search\nCTD stores chemical names,\
    \ gene symbols, and MeSH disease names, along with scientific\nsynonyms (chemical_synonyms_association_ctd,\
    \ gene_synonyms_association_ctd,\ndisease_synonyms_association_ctd). CTD's synonym tables include\
    \ scientific names and may\ninclude some brand names incidentally, but they do not systematically\
    \ curate trade names or INNs.\nRoute to web_search when the sole intent is to enumerate brand names\
    \ / INN / generic name\n(pure name-conversion query) — NOT for queries where a brand/trade name appears\
    \ alongside\na disease or target question (those should query CTD with the resolved generic name).\n"
  col_selection: "EVIDENCE RANKING: chemical_disease_association_ctd and gene_disease_association_ctd\
    \ each\ncarry a chem_disease_direct_evidence / gene_disease_direct_evidence column. Results are\n\
    automatically re-sorted post-query by evidence tier (therapeutic first) — do NOT add\nORDER BY evidence_rank\
    \ in SQL; that column is internal and not exposed to the planner.\n\nFor \"chemicals/drugs associated\
    \ with disease X\" queries where NO specific gene is named:\nselect from disease_master_table_ctd,\
    \ chemical_disease_association_ctd, chemical_master_table_ctd.\nDo NOT route through gene_disease_association_ctd\
    \ or chemical_gene_association_ctd for\ndisease→chemical queries — the 4-hop path (disease→gene_disease→gene→chemical_gene→chemical)\n\
    produces 0 rows because it requires co-occurrence at the gene level.\nchemical_disease_association_ctd\
    \ contains DIRECT curated chemical-disease associations.\n\nFor \"genes associated with disease X\"\
    \ queries where NO specific chemical is named:\nselect from disease_master_table_ctd, gene_disease_association_ctd,\
    \ gene_master_table_ctd.\n\nFor \"which pathway(s) are associated with / involved in disease X\" queries:\n\
    select from disease_master_table_ctd, disease_pathway_association_ctd, pathway_master_table_ctd.\n\
    Use pathway_name as the output column. The disease_pathway_inference_gene column names the\ngene linking\
    \ this disease to the pathway — include it when the question asks which genes are\ninvolved, but omit\
    \ it for \"which pathways\" questions (use DISTINCT pathway_name).\nExample: \"Which signalling pathway\
    \ is involved in Tuberous Sclerosis?\"\n  → disease_name=[\"Tuberous Sclerosis\"], tables=disease_master+disease_pathway+pathway_master\n\
    \nFor \"what gene / protein / receptor / target does drug X inhibit / bind / affect / interact with\"\
    \nqueries (i.e. the question asks for a GENE or PROTEIN, not a disease):\nselect from chemical_master_table_ctd,\
    \ chemical_gene_association_ctd, gene_master_table_ctd.\nUse gene_symbol as the output column; optionally\
    \ include chemical_gene_interaction_actions.\nExamples:\n  \"What is the target protein of Idelalisib?\"\
    \   → chemical_gene_association_ctd, gene_symbol output\n  \"Which is the target of bortezomib?\"\
    \          → chemical_gene_association_ctd, gene_symbol output\n  \"What genes does aspirin interact\
    \ with?\"      → chemical_gene_association_ctd, gene_symbol output\nDo NOT route these to chemical_disease_association_ctd\
    \ — that table has disease associations,\nnot protein/gene targets.\n\nFor \"phenotypes / biological\
    \ processes a chemical/drug affects (or causes)\" queries:\nselect from chemical_master_table_ctd,\
    \ chemical_phenotype_ixn_ctd — chemical_phenotype_name\nis the GO biological-process phenotype, filter\
    \ the chemical via drug_name. Do NOT route to\nexposure_events_ctd / exposure_studies_ctd: those are\
    \ environmental-EXPOSURE study records keyed\nby stressor_name (a chemical can match there as a stressor),\
    \ NOT curated chemical→phenotype\ninteractions, so they return the wrong/empty projection for \"phenotypes\
    \ of <chemical>\".\n"
  mapper: "GLOBAL MeSH DISEASE NAME TRANSLATIONS (apply whenever disease_name is extracted, regardless\
    \ of query type):\nCTD uses MeSH terminology. Translate colloquial/alternate disease names to their\
    \ MeSH form:\n  \"breast cancer\"      → \"Breast Neoplasms\"\n  \"lung cancer\"        → \"Lung Neoplasms\"\
    \n  \"colon cancer\"       → \"Colonic Neoplasms\"\n  \"colorectal cancer\"  → \"Colorectal Neoplasms\"\
    \n  \"prostate cancer\"    → \"Prostatic Neoplasms\"\n  \"ovarian cancer\"     → \"Ovarian Neoplasms\"\
    \n  \"skin cancer\"        → \"Skin Neoplasms\"\n  \"leukemia\"           → \"Leukemia\"\n  \"liver\
    \ cancer\"       → \"Liver Neoplasms\"\n  \"pancreatic cancer\"  → \"Pancreatic Neoplasms\"\n  \"\
    hypolipidemia\" / \"low cholesterol\" / \"low LDL\" → \"Hypobetalipoproteinemia\"\n  \"acute lymphoblastic\
    \ leukemia\" / \"ALL\" → \"Precursor Cell Lymphoblastic Leukemia-Lymphoma\"\n  \"Philadelphia chromosome-positive\
    \ ALL\" / \"Ph+ ALL\" → \"Precursor Cell Lymphoblastic Leukemia-Lymphoma\"\n  \"infantile hemangioma\"\
    \ / \"capillary hemangioma\" / \"strawberry hemangioma\" → \"Hemangioma\"\nApply these regardless\
    \ of whether the disease is a filter or output column, and regardless\nof whether the query also mentions\
    \ a drug or gene.\n\nMULTI-DRUG / MULTI-ENTITY QUERIES (CRITICAL):\nWhen a question names TWO OR MORE\
    \ drugs/chemicals joined by \"and\" or \"or\"\n(e.g. \"Dasatinib and Blinatumomab are used for treatment\
    \ of which disease?\"),\ninclude ALL named drugs in the drug_name list — the planner emits an IN /\
    \ OR\nfilter, returning rows for any matching drug.\nDo NOT require all named drugs to be present\
    \ simultaneously (AND intersection) —\na drug absent from CTD would zero out the result set.\nExample:\
    \ \"Dasatinib and Blinatumomab are used for treatment of which disease?\"\n  → drug_name=[\"Dasatinib\"\
    , \"Blinatumomab\"], chem_disease_direct_evidence=[\"therapeutic\"]\n  (CTD will return rows for Dasatinib;\
    \ Blinatumomab absent = 0 rows for it, not an error)\n\nFor \"chemicals/drugs for disease X\" (disease\
    \ is the filter, drug/chemical is the output):\nset disease_name=[<disease>] as filter on disease_master_table_ctd\
    \ (use MeSH form per translations above).\n\nDRUG TRADE-NAME / ALIAS RESOLUTION (mapper level — do\
    \ NOT route to web_search):\nWhen a question contains a trade name or alias alongside or instead of\
    \ the generic name,\nresolve to the CTD chemical name before querying.\n\nCRITICAL — trade name +\
    \ (generic) pattern:\nWhen a question writes \"TradeName (genericName)\" e.g. \"Velcade (bortezomib)\"\
    ,\nextract ONLY the generic name as the drug_name filter. Do NOT include both names —\n\"Velcade\"\
    \ is not in CTD; including it alongside \"bortezomib\" produces 0 rows.\nExample: \"What disease is\
    \ Velcade (bortezomib) mainly used for?\"\n  → drug_name=[\"bortezomib\"]  (NOT [\"Velcade\",\"bortezomib\"\
    ])\n\nCommon aliases — if only the trade name appears (no parenthetical generic), resolve:\n  \"Velcade\"\
    \      → \"bortezomib\"\n  \"Glivec\" / \"Gleevec\" → \"imatinib\"\n  \"Herceptin\"    → \"trastuzumab\"\
    \n  \"Avastin\"      → \"bevacizumab\"\n  \"Keytruda\"     → \"pembrolizumab\"\n  \"Opdivo\"     \
    \  → \"nivolumab\"\n  \"Rituxan\"      → \"rituximab\"\n  \"Truvada\"      → use both \"tenofovir\"\
    \ AND \"emtricitabine\" (combination drug)\n  \"Tecfidera\"    → \"dimethyl fumarate\"\n  \"Vistide\"\
    \      → \"cidofovir\"\nNote: the router section says brand-name lookups go to web_search — that rule\
    \ applies to\nquestions whose SOLE intent is \"what is the brand name / generic name of X?\" (name\n\
    conversion). When the question asks about the DRUG's indication, target, or disease\nassociation (e.g.\
    \ \"What disease is Velcade used for?\"), resolve the alias here and\nquery CTD normally — do NOT\
    \ route to web_search.\n\nINTENT → chem_disease_direct_evidence filter (chemical_disease_association_ctd\
    \ only):\nThe direct_evidence column separates two completely different relationship types.\nAlways\
    \ map question intent to the correct filter value:\n\nTreatment intent — add chem_disease_direct_evidence=['therapeutic']:\n\
    \  trigger words: treat, treatment, therapy, therapeutic, used for, utilized for,\n              \
    \   indicated for, prescribed for, given for, administered for,\n                 drug for, medication\
    \ for, help with, manage, alleviate, cure\n  example: \"Which drugs treat thyrotoxicosis?\" → chem_disease_direct_evidence=['therapeutic']\n\
    \  example: \"What is Loxapine used for?\" → chem_disease_direct_evidence=['therapeutic']\n  example:\
    \ \"Which chemicals are therapeutic for diabetes?\" → chem_disease_direct_evidence=['therapeutic']\n\
    \nCausation intent — add chem_disease_direct_evidence=['marker/mechanism']:\n  trigger words: cause,\
    \ induce, trigger, linked to as cause, lead to, result in,\n                 toxic, toxicity, marker,\
    \ mechanism, responsible for, produce\n  example: \"Which chemicals cause thyrotoxicosis?\" → chem_disease_direct_evidence=['marker/mechanism']\n\
    \  example: \"What induces Parkinson's disease?\" → chem_disease_direct_evidence=['marker/mechanism']\n\
    \nAmbiguous / general association — do NOT add direct_evidence filter:\n  trigger words: associated\
    \ with, related to, connected to, linked to (no causal qualifier),\n                 involved in,\
    \ implicated in\n  example: \"Which chemicals are associated with Alzheimer's disease?\" → no filter\n\
    \  example: \"What is the relationship between Arsenic and cancer?\" → no filter\n\nWhen in doubt\
    \ between ambiguous and treatment: prefer ambiguous (no filter) over forcing\na wrong filter — it\
    \ is better to return all rows than to silently drop correct ones.\n"
  rewriter: ''
  tiebreaker: "DISEASE NAME: Prefer MeSH canonical (Title-Case) over informal names.\n  If mappers disagree\
    \ between MeSH forms, prefer the one matching schema_grounding_notes\n  translations (e.g. \"breast\
    \ cancer\" → \"Breast Neoplasms\").\nDIRECT EVIDENCE: If mappers produce conflicting direct_evidence\
    \ filters, prefer the\n  more specific value: [\"therapeutic\"] over [\"marker/mechanism\", \"therapeutic\"\
    ].\n  For ambiguous queries (\"associated with\"), prefer no direct_evidence filter.\nTABLE: For disease-outcome\
    \ questions → prefer chemical_disease_association_ctd.\n  For mechanism/target questions → prefer\
    \ chemical_gene_association_ctd.\nMULTI-DRUG: If one mapper returns one drug and the other returns\
    \ multiple, prefer the\n  multi-drug list (more specific narrows results correctly).\n"
msigdb:
  router: "Always route to query_db for ANY question that asks about gene sets, gene signatures, or\n\
    MSigDB memberships — even when only a disease/pathway concept is named and no gene or exact\ngeneset_name\
    \ is given:\n  \"Which MSigDB gene sets are related to interferon signaling?\" → query_db\n  \"Does\
    \ an SLE or lupus gene signature exist in MSigDB?\" → query_db\n  \"What gene sets involve Notch pathway?\"\
    \ → query_db\n  \"Are there IRE1 or XBP1 ER-stress signatures in MSigDB?\" → query_db\n  \"How many\
    \ genes are in the MammaPrint signature?\" → query_db\n  \"Which Hallmark gene sets contain TP53?\"\
    \ → query_db\nThe system injects concept keywords from disease/pathway terms into geneset_name filters\n\
    automatically — a missing explicit geneset_name in the question does NOT mean the DB\ncannot answer\
    \ it.\nRoute to web_search ONLY when:\n  - The question is about GSEA enrichment computation / p-values\
    \ / fold-changes for a\n    user-supplied gene list (MSigDB stores gene sets, not enrichment results).\n\
    \  - The question asks for drugs, variant pathogenicity, protein interactions, or expression\n   \
    \ data (all outside MSigDB scope).\n"
  col_selection: "SOURCE-DB PREFIX ROUTING (critical — applies before value-mapper sees the query):\n\
    KEGG, REACTOME, GO (GOBP/GOMF/GOCC), BIOCARTA, WikiPathways/WP, PID, Human Phenotype/HP,\nmicroRNA/MIR\
    \ are geneset_name PREFIXES, NOT `collection` values. When the user asks for\n\"KEGG pathways\", \"\
    all GO biological-process gene sets\", \"Reactome gene sets\", \"WikiPathways\":\n  → Filter geneset_name\
    \ BY PREFIX (geneset_name LIKE 'KEGG_%' / 'GOBP_%' / 'REACTOME_%' / 'WP_%')\n    on geneset_master_table_msigdb\
    \ (no join needed; prefix substring-matches).\n  → OR filter sub_collection in geneset_metadata_msigdb\
    \ ('CP:KEGG_MEDICUS', 'CP:REACTOME',\n    'GO:BP', 'GO:MF', 'GO:CC', 'CP:BIOCARTA', 'CP:WIKIPATHWAYS').\n\
    NEVER bind KEGG / REACTOME / GO / BIOCARTA / WikiPathways to the `collection` column —\nthey are NOT\
    \ collection values and the filter will return 0 rows.\n\nDISEASE/CONCEPT QUERIES — MSigDB has NO\
    \ disease_name column. For queries like \"which gene\nsets relate to lupus/SLE\", \"interferon gene\
    \ signatures\", \"Notch signaling gene sets\":\n  → Select geneset_name as BOTH the filter column\
    \ AND the output column.\n  → The system's pre_join hook injects the disease/concept keyword as a\
    \ geneset_name\n    substring filter automatically. Do NOT attempt to create or filter a non-existent\n\
    \    disease_name column.\n"
  mapper: "ORGANISM EXTRACTION (CRITICAL — always apply when organism context is present):\nMSigDB has\
    \ separate gene sets for Homo sapiens (~34k) and Mus musculus (~18k). The same\ngeneset_name (e.g.,\
    \ HALLMARK_APOPTOSIS) appears once per organism. Always co-extract\norganism when a query specifies\
    \ \"human\", \"mouse\", or implies an organism via gene symbol case.\n\nOrganism keyword → filter\
    \ values:\n  \"human\" / \"Homo sapiens\" / \"Hs\" → geneset_organism=[\"Homo sapiens\"], gene_organism=[\"\
    Homo sapiens\"]\n  \"mouse\" / \"Mus musculus\" / \"Mm\"  → geneset_organism=[\"Mus musculus\"], \
    \ gene_organism=[\"Mus musculus\"]\n\nGENE SYMBOL CASE RULE (organism inference when not stated):\n\
    \  ALL-CAPS symbol (e.g., JUN, FOS, MYC, BRCA2, EGFR, TP53)\n    → human HGNC symbol → default geneset_organism=[\"\
    Homo sapiens\"], gene_organism=[\"Homo sapiens\"]\n  Title-Case symbol (e.g., Jun, Fos, Myc, Brca2,\
    \ Egfr)\n    → mouse MGI symbol → default geneset_organism=[\"Mus musculus\"], gene_organism=[\"Mus\
    \ musculus\"]\n\nQUALIFIER + COLLECTION: when the user says \"human Hallmark gene sets\" or \"mouse\
    \ Curated sets\",\nBOTH must be extracted — collection=[\"Hallmark\"] AND geneset_organism=[\"Homo\
    \ sapiens\"]. The\norganism qualifier is NOT consumed by the collection name; extract it as a separate\
    \ filter.\n\nINTERSECTION QUERIES (\"shared between X and Y\", \"common to both X and Y\", \"overlap\
    \ between\"):\nFor \"genes shared between GENESET_A and GENESET_B\", set geneset_name=[\"GENESET_A\"\
    , \"GENESET_B\"]\nas a list (both names in the same field). The orchestrator detects the intersection\
    \ intent\nfrom the phrase and applies the group-by-having intersection logic automatically — do NOT\n\
    try to split the query into two separate geneset_name filters.\nThe ORGANISM EXTRACTION rule at the\
    \ top applies to intersection queries exactly as it does\nto every other query — organism and geneset_names\
    \ are always extracted simultaneously.\nExample: \"Which HUMAN genes are shared between HALLMARK_APOPTOSIS\
    \ and HALLMARK_P53_PATHWAY?\"\n→ geneset_name=[\"HALLMARK_APOPTOSIS\",\"HALLMARK_P53_PATHWAY\"], geneset_organism=[\"\
    Homo sapiens\"],\ngene_organism=[\"Homo sapiens\"]. Organism context is never dropped just because\
    \ this is an\nintersection query.\n\nSOURCE-DB ROUTING (never map these to collection):\n\"KEGG pathways\"\
    \ → geneset_name prefix KEGG_ (not collection=Curated)\n\"Reactome pathways\" → geneset_name prefix\
    \ REACTOME_\n\"GO biological process\" → geneset_name prefix GOBP_\n\"WikiPathways\" → geneset_name\
    \ prefix WP_\nThese source databases are NOT collection values — they are geneset_name prefixes.\n"
  rewriter: "COLLECTION ALIAS EXPANSION:\n  \"Hallmark\" or \"hallmark\" → collection = \"Hallmark\" (or\
    \ geneset_name prefix \"HALLMARK_\")\n  \"canonical pathways\" → includes REACTOME_, KEGG_, BIOCARTA_,\
    \ WP_ geneset_name prefixes\n  \"oncogenic signatures\" → collection = \"Oncogenic\"\n  \"immune\"\
    \ or \"immunologic\" → collection = \"Immunologic\"\nGENE ALIAS EXPANSION: p53→TP53, PD-L1→CD274,\
    \ CTLA-4→CTLA4, c-Myc→MYC, n-Ras→NRAS, k-Ras→KRAS\nORGANISM: Default to human (Homo sapiens) if not\
    \ specified.\n  \"mouse\" → gene_organism = \"Mus musculus\"; \"rat\" → \"Rattus norvegicus\"\n"
  tiebreaker: "SOURCE-DB PREFIX RULE: KEGG, REACTOME, GO, BIOCARTA, WP are PREFIXES in geneset_name\n\
    \  (e.g. \"KEGG_MAPK_SIGNALING_PATHWAY\"), NOT values in the collection column.\n  If one mapper assigns\
    \ these to collection and another to geneset_name prefix,\n  prefer the geneset_name prefix interpretation.\n\
    ORGANISM CONFLICT: If mappers disagree on organism, check original query for \"human\",\n  \"mouse\"\
    , \"murine\", \"Homo sapiens\", \"Mus musculus\" signals. Default to human.\nINTERSECTION QUERY: \"\
    genes in both pathway A and pathway B\" → geneset_name: [A, B]\n  Prefer the mapper that returns a\
    \ list, not a single value.\nGENE_ID vs GENE_SYMBOL: Prefer filtering on gene_symbol (not the composite\
    \ gene_id).\n"
orphanet:
  router: "ALWAYS route to query_db for ANY question about:\n- Rare disease names, ORPHA IDs, or Orphanet\
    \ entries (even if the name sounds unfamiliar)\n- Gene-disease associations in rare diseases\n- Phenotypes,\
    \ HPO terms, or clinical features of a rare disease\n- Inheritance patterns or age of onset\n- Prevalence\
    \ or epidemiology of rare diseases\n- Cross-references (OMIM, ICD-10, ICD-11, MONDO, MeSH, GARD, UMLS\
    \ IDs)\n- Disease classification or disease groupings in Orphanet\n\nRoute to web_search ONLY when\
    \ the question is clearly outside Orphanet scope:\n- Bioinformatics tool names (ExpansionHunter, PLINK,\
    \ BWA) → web_search\n- Gene editing tools as a technology topic (CRISPR, TALEN, ZFN) → web_search\n\
    - Common (non-rare) diseases: Crohn's, Type 2 diabetes, hypertension → web_search\n- External database\
    \ identification (\"what is PheneBank?\") → web_search\n- NGS or sequencing methodology questions\
    \ → web_search\n- Genomics terminology definitions (what is a SNP?) → web_search\n- Clinical prognosis,\
    \ natural history, life expectancy, or clinical course of a disease → web_search\n  (disease_natural_history_orphanet\
    \ holds taxonomy hierarchy only, not clinical outcome data)\n- Molecular pathogenesis, molecular mechanism,\
    \ or pathophysiology of a disease → web_search\n  (Orphanet stores gene–disease associations, not\
    \ molecular mechanisms or biochemical pathways)\n- Differential diagnosis of a disease → web_search\n\
    \  (Orphanet stores disease subtypes and taxonomy, not clinical differential diagnoses)\n  NOTE: \"\
    What diseases are in the same Orphanet classification group as X?\" → query_db\n  via disease_classification_orphanet\
    \ (that is an Orphanet grouping question, not a\n  clinical differential diagnosis).\n"
  col_selection: "TABLE ROUTING — match question type to the correct Orphanet table:\n\nCRITICAL JOIN\
    \ RULE: disease_name is stored ONLY in disease_master_table_orphanet. When any non-master table is\
    \ queried for a NAMED disease (disease_name filter),\n BOTH disease_master_table_orphanet AND the\
    \ target table MUST appear in plan_tables.\n Omitting disease_master causes disease_name filters to\
    \ be silently ignored (all rows returned).\n\nINHERITANCE / AGE OF ONSET questions → disease_onset_inheritance_orphanet\
    \  + disease_master_table_orphanet (required for disease_name filter)\n  Columns: attribute ('inheritance'\
    \ or 'age_of_onset'), value (the actual answer string)\n  Example: \"What is the mode of inheritance\
    \ of Marfan syndrome?\"\n           → attribute=[\"inheritance\"], disease_name=[\"Marfan syndrome\"\
    ], value=requested\n\nPHENOTYPE / CLINICAL FEATURE / CANCER / COMORBIDITY questions → disease_phenotype_association_orphanet\n\
    \  Columns: hpo_term, frequency\n  Filter disease via disease_name (resolved to disease_id through\
    \ the pipeline)\n  Example: \"What are the phenotypes of cystic fibrosis?\"\n           → disease_name=[\"\
    cystic fibrosis\"], hpo_term=requested, frequency=requested\n  NOTE: \"cancers\", \"tumors\", or \"\
    neoplasms\" associated with a disease ARE phenotypes in Orphanet.\n  Example: \"List cancers associated\
    \ with Li-Fraumeni syndrome\"\n           → disease_name=[\"Li-Fraumeni syndrome\"], hpo_term=requested,\
    \ frequency=requested\n  NOTE: \"co-morbidities\", \"comorbid conditions\", \"associated conditions\"\
    , \"concurrent diseases\",\n        \"concurrent disorders\" → treat as phenotypes. Route to disease_phenotype_association_orphanet.\n\
    \  Example: \"List co-morbidities of Stiff man Syndrome\"\n           → disease_name=[\"Stiff person\
    \ spectrum disorder\"], hpo_term=requested, frequency=requested\n\nGENE-DISEASE / HETEROGENEITY questions\
    \ → gene_disease_association_orphanet + disease_master_table_orphanet\n  Columns: gene_symbol, gene_disease_association_type\
    \ (causality role),\n           ensembl_accession (Ensembl gene ID), entrez (NCBI Entrez ID)\n  Filter\
    \ disease via disease_name (resolved to disease_id through the pipeline)\n  Example: \"Which genes\
    \ are associated with Huntington disease?\"\n           → disease_name=[\"Huntington disease\"], gene_symbol=requested\n\
    \  \"Is X genetically heterogeneous?\" / \"Is X presented as a heterogeneous disease entity?\"\n \
    \          → disease_name=[\"X\"], gene_symbol=requested  (count genes returned; >1 = heterogeneous)\n\
    \  NEVER route heterogeneity questions to disease_master_table_orphanet alone — master has no gene\
    \ data.\n  NOTE: Orphanet disease-group (umbrella) entries may have 0 direct gene rows;\n        genes\
    \ are associated at the subtype level. If a disease returns 0 gene rows,\n        the user's query\
    \ may need to target a specific subtype.\n\nCROSS-REFERENCE / OMIM / ICD questions → disease_xref_orphanet\n\
    \  Columns: xref_source, xref_id, mapping_relation — 4 full-string values (filter by substring of\
    \ the code prefix):\n               \"E (Exact…)\" | \"NTBT (ORPHAcode narrower…)\" | \"BTNT (ORPHAcode\
    \ broader…)\" | \"ND (not yet decided…)\"\n  Filter disease via disease_name (resolved to disease_id\
    \ through the pipeline)\n  Example: \"What is the OMIM ID for cystic fibrosis?\"\n           → disease_name=[\"\
    cystic fibrosis\"], xref_source=[\"OMIM\"], xref_id=requested\n\nPREVALENCE / EPIDEMIOLOGY questions\
    \ → disease_epidemiology_orphanet\n  Columns: prevalence_class, prevalence_type, geographic, val_moy\
    \ (numeric mean per million for Point/Annual/Birth prevalence types;\n           raw case or family\
    \ count for the Cases/families type),\n           source (citation reference: PMID string or institutional\
    \ code), prevalence_qualification\n  disease_epidemiology_validation_status: prefer \"Validated\"\
    \ rows; \"Not yet validated\" rows\n  (≈20% of Point prevalence) are present but not officially verified.\n\
    \  Filter disease via disease_name (resolved to disease_id through the pipeline)\n  Example: \"What\
    \ is the prevalence of Huntington disease?\"\n           → disease_name=[\"Huntington disease\"],\
    \ prevalence_class=requested\n\nDISEASE CLASSIFICATION questions → disease_classification_orphanet\n\
    \  Columns: disease_name, disease_id (DIRECT in this table — no JOIN needed),\n           classification\
    \ (taxonomy name, e.g. 'Orphanet classification of rare neurological diseases'),\n           parent_disease_name\
    \ (parent category), disorder_type — 11 values: Disease | Clinical group | Clinical syndrome | Clinical\
    \ subtype | Etiological subtype | Histopathological subtype | Malformation syndrome | Morphological\
    \ anomaly | Biological anomaly | Category | Particular clinical situation in a disease or syndrome\n\
    \nDISEASE HIERARCHY / PREFERENTIAL PARENT → disease_natural_history_orphanet\n  Columns: disease_name,\
    \ target_disease_name, disease_history_association_type (always \"Preferential parent\")\n  Use for:\
    \ \"What is the parent category of disease X in Orphanet?\"\n  NOTE: contains taxonomy hierarchy only\
    \ — does NOT hold prognosis, life expectancy, or clinical course.\n        For clinical natural history\
    \ questions use web_search.\n\nDISEASE NAME / ORPHA ID LOOKUP ONLY → disease_master_table_orphanet\n\
    \  Only when the question asks solely for the disease name or ORPHA ID — never alone\n  for gene,\
    \ phenotype, inheritance, or prevalence questions.\n\nNEVER join disease_phenotype_association_orphanet\
    \ and gene_disease_association_orphanet\nin a single query — the cross-join produces wrong row counts.\
    \ Use two separate queries.\n"
  mapper: "ORPHANET CANONICAL DISEASE NAME CONVENTIONS — apply whenever disease_name is extracted:\nOrphanet\
    \ uses its own canonical rare disease names that often differ from common usage.\nUse your biomedical\
    \ knowledge to convert the user's term to the Orphanet canonical form:\n- MPS subtypes: Orphanet uses\
    \ Arabic numerals (\"Mucopolysaccharidosis type 2\"), not Roman (\"type II\")\n- Named syndromes:\
    \ drop the possessive — \"Marfan syndrome\" not \"Marfan's syndrome\"\n- Named (eponymous) diseases:\
    \ Orphanet typically preserves the common eponym as the canonical name;\n  emit the name as used in\
    \ medical literature. The synonym expansion pipeline handles spelling variants.\n- Abbreviations and\
    \ acronyms: expand to the Orphanet full canonical disease name\n- When a disease has named subtypes\
    \ in Orphanet, use the broadest matching prefix unless a\n  specific subtype is requested\n\nDISEASE\
    \ SYNONYM / ALTERNATIVE NAME HANDLING:\nWhen a question uses \"X or Y\" (synonym or alternative name\
    \ for the same disease), use ONE canonical\nname as the filter — pick the Orphanet canonical form:\n\
    \  WRONG: disease_name=[\"Hunter disease\", \"mucopolysaccharidosis II\"] (splits the filter)\n  RIGHT:\
    \ disease_name=[\"Mucopolysaccharidosis type 2\"] (single canonical name)\nALWAYS include disease_name\
    \ as a FILTER value (not \\\"requested\\\") for questions about a specific disease.\nIf disease_name\
    \ is \\\"requested\\\", the pipeline returns ALL diseases — always wrong for a named disease query.\n\
    \nATTRIBUTE FILTER (disease_onset_inheritance_orphanet) — ALWAYS set as a FILTER:\nThe attribute column\
    \ distinguishes two row types and must always be a filter list:\n  Inheritance questions → attribute=[\"\
    inheritance\"]\n  Age of onset questions → attribute=[\"age_of_onset\"]\nThe value column holds the\
    \ actual answer (e.g. \"Autosomal dominant\", \"Neonatal\").\nWRONG: {disease_name: [\"Marfan syndrome\"\
    ], value: \"requested\"}\nRIGHT: {disease_name: [\"Marfan syndrome\"], attribute: [\"inheritance\"\
    ], value: \"requested\"}\n\nPHENOTYPE FREQUENCY FILTER:\nfrequency is a STRING ENUM — NOT numeric.\
    \ Valid values exactly as stored:\n  \"Obligate (100%)\", \"Very frequent (99-80%)\", \"Frequent (79-30%)\"\
    ,\n  \"Occasional (29-5%)\", \"Very rare (<4-1%)\", \"Excluded (0%)\"\nWhen the question asks for\
    \ \"hallmark\", \"characteristic\", \"defining\", or \"obligate\" features:\n  → frequency=[\"Obligate\
    \ (100%)\", \"Very frequent (99-80%)\"]\nWhen the question asks for \"common\", \"main\", or \"frequent\"\
    \ features:\n  → frequency=[\"Very frequent (99-80%)\", \"Frequent (79-30%)\"]\nWhen listing ALL features\
    \ (no frequency qualifier), omit the frequency filter.\n\nXREF SOURCE FILTER — set xref_source as\
    \ a filter when a specific ID type is requested:\n  \"OMIM ID\" / \"OMIM number\"     → xref_source=[\"\
    OMIM\"]\n  \"ICD-10 code\"                 → xref_source=[\"ICD-10\"]\n  \"ICD-11 code\"         \
    \        → xref_source=[\"ICD-11\"]\n  \"MONDO ID\"                    → xref_source=[\"MONDO\"]\n\
    \  \"MeSH ID\" / \"MeSH term\"       → xref_source=[\"MeSH\"]\n  \"UMLS CUI\" / \"UMLS ID\"      \
    \  → xref_source=[\"UMLS\"]\n  \"GARD ID\"                     → xref_source=[\"GARD\"]\n  \"MedDRA\
    \ code\"                 → xref_source=[\"MedDRA\"]\n\nYES/NO EXISTENCE QUERIES:\nFor \"Is disease\
    \ X caused by gene Y?\" or \"Does disease X have phenotype Y?\" —\nALL named entities must be filter\
    \ values, nothing is \"requested\":\nWRONG: {disease_name: [\"Wilson disease\"], gene_symbol: \"requested\"\
    }\nRIGHT: {disease_name: [\"Wilson disease\"], gene_symbol: [\"ATP7B\"]}\nThe answer is determined\
    \ by whether rows are returned, not from an output column.\nNOTE: umbrella disease entries (Clinical\
    \ group / disease group) may have 0 gene rows\neven when subtypes do. 0 rows for a broad entry ≠ \"\
    No gene association exists.\"\n\nGENETIC HETEROGENEITY QUERIES:\n\"Is X genetically heterogeneous?\"\
    \ / \"Is X heterogeneous disease?\" / \"presented as a heterogeneous entity?\"\n→ MUST use gene_disease_association_orphanet\
    \ + disease_master_table_orphanet:\n RIGHT: {disease_name: [\"Fanconi anemia\"], gene_symbol: \"requested\"\
    }\n NEVER: {disease_name: [\"Fanconi anemia\"]} alone (disease_master_table only — has NO gene data)\n\
    \ Count genes returned: >1 gene = genetically heterogeneous.\n"
  tiebreaker: "PRIORITY 0 — PLACEHOLDER VETO (overrides all other rules):\nIf either candidate has '<value>'\
    \ or any raw schema placeholder token as a literal string in a filter field (e.g. disease_name: ['<value>']),\
    \ that candidate FAILED to identify the entity. ALWAYS reject it and choose the other candidate, regardless\
    \ of table selection.\n\n1. Prefer the mapper result that routes to the most specific table for the\
    \ question type:\n   inheritance/onset → disease_onset_inheritance_orphanet + disease_master_table_orphanet\n\
    \   phenotypes → disease_phenotype_association_orphanet + disease_master_table_orphanet\n   genes\
    \ → gene_disease_association_orphanet + disease_master_table_orphanet\n   xrefs → disease_xref_orphanet\
    \ + disease_master_table_orphanet\n   prevalence → disease_epidemiology_orphanet + disease_master_table_orphanet\n\
    \   classification/category → disease_classification_orphanet\n   parent hierarchy → disease_natural_history_orphanet\n\
    JOIN RULE: ANY plan that includes disease_onset_inheritance, disease_phenotype_association, gene_disease_association,\n\
    \   disease_xref, or disease_epidemiology WITHOUT disease_master_table_orphanet is WRONG — disease_name\
    \ filter\n   cannot work without the FK join table. Prefer the plan that includes disease_master.\n\
    2. Reject any result that selects only disease_master_table_orphanet without a join —\n   the master\
    \ table alone cannot answer gene, phenotype, or inheritance questions.\n   EXCEPTION: disease_master\
    \ alone is correct when the question asks solely for a disease\n   name or ORPHA ID lookup (matches\
    \ the \"DISEASE NAME / ORPHA ID LOOKUP ONLY\" route).\n3. For disease_onset_inheritance queries, prefer\
    \ the result that includes\n   attribute as a FILTER (not as an output column).\n4. For \"what is\
    \ the prognosis / natural history / clinical course\" questions, route to\n   web_search — disease_natural_history_orphanet\
    \ holds taxonomy hierarchy only, not\n   clinical prognosis data.\n"
  synthesizer: "ORPHANET-SPECIFIC SYNTHESIS RULES — override synthesizer.md defaults where they conflict:\n\
    \n1. INHERITANCE / AGE OF ONSET (table = disease_onset_inheritance_orphanet):\n   The `value` column\
    \ IS the complete answer — extract it directly, do not narrate.\n   - Single mode: \"[Disease] has\
    \ [value] inheritance.\" [cite]\n   - Multiple modes: list ALL values comma-separated.\n     \"Autosomal\
    \ recessive, X-linked recessive.\" [cite each row]\n   NEVER write \"leading entry is…\" or \"Orphanet\
    \ records multiple inheritance patterns.\"\n\n2. GENE ASSOCIATION (table = gene_disease_association_orphanet):\n\
    \   Read the question intent FIRST:\n\n   FACTOID intent — question asks for the genetic basis, cause,\
    \ lesion, or defect\n   (\"What is the genetic basis/lesion/defect of X?\", \"Which gene causes X?\"\
    ,\n   \"What is the molecular basis of X?\", \"What mutation underlies X?\"):\n   → De-duplicate gene\
    \ symbols. Write ONE prose sentence naming the primary causal gene(s).\n     Format: \"[Disease] is\
    \ caused by mutations in [gene] [cite].\"\n     If multiple association types present, lead with Disease-causing:\n\
    \     \"The primary causative gene is [X] [cite]; susceptibility genes include [Y] [cite].\"\n   \
    \  NEVER output a raw numbered gene list for factoid questions.\n\n   LIST intent — question explicitly\
    \ requests enumeration\n   (\"Which genes are associated with X?\", \"List genes for X\", \"What genes\
    \ cause X?\"):\n   → List ALL distinct gene_symbol values, ordered by association type:\n     1. Disease-causing\
    \ (germline/somatic)\n     2. Major susceptibility / Role in phenotype / Fusion gene\n     3. Modifying\
    \ / Candidate / Biomarker\n   Format: \"Genes associated: [sym1] [cite], [sym2] [cite], …\"\n\n3.\
    \ PHENOTYPE / HPO TERMS (table = disease_phenotype_association_orphanet):\n   Read the question intent\
    \ FIRST:\n\n   FACTOID intent — question asks for ONE specific feature, tissue, symptom, or hallmark\n\
    \   (\"What is the main/hallmark/characteristic/most common symptom of X?\",\n   \"What tissue/organ\
    \ is primarily affected in X?\", \"What is the defining feature of X?\"):\n   → From the highest-frequency\
    \ rows (Obligate 100% first, then Very frequent 99-80%),\n     identify the most prominent feature(s).\
    \ State the answer in ONE sentence, MAX 5 HPO terms.\n     If the question asks about tissue/organ:\
    \ cluster top-frequency HPO terms by organ system\n     (cardiovascular, connective tissue, musculoskeletal,\
    \ neurological, ocular, renal, etc.)\n     and name the dominant system — do NOT list all HPO terms.\n\
    \n   LIST intent — question explicitly requests a list of features/symptoms/characteristics:\n   →\
    \ Group ALL terms by frequency tier:\n     Obligate / Very frequent → \"Core features: [all terms]\"\
    \ [cite each]\n     Frequent → \"Frequent features: [all terms]\" [cite each]\n     Occasional / Very\
    \ rare → \"Occasional features: [all terms]\" [cite each]\n     Excluded (0%) → \"Features explicitly\
    \ absent: [terms]\" (only if present)\n   → If db_row_count > 30: list ALL Obligate/Very frequent\
    \ terms fully; for Frequent and\n     Occasional tiers, list the first 8 terms then append \"(and\
    \ [N] more in Orphanet)\".\n     Never collapse Obligate or Very frequent terms — always enumerate\
    \ them completely.\n\n4. PREVALENCE (table = disease_epidemiology_orphanet):\n   Report the `prevalence_class`\
    \ value directly.\n   Prefer Validated rows (disease_epidemiology_validation_status = \"Validated\"\
    ).\n   Among those, prefer point-prevalence rows (prevalence_type = \"Point prevalence\" or \"Lifetime\
    \ Prevalence\").\n   If neither is available, report whatever type IS present (\"Annual incidence\"\
    , \"Prevalence at birth\",\n   or \"Cases/families\"), clearly labeling the type: \"Annual incidence\
    \ of [disease]: [prevalence_class].\" [cite]\n   Format (when Point/Lifetime available): \"Prevalence\
    \ of [disease]: [prevalence_class].\" [cite]\n   If val_moy (numeric mean) is present and non-null,\
    \ append: \"(mean: [val_moy] / million)\"\n   SPECIAL CASE — Cases/families rows always have null\
    \ prevalence_class.\n   For these rows report: \"[N] [cases/families] reported in Orphanet.\" [cite]\n\
    \   using val_moy (count) and prevalence_qualification (\"Case(s)\" or \"Family(ies)\").\n\n5. CROSS-REFERENCE\
    \ / ID LOOKUP (table = disease_xref_orphanet):\n   Return the raw xref_id value(s). Format: \"[source]:\
    \ [id]\" [cite].\n   For OMIM: preserve the full numeric ID without modification.\n\n6. YES/NO QUESTIONS:\n\
    \   - \"Is X genetic?\" → Yes if gene_disease_association rows exist for X.\n   - \"Is X inherited\
    \ as [pattern]?\" or \"Is X a [pattern] disease?\" → compare value column to asked pattern (case-insensitive).\
    \ TRUST THE ROWS: do NOT check whether the disease name\n       in db_rows matches the disease name\
    \ in the question — the pipeline's filter guarantees rows belong\n       to the correct disease. EXAMPLE:\
    \ question asks about \"COACH syndrome\" but rows show data for\n       \"Joubert syndrome with hepatic\
    \ involvement\" (a canonical alias) → use the row data to answer.\n   - \"Is X autosomal recessive?\"\
    \ → YES if ANY db_row has attribute='inheritance' AND value contains 'Autosomal recessive'.\n   -\
    \ \"Does X present with phenotype Y?\" → Yes if hpo_term ≈ Y in returned rows.\n   - \"Is X heterogeneous?\"\
    \ or \"Is X genetically heterogeneous?\" → Yes if\n       gene_disease_association rows show MORE\
    \ THAN ONE distinct gene_symbol\n       (multiple causal loci = genetic heterogeneity).\n       Multiple\
    \ inheritance modes alone do NOT indicate genetic heterogeneity\n       (that is locus homogeneity,\
    \ not locus heterogeneity).\n     HPO SYNONYM RULE: Orphanet uses HPO canonical terms which may differ\
    \ from common disease names.\n     Known synonyms (treat as equivalent for yes/no phenotype matching):\n\
    \       - \"Aganglionic megacolon\" = \"Hirschsprung disease\" / \"aganglionosis\"\n       - \"Congenital\
    \ sensorineural hearing impairment\" = \"deafness\" / \"hearing loss\"\n     When a row contains hpo_term\
    \ \"Aganglionic megacolon\" and question asks about Hirschsprung → YES.\n     PHENOTYPE PRESENCE RULE:\
    \ \"Is [phenotype] a feature of [disease]?\" or \"Does [disease] present with [phenotype]?\"\n   \
    \    → if ANY row has hpo_term matching (or synonymous with) the phenotype, answer YES with its frequency.\n\
    \     Do NOT answer from parametric knowledge — 0 rows = \"Not recorded in Orphanet\", not definitively\
    \ No.\n\n7. ZERO-HALLUCINATION (applies to all branches):\n   Every fact MUST be traced to a specific\
    \ db_row with a [orphanet:N] citation.\n   Never invent gene names, phenotypes, or prevalence figures\
    \ not present in db_rows.\n"
uniprot:
  router: "ALWAYS route to query_db for ANY question about:\n- UniProt entries, accessions, protein names,\
    \ gene symbols (Swiss-Prot human proteome)\n- Gene Ontology (GO) annotations, GO terms, molecular\
    \ function, biological process, cellular component\n- Subcellular localisation of a protein\n- UniProt\
    \ functional keywords (e.g. \"Kinase\", \"Signal\", \"Zinc-finger\")\n- Natural variants and disease\
    \ associations in Swiss-Prot (HGVS notation, pathogenic/benign)\n- Post-translational modification\
    \ keywords (e.g. \"Phosphoprotein\", \"Acetylation\") via protein_keyword_uniprot\n- External ID mapping\
    \ (Ensembl, RefSeq, HGNC, Entrez, GeneID → UniProt accession)\n\nRoute to web_search for:\n- Current\
    \ clinical trial data, recent drug approvals, or literature summaries\n- Protein abundance rankings\
    \ or proteomics quantitation\n- Protein 3D structure questions (use PDB instead)\n- Gene expression\
    \ levels (use GTEx/HPA instead)\n- Drug-target associations: UniProt has NO drug_target_uniprot table\
    \ → recommend OpenTargets, HCDT, or TTD\n- Comprehensive kinase-substrate phosphorylation databases\
    \ beyond UniProt annotation → recommend PhosphoSitePlus\n\nALWAYS route to query_db (do NOT redirect\
    \ to web) for:\n- Protein function / role / what a protein does → protein_function_uniprot (free-text\
    \ CC FUNCTION)\n- PTM site positions, residues, modifying enzymes → ptm_sites_uniprot (position, modification,\
    \ enzymes)\n- Protein-protein interactions, binding partners, subunit composition → protein_interaction_uniprot\n\
    \  (interaction_type = BINARY for specific partners, SUBUNIT for complex membership text)\n"
  rewriter: "UNIPROT GENE/PROTEIN ALIAS EXPANSION — expand abbreviations before querying:\n- Gene symbols:\
    \ if the user provides an informal name, protein synonym, or non-HGNC abbreviation,\n  expand it to\
    \ the official HGNC gene symbol before querying the gene_symbol column.\n- \"UniProt accession\" /\
    \ \"UniProt ID\" / \"accession number\" → protein_id column\n- PTM abbreviations: expand shorthand\
    \ phospho/acetyl/methyl notation to the full UniProt-canonical\n  modification name (the same form\
    \ used in the modification column of ptm_sites_uniprot).\n"
  col_selection: "TABLE ROUTING — match question type to the correct UniProt table:\n\nPROTEIN IDENTITY\
    \ / GENE LOOKUP → protein_master_table_uniprot\n  filter: gene_symbol, protein_id, protein_name  |\
    \  output: protein_id, protein_name, gene_symbol, entry_name\n\nGO ANNOTATIONS → gene_ontology_uniprot\
    \ (join via protein_id)\n  filter: gene_symbol, go_id, aspect, qualifier, evidence\n  aspect values:\
    \ 'F'=molecular function, 'P'=biological process, 'C'=cellular component\n\nKEYWORD annotations →\
    \ protein_keyword_uniprot JOIN keyword_master_uniprot (on keyword_id)\n  The edge table protein_keyword_uniprot\
    \ stores only (protein_id, keyword_id).\n  Filter by keyword_name or category via the JOIN to keyword_master_uniprot.\n\
    \  filter (resolved via JOIN): gene_symbol, keyword_name, category\n\nSUBCELLULAR LOCATION → protein_subcell_uniprot\
    \ JOIN subcell_location_uniprot (on subcell_id)\n  The edge table protein_subcell_uniprot stores only\
    \ (protein_id, subcell_id).\n  Filter by subcell_name via the JOIN to subcell_location_uniprot.\n\
    \  filter (resolved via JOIN): gene_symbol, subcell_name\n\nVARIANT-DISEASE → variant_disease_uniprot\
    \ (join via protein_id)\n  filter: gene_symbol, variant_type, disease_name, omim_id, swiss_prot_change\n\
    \nPROTEIN FUNCTION → protein_function_uniprot (join via protein_id)\n  filter: gene_symbol (join from\
    \ protein_master), function_text (substring match)\n  output: protein_id, function_text\n  Use for:\
    \ \"What does X do?\", \"What is the function of X?\", \"What is X?\", \"role of X\", \"mechanism\
    \ of X\"\n\nPTM SITES → ptm_sites_uniprot (join via protein_id)\n  filter: gene_symbol (join from\
    \ protein_master), modification, position, enzymes\n  output: protein_id, position, modification,\
    \ enzymes\n  Use for: \"Is X phosphorylated?\", \"phosphorylation sites of X\", \"which kinase phosphorylates\
    \ X\",\n           \"what residue is modified in X\", \"PTM sites on X\"\n  NOTE: also check protein_keyword_uniprot\
    \ with keyword_name='Phosphoprotein' for yes/no PTM existence.\n\nPROTEIN-PROTEIN INTERACTIONS → protein_interaction_uniprot\
    \ (join via protein_id)\n  filter: gene_symbol (join from protein_master), interaction_type, interactor_gene,\
    \ description\n  output: protein_id, interaction_type, interactor_gene, nb_experiments, description\n\
    \  interaction_type values: 'BINARY' = direct partner (with gene name), 'SUBUNIT' = complex/subunit\
    \ free-text\n  Use for: \"What interacts with X?\", \"binding partners of X\", \"subunit composition\"\
    , \"does X interact with Y?\"\n\nDRUG-TARGET QUERIES → UniProt does NOT have a drug_target table.\
    \ For drug-target\n  data cross-referenced from DrugBank or ChEMBL, use OpenTargets or ChEMBL instead.\n\
    \nEXTERNAL ID MAPPING → id_mapping_uniprot\n  filter: db, external_id  |  output: protein_id\n  db\
    \ enum values: 'Ensembl', 'Ensembl_PRO', 'Ensembl_TRS', 'GeneID', 'Gene_Name', 'Gene_Synonym', 'HGNC',\
    \ 'RefSeq', 'RefSeq_NT', 'UniProtKB-ID'\n"
  mapper: "PROTEIN ID COLUMN NAME: the column is `protein_id` — NEVER use `accession` as a key in pv.\n\
    \nHGNC FORMAT: stored WITH 'HGNC:' prefix (e.g. 'HGNC:11998'). Prepend prefix to bare integers.\n\n\
    GO ASPECT ENUM: 'F' = molecular function, 'P' = biological process, 'C' = cellular component.\nWhen\
    \ user says \"molecular function\" → aspect=['F']; \"biological process\" → aspect=['P'];\n\"cellular\
    \ component\" / \"where is it located\" → aspect=['C'].\n\nVARIANT_TYPE ENUM: 'LP/P' = pathogenic,\
    \ 'LB/B' = benign, 'US' = uncertain significance.\n\nDRUG QUERIES: UniProt has NO drug_target_uniprot\
    \ table. Do NOT emit\ndrug_name, source_db, or drug_id as filter keys. For drug-target associations,\
    \ redirect\nthe user to OpenTargets or ChEMBL (state this in the response).\n\nPPI QUERIES: use protein_interaction_uniprot.\
    \ Valid filter keys: interaction_type ('BINARY'\nor 'SUBUNIT'), interactor_gene (gene symbol of partner),\
    \ description (substring for SUBUNIT text).\nFor BINARY rows: interactor_gene holds the partner gene\
    \ symbol, nb_experiments is the\nIntAct experiment count. For SUBUNIT rows: description holds the\
    \ free-text; interactor_gene is null.\n\nPTM QUERIES: use ptm_sites_uniprot. Valid filter keys: modification\
    \ (e.g. 'Phosphoserine',\n'Phosphothreonine', 'Phosphotyrosine', 'N6-acetyllysine'), position (integer\
    \ as string),\nenzymes (substring, e.g. 'PKA', 'CK2', 'CDK1').\nFor yes/no PTM existence questions,\
    \ ALSO check protein_keyword_uniprot with keyword_name filter.\n\nPTM KEYWORD NAMES — for protein_keyword_uniprot\
    \ (keyword-level, not site-level):\n  \"phosphorylation\" → keyword_name=['Phosphoprotein']\n  \"\
    acetylation\" / \"acetyl-lysine\" → keyword_name=['Acetylation']\n  \"ubiquitination\" → keyword_name=['Ubl\
    \ conjugation']\n  \"methylation\" → keyword_name=['Methylation']\n\nFUNCTION QUERIES: use protein_function_uniprot.\
    \ Filter by gene_symbol (join from protein_master).\nfunction_text is substring-matched — do NOT use\
    \ exact match.\n\nDISEASE_NAME: use LIKE / substring matching — disease names often include MIM numbers\
    \ in brackets.\nOMIM_ID: bare integer string (no 'OMIM:'/'MIM:' prefix) — e.g. '151623'.\n"
  tiebreaker: "1. DRUG QUERIES: UniProt has NO drug_target_uniprot table. Reject any mapper result\n \
