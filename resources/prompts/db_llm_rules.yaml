    function of MDA5\" → gene_symbol=[\"IFIH1\"] filter, pathway_name=None\nRIGHT: \"function of MDA5\"\
    \ → gene_symbol=[\"IFIH1\"] filter, pathway_name=\"requested\" output\n\nGENE FUNCTION QUERIES — \"\
