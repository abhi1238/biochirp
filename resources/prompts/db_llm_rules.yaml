  col_selection: 'Pathway-hierarchy questions are answered ENTIRELY from pathway_hierarchy_reactome

    (it carries parent_pathway_name and child_pathway_name denormalized — no join to pathway_master_table

    is needed). For "children / sub-pathways / sub-processes OF <pathway>" select child_pathway_name

    as output. For "parent / super-pathway / what is <pathway> part of" select parent_pathway_name as

    output. Do NOT route these to pathway_master_table.pathway_name.

