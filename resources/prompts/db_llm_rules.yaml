hcdt:
  router: "DRUG SYNONYM / TRADE NAME queries MUST be routed to query_db — HCDT has a curated\ndrug_synonyms_association_hcdt\
    \ table with PubChem-sourced trade names and synonyms:\n  \"What is the trade name of sildenafil?\"\
    \ → query_db  (DB has Viagra, Revatio, …)\n  \"What are the brand names of imatinib?\" → query_db\
    \  (DB has Gleevec, Glivec, …)\n  \"What is the synonym of erlotinib?\" → query_db\n  \"What is the\
    \ alternative name of RTA 408?\" → query_db  (DB maps RTA-408 → Omaveloxolone)\n  \"DX-88 is the investigational\
    \ name of which drug?\" → query_db\nDRUG-DISEASE association queries MUST be routed to query_db —\
    \ HCDT has\ndrug_disease_association_hcdt covering clinical indications for ~4,400 drugs:\n  \"Which\
    \ disease is treated with Eliglustat?\" → query_db  (drug→disease lookup)\n  \"Which cancer does tamoxifen\
    \ treat?\" → query_db\n  \"Was tamoxifen tested for treatment of glioma?\" → query_db  (YES/NO answered\
    \ by row presence)\n  \"Which drug is used as antidote in benzodiazepine overdose?\" → query_db  (disease→drug)\n\
    \  \"What are the indications of metformin?\" → query_db\n  \"Which conditions does flumazenil treat?\"\
    \ → query_db\n  \"What disease does drug X treat?\" → query_db\n  \"Which drugs treat disease Y?\"\
    \ → query_db\nYES/NO questions about drug-disease relationships → query_db (rows≥1 means YES):\n \
    \ \"Is aspirin used for heart disease?\" → query_db\n  \"Does metformin treat diabetes?\" → query_db\n\
    GENE-DISEASE questions → query_db — HCDT resolves via drug_gene + drug_disease multi-hop:\n  \"Is\
    \ BTK implicated in autoimmunity?\" → query_db  (gene→drugs→autoimmune diseases)\n  \"Is the tyrosine\
    \ kinase BTK implicated in autoimmunity?\" → query_db\n  \"Which diseases is the ALK tyrosine kinase\
    \ associated with?\" → query_db\n  \"Does TP53 play a role in cancer?\" → query_db\n  \"Which gene\
    \ is responsible for X disease?\" → query_db (disease→drugs→genes)\n  \"Is gene X involved in disease\
    \ Y?\" → query_db\nGENE / DISEASE name-only lookups (no HCDT synonym table for those) → web_search:\n\
    \  \"What is the alias of TP53?\" → web_search\n  \"What is the full name of CML?\" → web_search\n\
    RADIOPHARMACEUTICAL / PET-TRACER drug-TARGET queries ARE valid query_db targets:\n  \"Which receptors\
    \ does [18F]altanserin bind?\" → query_db (drug→gene/receptor)\n  \"What does [18F]FDG target?\" →\
    \ query_db\n"
  rewriter: ''
  col_selection: "TARGET RANKING: drug_gene_association_hcdt has two computed ranking columns:\n  source_count\
    \   — number of databases that confirmed this drug-gene pair (int)\n  ttd_confirmed  — 1 if TTD (Therapeutic\
    \ Target Database) is among the sources, else 0\nWhen querying drug_gene_association_hcdt for drug\
    \ targets or gene lists, ALWAYS:\n  1. Include source_count and ttd_confirmed in SELECT.\n  2. Add\
    \ ORDER BY ttd_confirmed DESC, source_count DESC so primary curated targets\n     (multi-source, TTD-confirmed)\
    \ rank above resistance/transporter noise (e.g. ABCB1).\nNOTE: source_count and ttd_confirmed are\
    \ NOT in the ANN schema vocabulary (queryable=false)\n— inject them directly in ORDER BY / SELECT\
    \ without routing through the column-selection ANN.\nThey exist only in the drug_gene_association_hcdt\
    \ table.\n\nDRUG SYNONYM FALLBACK: When the drug filter term is a research code (e.g. RTA-408, CCX168),\n\
    bracket-notation radiopharmaceutical (e.g. [18F]altanserin), or trade name that may not match\ndrug_name\
    \ exactly, look up via drug_synonyms_association_hcdt:\n  JOIN drug_synonyms_association_hcdt syn\
    \ ON dm.drug_id = syn.drug_id\n  WHERE (dm.drug_name ILIKE '%<term>%' OR syn.synonym ILIKE '%<term>%')\n\
    Do NOT use drug_master_table_hcdt.drug_synonyms directly — it is a raw pipe-delimited column\nthat\
    \ is NOT exposed to SQL. drug_synonyms_association_hcdt holds the exploded normalized rows.\nBracket\
    \ prefix mapping: [18F] ↔ \"Fluorine-18\", [11C] ↔ \"Carbon-11\", [15O] ↔ \"Oxygen-15\".\n\nDISEASE-ONLY\
    \ QUERIES (no gene named):\n  For queries like \"what drugs treat [disease]?\" where no gene is mentioned,\
    \ use ONLY:\n    drug_master_table_hcdt + drug_disease_association_hcdt + disease_master_table_hcdt\n\
    \  Do NOT include gene_master_table_hcdt or drug_gene_association_hcdt — adding them creates a cross-join\
    \ that returns 0 rows when no gene filter is provided.\n"
  mapper: "DRUG CLASS QUERIES:\nWhen the user names a drug class (e.g. \"checkpoint inhibitors\", \"PARP\
    \ inhibitors\", \"CDK4/6 inhibitors\"):\ndo NOT expand to specific drugs and do NOT emit the class\
    \ term as a drug_name filter value.\nInstead use drug_name: \"requested\" as output and anchor the\
    \ query on the gene/target if one is mentioned.\nLet the class term inform the gene_symbol filter\
    \ if applicable (e.g. \"CDK4/6 inhibitors\" →\ngene_symbol=[\"CDK4\",\"CDK6\"]).\n\nMSI / MMR STATUS:\
    \ MSI-high / MMR-deficient cell line queries: HCDT does NOT have an MSI or MMR\nstatus column — this\
    \ is cancer cell-line sensitivity data which is outside HCDT scope.\nIf the user asks for drugs used\
    \ in MSI-high cancers, respond that HCDT covers drug-target\ninteractions not cell-line sensitivity;\
    \ suggest looking at HCDT for pembrolizumab/nivolumab\ntargets instead. Do NOT attempt to filter by\
    \ MSI status.\n\nRADIOPHARMACEUTICAL BRACKET NOTATION: [18F]<name> means \"Fluorine-18 <name>\" in\
    \ the DB.\nAlways emit BOTH the bracket form AND the spelled-out form as drug_name candidates so the\n\
    SQL can match either:\n  \"[18F]altanserin\" → drug_name: [\"[18F]altanserin\", \"Fluorine-18 altanserin\"\
    , \"altanserin\"]\n  \"[11C]PIB\"        → drug_name: [\"[11C]PIB\", \"Carbon-11 PIB\"]\nThe drug_synonyms_association_hcdt\
    \ table also holds bracket-notation aliases and research codes.\n\nDISEASE ABBREVIATION EXPANSION:\
    \ always expand abbreviations to their full disease_name as stored in HCDT\nbefore querying. Use medical\
    \ knowledge to resolve abbreviations and synonym variants.\n\nDRUG-INDUCED / INFECTION THERAPY DIRECTION:\
    \ When the question asks \"which drugs treat X\", \"therapy\nfor X\", or \"treatment of X\" — even\
    \ when a drug or pathogen name appears in X — the FILTER is the\nDISEASE, not the drug/pathogen. Set\
    \ disease_name=[X], drug_name=\"requested\".\nNEVER set drug_name=[amiodarone] when the real question\
    \ anchor is the disease thyrotoxicosis.\n  \"drugs for amiodarone-induced thyrotoxicosis\" → disease_name=[\"\
    Thyrotoxicosis\"], drug_name=\"requested\"\n  \"Mycobacterium avium therapy\" → disease_name=[\"Mycobacterium\
    \ avium complex\"], drug_name=\"requested\"\n  \"treatment of cisplatin-induced nephrotoxicity\" →\
    \ disease_name=[\"Nephrotoxicity\"], drug_name=\"requested\"\n\nYES/NO EXISTENCE QUESTIONS:\n  For\
    \ questions like \"Is drug X associated with gene Y?\" or \"Does drug X target gene Y?\", ALL named\
    \ entities MUST be filter lists — nothing is \"requested\".\n  WRONG: {drug_name: [\"imatinib\"],\
    \ gene_symbol: \"requested\"}\n  RIGHT: {drug_name: [\"imatinib\"], gene_symbol: [\"ABL1\"]}\n  The\
    \ answer is computed from whether any rows are returned, not from the column being \"requested\".\n\
    \nDRUG-AS-FILTER RULE:\n  When the user asks \"what genes/diseases does drug X target/treat?\", drug_name\
    \ is a FILTER and gene_symbol/disease_name is the output.\n  WRONG: {drug_name: \"requested\", gene_symbol:\
    \ [\"EGFR\"]}\n  RIGHT: {drug_name: [\"gefitinib\"], gene_symbol: \"requested\"}\n\nRNA TYPE FILTER:\n\
    \  When the question names a SPECIFIC RNA class (miRNA, lncRNA, circRNA), rna_type MUST be a\n  FILTER\
    \ list with the exact enum value — NEVER \"requested\".\n  rna_name is always the open output.\n \
    \ WRONG: \"which miRNA molecules are associated with imatinib?\" → rna_type: \"requested\"\n  RIGHT:\
    \ \"which miRNA molecules are associated with imatinib?\" → rna_type: [\"miRNA\"], rna_name: \"requested\"\
    \n  WRONG: \"what lncRNA molecules does bevacizumab regulate?\" → rna_type: \"requested\"\n  RIGHT:\
    \ \"what lncRNA molecules does bevacizumab regulate?\" → rna_type: [\"lncRNA\"], rna_name: \"requested\"\
    \n  WRONG: \"which circRNA molecules are associated with metformin?\" → rna_type: \"requested\"\n\
    \  RIGHT: \"which circRNA molecules are associated with metformin?\" → rna_type: [\"circRNA\"], rna_name:\
    \ \"requested\"\n  EXCEPTION: if the question names MULTIPLE RNA classes (\"miRNA, lncRNA, circRNA\"\
    ), then\n  rna_type: \"requested\" is correct (no single enum value to pin as filter).\n\nNAMED PATHWAY\
    \ + XREF OUTPUTS:\n  When the question names a specific pathway AND asks for KEGG/SMPDB IDs, set pathway_name\n\
    \  as a FILTER list (not \"requested\"), and OMIT kegg_hsa_xref/smpdb_xref from pv — they are\n  added\
    \ automatically by co_output_rules.\n  WRONG: \"KEGG IDs for MAPK signaling altered by imatinib\"\
    \ → pathway_name: \"requested\"\n  RIGHT: \"KEGG IDs for MAPK signaling altered by imatinib\" → drug_name:\
    \ [\"imatinib\"], pathway_name: [\"MAPK signaling\"]\n  WRONG: \"both KEGG and SMPDB IDs for mTOR\
    \ signaling affected by everolimus\" → pathway_name: \"requested\"\n  RIGHT: \"both KEGG and SMPDB\
    \ IDs for mTOR signaling...\" → drug_name: [\"everolimus\"], pathway_name: [\"mTOR signaling\"]\n"
  tiebreaker: '1. If one mapper returned an empty result and the other returned a non-empty result, prefer
    the non-empty result.

    2. If both mappers returned column names not present in the HCDT schema (drug_master_table_hcdt, drug_gene_association_hcdt,
    drug_disease_association_hcdt, drug_synonyms_association_hcdt, pathway_master_table_hcdt, pathway_gene_association_hcdt,
    gene_master_table_hcdt, disease_master_table_hcdt, rna_master_table_hcdt, drug_rna_association_hcdt,
    drug_pathway_association_hcdt, drug_target_negative_hcdt), reject both and emit an empty parsed_value.

    '
hpo:
  router: "HPO (Human Phenotype Ontology) answers queries about phenotype terms, phenotype-gene\nassociations,\
    \ phenotype-disease associations, and phenotype hierarchy.\nRoute to query_db when:\n  \"what phenotypes\
    \ are associated with BRCA1?\" → query_db\n  \"which genes cause arachnodactyly?\" → query_db\n  \"\
    what are the HPO terms for Marfan syndrome?\" → query_db\n  \"what does HP:0001166 mean?\" → query_db\n\
    \  \"is Marfan syndrome autosomal dominant?\" → query_db\n  \"what are the sub-phenotypes of abnormality\
    \ of the limbs?\" → query_db\nHARD RULE — NEVER use direct_answer for a NAMED disease/syndrome description\
    \ query:\n  \"Describe X syndrome\", \"What is X?\", \"What is the characteristic feature of X\",\n\
    \  \"List clinical features/symptoms of X\", \"What is the clinical presentation of X\",\n  \"What\
    \ are the diagnostic criteria for X\"\n  for ANY named disease/syndrome MUST route to query_db, even\
    \ rare eponyms — HPO\n  curates disease_phenotype_association_hpo rows for hundreds of eponymous\n\
    \  syndromes that are easy to assume are missing. \"Diagnostic criteria\" queries are\n  ALSO phenotype-list\
    \ queries in disguise — the criteria ARE the curated phenotypes\n  (e.g. HLH diagnostic criteria =\
    \ fever, splenomegaly, cytopenia, hemophagocytosis,\n  all curated HP terms for the HLH OMIM entries).\
    \ Only fall back to direct_answer\n  AFTER query_db returns zero rows, never before trying it.\n \
    \ \"Describe Escobar syndrome\" → query_db\n  \"What is the characteristic feature of Triple A syndrome?\"\
    \ → query_db\n  \"List clinical features of tuberous sclerosis\" → query_db\n  \"What is Burning Mouth\
    \ Syndrome?\" → query_db\n  \"What are the diagnostic criteria for hemophagocytic lymphohistiocytosis?\"\
    \ → query_db\nGENE STRUCTURAL-VARIANT → DISEASE/PHENOTYPE queries (duplication, deletion, microdeletion\n\
    of a gene/locus causing a named abnormality or syndrome) ALSO MUST route to query_db via\ngene_disease_association_hpo\
    \ / gene_phenotype_association_hpo — this is NOT the same as\nClinVar variant-level pathogenicity\
    \ (ACMG classification of a specific variant), it is a\ncurated gene-disease link:\n  \"Which is the\
    \ main abnormality that arises with Sox9 locus duplication?\" → query_db\n  (SOX9 duplication → 46,XX\
    \ sex reversal is a curated gene_disease_association_hpo row)\nRoute to web_search when:\n  - Drug\
    \ treatment, dosing, or therapy questions (HPO has no drug data)\n  - Protein structure, sequence,\
    \ or biochemical mechanism\n  - Epidemiology or prevalence statistics not tied to HPO phenotype frequency\n\
    \  - Variant-level PATHOGENICITY CLASSIFICATION of a specific variant, e.g. \"is c.123A>G\n    pathogenic?\"\
    \ (ClinVar is the canonical source) — NOT gene-disease/phenotype links\n  - Enrichment analysis or\
    \ statistical scores\nUse direct_answer ONLY when the question names no disease/phenotype/gene entity\
    \ at all.\n"
  rewriter: "INHERITANCE MODE ABBREVIATION EXPANSION:\n  AR → Autosomal Recessive (only in inheritance-mode\
    \ context, NOT \"arthritis\")\n  AD → Autosomal Dominant (only in inheritance-mode context)\n  XL\
    \ or X-linked → X-linked inheritance\n  HP: IDs → leave verbatim (HP:XXXXXXX are exact ontology keys)\n\
    For disease abbreviations (AML, CML, GBM) in HPO context, keep as-is —\nthe abbreviation_map in schema_rules\
    \ expands them at the col_selection stage.\n"
  col_selection: "TABLE ROUTING:\n- Phenotype term lookup (name, definition, HP:ID only): phenotype_master_table_hpo\n\
    - Gene → phenotype (HP terms): gene_phenotype_association_hpo + gene_master_table_hpo\n- Phenotype\
    \ → gene (reverse): phenotype_gene_association_hpo + phenotype_master_table_hpo\n- Disease → phenotype:\
    \ disease_phenotype_association_hpo + disease_master_table_hpo\n- Gene → disease: gene_disease_association_hpo\n\
    - Phenotype hierarchy (parent/child): phenotype_hierarchy_hpo\n- Phenotype synonyms lookup: phenotype_synonym_hpo\n\
    - Frequency/severity of phenotype in disease: disease_phenotype_annotation_hpo\n\nGENE-MUTATION →\
    \ DISEASE (critical rule):\n  When the question asks \"which diseases/conditions/phenotypes are caused\
    \ by or associated\n  with mutations/variants in gene X\" and the expected answers are DISEASE NAMES\
    \ (syndromes,\n  conditions) → use gene_disease_association_hpo (output: disease_name, association_type).\n\
    \  Use gene_phenotype_association_hpo ONLY when explicitly asking for HP: phenotype codes or\n  specific\
    \ phenotypic features by name, NOT when the answer is a list of diseases.\n\nDISEASE CLINICAL QUERY\
    \ → ALWAYS FETCH PHENOTYPES:\n  When a query asks about symptoms, features, manifestations, clinical\
    \ presentation,\n  amino acids, metabolites, biochemical characteristics, or clinical findings of\
    \ a NAMED\n  DISEASE → use disease_phenotype_association_hpo for symptom/phenotype lists; use disease_phenotype_annotation_hpo\
    \ when asking for frequency, onset, evidence, or biocuration.\n  NEVER return only disease_master_table_hpo\
    \ rows for such queries.\n\nDISEASE SUBTYPE UNION:\n  When the disease name in the query is a common/short\
    \ form that maps to multiple HPO\n  subtypes (e.g., \"Celiac disease\", \"Ehlers-Danlos syndrome\"\
    , \"gluten allergy\"):\n  → Output a SUBSTRING filter_val using the core disease name so the planner\
    \ unions subtypes.\n\nCONCRETE EXAMPLES:\n  Q: \"Which amino acid is implicated in Blue diaper syndrome?\"\
    \n  → Tables: disease_phenotype_association_hpo + disease_master_table_hpo\n  → Filter on disease_name,\
    \ output phenotype_name + phenotype_id\n  → \"amino acid\" is encoded as a HPO phenotype term in HPO\
    \ (disease_phenotype_association_hpo)\n\n  Q: \"Which phenotypes are associated with heterozygous\
    \ mutations of the BSCL2 gene?\"\n  → Tables: gene_disease_association_hpo (output: disease_name,\
    \ association_type)\n  → The gold answer is disease names (Silver syndrome, CMT2, distal HMN type\
    \ V)\n  → \"phenotypes associated with mutations\" → disease entities, not HP codes\n\n  Q: \"What\
    \ are atypical symptoms of gluten allergy?\"\n  → Tables: disease_phenotype_association_hpo + disease_master_table_hpo\n\
    \  → Filter on disease_name containing \"Celiac disease\", output phenotype_name + phenotype_id\n\n\
    DISEASE-ONLY: When only a disease name is given, use ONLY\n  disease_phenotype_association_hpo + disease_master_table_hpo\
    \ (no gene tables).\nPHENOTYPE-ONLY: When only a phenotype or HP: ID is given, use ONLY\n  phenotype_master_table_hpo\
    \ (or phenotype_synonym_hpo for synonym lookup).\nAVOID multi-hop chains: Do NOT join gene + disease\
    \ + phenotype in a single query.\n"
  mapper: "PHENOTYPE ID FORMAT: HP:XXXXXXX (7-digit zero-padded). Normalize HP 1166 → HP:0001166.\n\n\
    INHERITANCE MODE ENUM: When extracting inheritance pattern values use exactly:\n  \"Autosomal recessive\"\
    \ | \"Autosomal dominant\" | \"X-linked recessive\" |\n  \"X-linked dominant\" | \"Mitochondrial inheritance\"\
    \ | \"Semidominant\"\n\nSYNONYM LOOKUP: If the phenotype name in the query is a synonym (not the HP\
    \ canonical name),\nemit it as the filter value anyway — the expand_synonyms step resolves it via\n\
    phenotype_synonym_hpo. Do NOT attempt to pre-translate synonyms to canonical names.\n\nMULTI-GENE:\
    \ \"phenotypes in both BRCA1 and TP53\" → gene_symbol: [\"BRCA1\", \"TP53\"]\nUse a list to get the\
    \ intersection, not separate single-gene queries.\n\nDISEASE EPONYMS — canonical HPO disease names\
    \ differ from common eponyms. All of the\nfollowing are pre-translated by term_rewrite in app/tools/hpo/app/hpo.py\
    \ BEFORE the\nmapper ever sees the query text — the mapper just extracts the canonical name verbatim:\n\
    \  \"Ambras syndrome\" → \"Hypertrichosis universalis congenita Ambras type\"\n  \"Doose syndrome\"\
    \ → \"Epilepsy with myoclonic-atonic seizures\"\n  \"Moschcowitz syndrome\" → \"Thrombotic thrombocytopenic\
    \ purpura\"\n  \"Heerfordt syndrome\" → \"Heerfordt syndrome (uveoparotid fever)\"\n  \"Allgrove syndrome\"\
    \ → \"Triple A syndrome\"\n  \"Gardner-Diamond syndrome\" → \"Autoerythrocyte sensitization syndrome\"\
    \ (NOT \"Gardner-Diamond\" —\n    that string does not appear in disease_master_table_hpo and returns\
    \ 0 rows)\n  \"Aagenaes syndrome\" → \"Cholestasis-Lymphedema syndrome\"\n  For other rare eponyms\
    \ not listed: emit the eponym name as-is and let expand_synonyms resolve it.\n\nDISEASE → PHENOTYPE\
    \ QUERIES: For questions about symptoms, features, amino acids, metabolites,\nclinical presentation,\
    \ or any clinical characteristic of a named disease:\n  - Output columns MUST include phenotype_id\
    \ and phenotype_name (not just disease_name/disease_id).\n  - The selected table MUST be disease_phenotype_association_hpo\
    \ or disease_phenotype_annotation_hpo\n    (with disease_master_table_hpo as the JOIN source for disease_name\
    \ filtering).\n  - If the mapper is uncertain whether to output phenotype columns, always include\
    \ them —\n    returning phenotype terms for a disease query is always more useful than returning the\n\
    \    disease name itself.\n"
  tiebreaker: "DISEASE vs GENE path:\n  PREFER disease_phenotype_association_hpo when user names a specific\
    \ disease (not a gene).\n  PREFER gene_phenotype_association_hpo when user names a gene symbol.\n\
    PHENOTYPE LOOKUP vs ASSOCIATION:\n  PREFER phenotype_master_table_hpo alone for \"what does [phenotype]\
    \ mean?\" queries.\n  PREFER disease_phenotype_annotation_hpo for frequency/severity data in a disease.\n\
    PHENOTYPE HIERARCHY:\n  For \"child phenotypes of X\" → filter phenotype_hierarchy_hpo by parent_id\
    \ (the parent term's HP: id).\n  For \"parent of X\" → filter by phenotype_id (the child term's HP:\
    \ id) and return parent_id.\nREJECT empty-filter bias: Prefer the mapper that produced non-empty filter_val\n\
    \  without hallucinating column names as filter values.\n"
ttd:
  router: 'TTD routing rules:

    - "does X treat Y" / "is X approved for Y" / "is X used for Y" → yes/no approval check → route as
    schema_kg query with approval_status filter

    - "what drugs treat Y" / "drugs for Y" / "which drugs are used in Y" → disease-association query →
    route as schema_kg query with disease_name filter (NOT approval_status filter)

    - "what are the targets of X" / "targets of drug X" → drug→target query → route as schema_kg with
    drug_name filter

    - "mechanism of action of X" / "MoA of X" → mechanistic annotation → route as schema_kg with drug_name
    filter and moa_description in SELECT

    - If the question is about a specific drug approval status, use approval_status filter explicitly

    - NEVER route TTD questions to direct_answer or web_search unless the entity is provably not in TTD

    '
  col_selection: "DISEASE-ONLY queries (no specific gene/target named): the plan must be\n  disease_master_table_ttd\
    \ → drug_disease_association_ttd → drug_master_table_ttd.\nDo NOT include target_master_table_ttd\
    \ or target_disease_association_ttd when the user\nasks for \"drugs for [disease]\" and names no specific\
    \ gene — adding target tables with no\ngene filter produces a whole-table cross-join → 0 rows.\n\n\
    DRUG-AS-ANCHOR queries (\"targets of X\", \"mechanism of X\", \"which genes does X inhibit\"):\nplan\
    \ must include drug_master_table_ttd as FILTER table (drug_name=[X]) plus\ndrug_target_association_ttd\
    \ and target_master_table_ttd for target outputs.\nDo NOT set drug_name as \"requested\" when the\
    \ drug is the named subject of the query.\n\nCOMPOUND TARGET+DISEASE queries (\"drugs targeting EGFR\
    \ for breast cancer\"):\nFor compound queries with BOTH a target anchor AND a disease anchor (e.g.\
    \ \"drugs targeting\nEGFR in breast cancer\"): include target_master_table_ttd + drug_target_association_ttd\
    \ +\ndrug_disease_association_ttd in the join path. Use gene_symbol=[<gene>] as target filter AND\n\
    disease_name=[<disease>] as disease filter. drug_name is the output.\n\nGENE-CLASS DRUG QUERIES (\"\
    JAK2 inhibitor drugs\", \"EGFR inhibitors\", \"C5 blockers\", \"PARP1\ninhibitors targeting X\"):\
    \ the \"<gene> inhibitor/blocker/antagonist/modulator\" phrase names a\nPHARMACOLOGICAL DRUG CLASS\
    \ via its target gene, NOT a request to filter by the literal\nmechanism-of-action word. Do NOT tag\
    \ drug_mechanism_of_action_on_target as a :filter column for\nthese queries — only gene_symbol is\
    \ the filter (target_master_table_ttd + drug_target_association_ttd\n+ drug_master_table_ttd), drug_name\
    \ is the output. TTD's own moa vocabulary is inconsistent within\na single drug class (e.g. ruxolitinib/baricitinib/momelotinib\
    \ are all clinically JAK inhibitors but\nTTD records their moa against JAK2 as \"Modulator\" while\
    \ abrocitinib/fedratinib are recorded as\n\"Inhibitor\") — tagging drug_mechanism_of_action_on_target\
    \ as a filter for a gene-class query silently\ndrops real, approved drugs of the same class. drug_mechanism_of_action_on_target\
    \ may still be tagged\n:output/co-output so it is returned as an informational column, just never\
    \ as a :filter.\nWRONG clean_query: \"Which [drug_name:output] [drug_mechanism_of_action_on_target:filter]\
    \ JAK2 [gene_symbol:filter]\"\nRIGHT clean_query: \"Which [drug_name:output] [gene_symbol:filter]\
    \ JAK2, with mechanism [drug_mechanism_of_action_on_target:output]\"\n\nCHEMICAL IDENTIFIER queries\
    \ (\"molecular formula of drugs targeting X\", \"CAS number of drugs for Y\",\n\"PubChem CID of drugs\
    \ that target Z\", \"ChEBI IDs of drugs targeting PARP1\"):\nformula, cas_number, chebi_xref, crossmatch_pubchem_cid,\
    \ pubchem_sid all live in\ndrug_crossmatching_association_ttd which joins to drug_master_table_ttd\
    \ via drug_id.\nALWAYS include drug_name (from drug_master_table_ttd) alongside any chemical identifier\
    \ column —\nthe user wants to know WHICH DRUGS have formula/CAS/etc., so drug_name is always an output.\n\
    Plan: drug_master_table_ttd + drug_crossmatching_association_ttd + (drug_target_association_ttd\n\
    + target_master_table_ttd if a gene/target filter is present).\n"
  mapper: '`approval_status` must NOT be used as a FILTER VALUE (search condition) for queries

    phrased as "treat", "used to treat", "therapy for", "drugs for [disease]" — those are

    disease-association queries; set disease_name=[<disease>], NOT approval_status as the filter.

    However, approval_status IS automatically included as a co-output column when drug_name is

    an output column (per co_output_rules) — do not suppress it from SELECT.

    WRONG: "Which drugs treat Parkinson''s disease?" → approval_status=["Approved"]

    RIGHT: "Which drugs treat Parkinson''s disease?" → disease_name=["Parkinson disease"], drug_name="requested"


    DRUG-AS-FILTER rule: when the question names a specific drug as the primary subject

    (e.g., "targets of imatinib", "imatinib mechanism", "what does X inhibit"), set

    drug_name=[<drug>] as a FILTER — NOT "requested". The gene/target is the OUTPUT.

    WRONG: drug_name="requested", gene_symbol=["imatinib"]

    RIGHT: drug_name=["imatinib"], gene_symbol="requested", target_name="requested"


    DISEASE-ONLY filter: for "drugs for [disease]" with no named gene, set ONLY

    disease_name=[<disease>]. Do NOT also set gene_symbol or target_name as filter values —

    those are outputs (gene_symbol="requested"). Filtering target_master_table_ttd with a

    disease name as gene_symbol gives 0 rows.


    MOA OUTPUT: when the question asks "mechanism of action of X", "how does X work", "what

    does X target", or "describe X''s pharmacology", the drug is the FILTER and ALL three of

    gene_symbol, target_name, and drug_mechanism_of_action_on_target must be set as "requested"

    outputs. Never omit drug_mechanism_of_action_on_target when the question is asking for

    a mechanism-of-action answer — it is the primary pharmacology output column.


    GENE-CLASS DRUG QUERIES ("JAK2 inhibitor drugs", "EGFR inhibitors", "C5 blockers", "PARP1

    inhibitor drugs targeting X"): the "<gene> inhibitor/blocker/antagonist/modulator" phrase names

    a PHARMACOLOGICAL DRUG CLASS via its target gene — it is NOT a request to filter

    drug_mechanism_of_action_on_target by that literal word. Set gene_symbol=[<gene>] as the ONLY

    target-side filter and drug_name="requested". Do NOT add

    drug_mechanism_of_action_on_target as a filter value for these class-name queries — TTD''s own

    moa vocabulary is inconsistent for a single drug class (e.g. ruxolitinib, baricitinib, and

    momelotinib are all clinically JAK inhibitors, but TTD records their moa against JAK2 as

    "Modulator" while abrocitinib/fedratinib are recorded as "Inhibitor"), so a literal moa=

    ["Inhibitor"]-style filter silently drops real, approved drugs of the same class. moa should

    still be returned as a co-output column (per MOA OUTPUT above) but must never gate which rows

    are returned for a gene-class query.

    WRONG: "JAK2 inhibitor drugs" → gene_symbol=["JAK2"], drug_mechanism_of_action_on_target=["Inhibitor","Antagonist","Blocker"]

    RIGHT: "JAK2 inhibitor drugs" → gene_symbol=["JAK2"], drug_name="requested" (no moa filter)

    WRONG: "drugs targeting C5" — this one names no mechanism word, so it already does not add a

    moa filter; the same no-moa-filter rule applies even when the query DOES name a mechanism word

    like "inhibitor"/"blocker"/"antagonist" alongside the gene.


    PATHWAY SUBTYPE FILTER: when the question names a pathway TYPE as a modifier — e.g. "cell cycle

    pathways involving CDK4", "apoptosis pathways associated with BCL2", "MAPK signaling pathways

    involving BRAF" — set pathway_name = [TYPE_TERM] as a FILTER list AND gene_symbol = [GENE] as

    a FILTER list. The pathway type IS a filter value, not a description of the output.

    WRONG: "cell cycle pathways involving CDK4"  → gene_symbol: ["CDK4"], pathway_name: "requested"

    RIGHT: "cell cycle pathways involving CDK4"  → gene_symbol: ["CDK4"], pathway_name: ["cell cycle"]

    WRONG: "apoptosis pathways involving BCL2"   → gene_symbol: ["BCL2"], pathway_name: "requested"

    RIGHT: "apoptosis pathways involving BCL2"   → gene_symbol: ["BCL2"], pathway_name: ["apoptosis"]

    Contrast: "which pathways involve EGFR?" (no type specified) → pathway_name: "requested" ✓


    YES/NO EXISTENCE QUESTIONS: for questions phrased as "Is X affected by Y?", "Does X treat Y?",

    "Is X associated with Y?", "Is the [pathway] altered by [drug]?", "Is [drug] a modulator of [target]?"
    —

    treat ALL named entities as FILTER lists (not "requested"). The yes/no answer is derived from

    whether matching rows exist; it is NOT derived by setting either entity as an output.

    WRONG: "Is the mTOR pathway affected by rapamycin?" → pathway_name="requested", drug_name=["rapamycin"]

    RIGHT: "Is the mTOR pathway affected by rapamycin?" → drug_name=["rapamycin"], pathway_name=["mTOR"]

    WRONG: "Is MAPK signaling altered by imatinib?" → drug_name="requested", pathway_name="requested"

    RIGHT: "Is MAPK signaling altered by imatinib?" → drug_name=["imatinib"], pathway_name=["MAPK signaling
    pathway"]

    Do NOT inject approval_status for yes/no questions — no drug is an output, so the co_output_rule

    for approval_status must NOT fire.

    '
  tiebreaker: "TTD TIEBREAKER RULES (apply when mapper_1 and mapper_2 disagree):\n1. YES/NO questions\
    \ (\"Is X affected by Y?\", \"Does X alter Y?\"): set ALL named entities as\n   FILTER lists. Neither\
    \ entity is \"requested\". Do NOT add approval_status.\n2. If one mapper returned {} (empty) and the\
    \ other had valid filters, prefer the non-empty\n   mapper's result — an empty parsed_value is always\
    \ wrong for a factual lookup.\n3. If one mapper hallucinated column names as values (e.g. drug_name=[\"\
    drug_name\"]),\n   reject it entirely and use the other mapper's result.\n4. approval_status: only\
    \ add if the question explicitly asks about approval/regulatory status\n   AND drug_name is genuinely\
    \ an output (not a filter).\n"
  synthesizer: "MECHANISM-OF-ACTION QUESTIONS: When the user asks \"what is the mechanism of action of\
    \ X\",\n\"how does X work\", \"describe the pharmacology of X\", \"what does X target/inhibit/block\"\
    ,\nor any paraphrase asking for pharmacological mechanism, synthesise the TTD table rows into\na NARRATIVE\
    \ SUMMARY PARAGRAPH — never a bullet list, table, or raw key:value dump.\n\nThe paragraph must:\n\
    \  (1) Name the drug (use the drug's common INN name, not internal TTD identifiers).\n  (2) State\
    \ its molecular target — both the gene symbol (e.g. ABL1) and the full target\n      name (e.g. Tyrosine-protein\
    \ kinase ABL1).\n  (3) Describe the mechanism using drug_mechanism_of_action_on_target supplemented\
    \ by\n      pharmacological knowledge. If TTD records \"Modulator\" as the mechanism:\n      - for\
    \ small-molecule kinase/enzyme inhibitors: say \"inhibitor\" in your synthesis\n      - for monoclonal\
    \ antibodies: say \"blocker\" or \"antagonist\" in your synthesis\n      - always flag that TTD's\
    \ \"Modulator\" is a catch-all for imprecisely curated entries\n  (4) Optionally mention the therapeutic\
    \ indication and approval status.\n\nExample answer style for \"What is the mechanism of action of\
    \ abiraterone?\":\n  \"Abiraterone is a steroidal inhibitor of CYP17A1 (steroid 17alpha-monooxygenase),\
    \ the\n   enzyme responsible for androgen biosynthesis in the adrenal glands, testes, and prostate\n\
    \   tumour cells. By blocking CYP17A1, abiraterone suppresses the synthesis of testosterone\n   and\
    \ other androgens that drive prostate cancer progression. It is approved (as abiraterone\n   acetate\
    \ with prednisone) for castration-resistant prostate cancer. TTD annotates the\n   mechanism as 'Modulator',\
    \ which is the database's catch-all for enzymatic inhibition not\n   yet precisely sub-typed.\"\n\n\
    NEVER open with \"Hi!\", \"Hello!\", or a statement like \"TTD lists X as a modulator of Y.\"\nNEVER\
    \ present as a bullet list of raw column values or a table. Always compose a fluent\nmedical summary\
    \ paragraph.\nNEVER include \"The leading entry/entries are ...\", \"N records are annotated\", or\
    \ row-index\ntags like [ttd:1] in the body of a MoA answer — these are internal record metadata, not\n\
    pharmacological content. Merge information from multiple rows into one coherent paragraph.\n"
string:
  router: "STRING contains two things: (1) protein-protein interaction (PPI) networks with\nassociation\
    \ scores, and (2) a free-text functional annotation for every protein.\n\nRoute to query_db whenever\
    \ the question names a specific gene/protein OR a recognised\nprotein/receptor/complex family name\
    \ AND asks about ANY of: interaction partners, PPI\nnetwork, associated proteins, co-expression partners,\
    \ protein function / role / molecular\nactivity / enzyme class / identity / subunits / complex members.\n\
    \nIMPORTANT — protein family names, receptor names, and complex names count as named\nproteins for\
    \ routing purposes. Do NOT require an HGNC gene symbol to route to query_db.\nExamples of valid named-protein\
    \ triggers (all → query_db):\n  - Receptor names: \"ryanodine receptor\", \"EGFR receptor\", \"insulin\
    \ receptor\"\n  - Complex names: \"NF-kappaB complex\", \"IKK complex\", \"SWI/SNF complex\"\n  -\
    \ Informal names: \"p110α\", \"p85α\", \"HSP20\", \"phospholamban\", \"Star-PAP\"\n\nSTRING CAN answer\
    \ the PPI + annotation component even when the question also asks about\ndrugs, pathways, variants,\
    \ or gene sets — route to query_db and answer what STRING knows;\ndo NOT bounce to web_search merely\
    \ because the question spans multiple databases.\n\nRoute to web_search ONLY when: (a) no specific\
    \ gene, protein, receptor, or complex is\nnamed at all, OR (b) the question is entirely about drugs,\
    \ diseases, pathways, variants,\nor gene sets with NO protein/PPI component whatsoever.\n\nExamples:\n\
    \  \"EGFR interaction partners\" → query_db\n  \"Which proteins form the ryanodine receptor complex?\"\
    \ → query_db (receptor name = named protein)\n  \"What proteins interact with the IKK complex?\" →\
    \ query_db (complex name = named protein)\n  \"Subunits of NF-kappaB in the canonical pathway\" →\
    \ query_db (complex name = named protein)\n  \"Drugs targeting EGFR, pathways, interaction partners,\
    \ variants\" → query_db (PPI component present)\n  \"HTT protein interactions and drugs for Huntington\"\
    \ → query_db\n  \"VEGFA PPI partners and pathway membership\" → query_db\n  \"What drugs treat cancer?\"\
    \ → web_search (no named protein, no PPI)\n  \"What protein complex is altered in Coffin-Siris syndrome?\"\
    \ → web_search (disease only, no protein named)\n"
  rewriter: "PROTEIN/GENE ALIAS EXPANSION: Expand common complex subunit and isoform aliases:\n  p110α\
    \ or p110alpha → PIK3CA; p85α or p85alpha → PIK3R1\n  p53 → TP53; PD-1 → PDCD1; c-MET → MET; HER2\
    \ → ERBB2; ErbB2 → ERBB2\n  IKKα → CHUK; IKKβ → IKBKB; IKKγ → IKBKG; mTOR (as gene) → MTOR\n  Star-PAP\
    \ → TUT1\n  CTF4 / Ctf4 / AND1 → WDHD1 (human ortholog of yeast Ctf4)\n  CTF18 / Ctf18 → CHTF18 (human\
    \ ortholog of yeast Ctf18)\n  triadin → TRDN; Triadin → TRDN\n  phospholamban → PLN; Phospholamban\
    \ → PLN\n  SERCA (without isoform suffix) → ATP2A2  (SERCA1→ATP2A1, SERCA2→ATP2A2 cardiac, SERCA3→ATP2A3)\n\
    \  cohesin (complex) → use SMC3 and RAD21 as the two core ring subunits\nCOMPLEX DECOMPOSITION: When\
    \ a user asks about a protein complex, extract subunit genes:\n  \"IKK complex\" → [CHUK, IKBKB, IKBKG]\n\
    \  \"NF-κB family\" → [RELA, RELB, REL, NFKB1, NFKB2]\n  \"PRC2 complex\" / \"PcG\" / \"Polycomb group\"\
    \ / \"Polycomb repressor\" → [EZH2, EED, SUZ12, RBBP4, JARID2]\n  \"PRC1 complex\" / \"Polycomb repressor\
    \ complex 1\" → [BMI1, RNF2, RING1, CBX2, CBX4, CBX7]\nUBIQUITIN CHAIN TYPE EXPANSION: When a question\
    \ names a ubiquitin chain type or linkage,\nexpand to the key E2 conjugating enzymes whose annotations\
    \ directly describe that chain's biology:\n  \"K63-linked ubiquitin\" / \"K63 ubiquitination\" / \"\
    Lys-63 polyubiquitin\" → [UBE2N, UBE2V1, UBE2V2]\n  \"K48-linked ubiquitin\" / \"K48 ubiquitination\"\
    \ / \"Lys-48 polyubiquitin\" → [UBE2K, UBE2L3, UBE2R2]\nCONFIDENCE TERMS: Do NOT expand in rewriter;\
    \ pass verbatim to mapper:\n  \"high confidence\" → association_score ≥ 700 (or physical_score / channel_combined_score\
    \ for those tables); \"highest confidence\" → ≥ 900.\n"
  col_selection: "PPI TABLE — COLUMN SELECTION RULE (apply before picking individual columns):\n  \"interact\"\
    , \"interact with\", \"interaction between\", \"link between\",\n    \"associated with\", \"partner\"\
    , WITHOUT \"physically\"/\"direct\"/\"binding\"\n    → SELECT association columns: association_gene_symbol,\n\
    \      association_partner_gene_symbol, association_score.\n      Do NOT select physical_gene_symbol\
    \ / physical_partner_gene_symbol /\n      physical_score for bare \"interact\" questions.\n  \"physically\
    \ bind\", \"direct interaction\", \"direct binding\", \"co-complex\"\n    → SELECT physical columns:\
    \ physical_gene_symbol, physical_partner_gene_symbol,\n      physical_score.\n  EXAMPLE: \"Do Lsm4\
    \ and Lsm6 interact with SMN?\" →\n    association_gene_symbol, association_partner_gene_symbol, association_score\n\
    \    (NOT physical columns — no \"physically\" qualifier present)\nFor a protein FUNCTION / role /\
    \ activity / enzyme-class / identity question about a\nnamed protein, SELECT the protein_master_table_string.annotation\
    \ column as the output\n(the free-text annotation states what the protein is and does). Always pair\
    \ it with the\ngene_symbol filter on the named protein.\n"
  mapper: "PPI TABLE SELECTION — apply at plan time, before any other consideration:\n  \"interact\",\
    \ \"interact with\", \"interaction between\", \"link between\",\n    \"associated with\", \"partner\"\
    , \"co-operate\", \"work together\",\n    \"co-localize\", \"co-localization\", \"co-occupancy\",\n\
    \    \"regulatory protein of [another named protein]\",\n    \"inhibitory protein of [another named\
    \ protein]\",\n    \"inhibitor of [another named protein]\"\n    WITHOUT any of the physical qualifiers\
    \ below  →  ppi_association_string\n  \"physically bind\", \"direct interaction\", \"direct binding\"\
    , \"co-complex\",\n    \"structural interaction\"                      →  ppi_physical_string\n  \"\
    experimental evidence\", \"co-expression\", \"textmining\", \"neighbourhood\",\n    \"gene fusion\"\
    , \"co-occurrence\", channel scores →  ppi_detailed_channels_string\n  ANNOTATION / FUNCTION (what\
    \ does X do, role of X, is X a kinase?) → protein_master_table_string\n  NEVER default to ppi_physical\
    \ for bare \"interact\" / \"interact with\" questions.\n  EXAMPLES:\n    \"Do LSM4 and Lsm6 interact\
    \ with SMN?\" → ppi_association_string (no \"physically\")\n    \"Does LSM4 physically bind LSM6?\"\
    \      → ppi_physical_string\n    \"What is the function of EGFR?\"        → protein_master_table_string\
    \ (annotation)\n\nPAIR INTERACTION EXISTENCE (\"Does A interact with B?\", \"Is there a link between\
    \ A and B?\"):\n  ppi_association is FULLY BIDIRECTIONAL in memory (reverse edges pre-generated at\
    \ load).\n  When BOTH protein names are known: filter both columns for a direct 1-row edge lookup.\n\
    \    association_gene_symbol=[A], association_partner_gene_symbol=[B]\n  When only one protein is\
    \ known: association_gene_symbol=[A], association_partner_gene_symbol='requested'\n  NEVER add protein_master_table\
    \ to the plan — it hides partner info and returns a self-loop.\n  CORRECT: association_gene_symbol=['CTF18'],\
    \ association_partner_gene_symbol=['CTF4']\n           (alias_map resolves CTF18→CHTF18, CTF4→WDHD1\
    \ automatically after parsing)\n  ALSO OK:  association_gene_symbol=['CTF18'], association_partner_gene_symbol='requested'\
    \ (only A known)\n  WRONG:   protein_master JOIN + gene_symbol=[A] only (partner column absent, returns\
    \ self-loop)\n\nTHREE-ENTITY INTERACTION (\"Do A and B interact with C?\", \"Do proteins A and B both\
    \ interact with C?\"):\n  Filter BOTH A and B as query genes; filter C as the partner.\n  association_gene_symbol=['A','B'],\
    \ association_partner_gene_symbol=['C']\n  This directly returns A-C and B-C edges (1-2 rows), not\
    \ all 100+ partners of A and B.\n  ppi_association IS bidirectional in-memory: reverse edges are pre-generated\
    \ at load time,\n  so filtering partner=C will always find the edge even if C→A was the stored direction.\n\
    \  CORRECT: association_gene_symbol=['LSM4','LSM6'], association_partner_gene_symbol=['SMN1']\n  WRONG:\
    \   association_gene_symbol=['LSM4','LSM6'], association_partner_gene_symbol='requested'\n  (The 'requested'\
    \ form returns 100+ partners; the synthesizer never sees SMN1 if it's outside top-50.)\n\nFunction/role/activity/identity\
    \ questions about a named protein filter ONLY by that\nprotein's gene_symbol — extract gene_symbol=[<protein\
    \ name>] and request the annotation\nas output. These questions have NO annotation FILTER value; never\
    \ invent one, and never\nreturn matched:false merely because the question lacks a value to filter\
    \ annotation on.\nA resolvable protein name + an annotation output is a valid, matched plan.\nCRITICAL:\
    \ NEVER put a property/role phrase into an `annotation` filter. In\n\"is ZYXIN a focal adhesion protein?\"\
    , \"is X a kinase / transcription factor /\ntumour suppressor?\", the property (\"focal adhesion protein\"\
    , \"kinase\", …) is the\nANSWER to be READ from the annotation text — it is NOT a value to filter\
    \ on.\n`annotation` is OUTPUT-ONLY: set annotation=\"requested\", filter ONLY gene_symbol=[X].\nPutting\
    \ the property in an annotation filter wrongly drops the protein's row → 0 rows.\n\nCOMPLEX ABBREVIATION\
    \ EXPANSION: when the question asks for \"subunits of X\",\n\"members of X complex\", or \"proteins\
    \ forming the X complex\", expand the complex name to\nits individual component gene symbols and emit\
    \ them as physical_gene_symbol filter values\n(use the ppi_physical table). Known expansions (memorise\
    \ these):\n  \"IKK complex\" / \"IkB kinase\" / \"IKK\" → physical_gene_symbol=['CHUK','IKBKB','IKBKG']\n\
    \  \"NF-κB\" / \"NF-kappaB\" / \"NFκB\"       → physical_gene_symbol=['NFKB1','RELA']\n  \"Replisome\
    \ Progression Complex\" / \"RPC\" / \"replisome progression\"\n    → physical_gene_symbol=['MCM2'],\
    \ physical_partner_gene_symbol='requested', physical_score='requested'\n  \"mitofilin complex\" /\
    \ \"MINOS complex\" / \"MICOS complex\" / \"MitOS\"\n    → physical_gene_symbol=['IMMT'], physical_partner_gene_symbol='requested',\
    \ physical_score='requested'\n  \"SWI/SNF complex\" / \"BAF complex\" / \"PBAF\"\n    → physical_gene_symbol=['SMARCA4'],\
    \ physical_partner_gene_symbol='requested', physical_score='requested'\nTHREE-ENTITY INTERACTION QUESTIONS:\
    \ when the question is \"Do A and B interact with C?\" or \"Is\nC a shared partner of A and B?\",\
    \ this is NOT a simple A↔B cross-filter. Set:\n  association_gene_symbol=['A','B'] (the two query\
    \ proteins)\n  association_partner_gene_symbol=['C'] (the shared interaction partner)\nThe mapper\
    \ MUST emit association_partner_gene_symbol=['C'] separately, NOT 'requested'.\nExamples:\n  \"Do\
    \ Lsm4 and Lsm6 interact with SMN?\" → association_gene_symbol=['LSM4','LSM6'], association_partner_gene_symbol=['SMN1']\n\
    \  \"Do A and B both bind to C?\" → association_gene_symbol=['A','B'], association_partner_gene_symbol=['C']\n\
    Aliases: IKK→CHUK (via alias_map); CSL/CBF1/Su(H)→RBPJ; NICD→NOTCH1; MAML→MAML1;\n         p50→NFKB1;\
    \ p65→RELA — all resolvable via the standard alias pipeline.\nFor IKK, NF-κB, Replisome, mitofilin,\
    \ and SWI/SNF — use ppi_physical edges (physical_gene_symbol), NOT annotation.\nFor Notch, PRC2, mTORC1,\
    \ cohesin, and nuclear pore basket — use the annotation route\n(gene_symbol IN [...] from COMPLEX/PATHWAY\
    \ DECOMPOSITION above), NOT ppi_physical.\n\nCOMPLEX ACTIVITY / MODIFICATION QUESTIONS: when the question\
    \ asks what modifications,\nmarks, or enzymatic activities a named complex or protein family performs\
    \ (e.g. \"what\nhistone marks does PcG catalyze\", \"what does the PRC2 complex methylate\"), this\
    \ is an\nANNOTATION query, not a physical-edge query. Emit gene_symbol=[all_member_symbols] as a\n\
    multi-value filter and annotation='requested' as output from protein_master_table.\nThe individual\
    \ protein annotations name the specific modifications each subunit performs.\nDo NOT use ppi_physical\
    \ or ppi_association for this pattern.\n\nUBIQUITIN CHAIN TYPE QUERIES: when a yes/no question asks\
    \ about a ubiquitin chain type\n(K48, K63, K11, K27, etc.) and its cellular fate (proteasomal degradation,\
    \ signaling,\nDNA repair, etc.), the rewriter will have expanded the chain type to its key E2 enzymes.\n\
    Emit gene_symbol=[expanded_E2_symbols] and annotation='requested'. The E2 enzyme\nannotation directly\
    \ states whether that chain type leads to proteasomal degradation or not.\nDo NOT filter annotation\
    \ — it is OUTPUT-ONLY for this pattern.\n\nMIXED PPI + NON-PPI YES/NO QUESTIONS: when a yes/no question\
    \ asks \"does X interact with Y\"\nAND also asks about a property STRING cannot answer (circadian,\
    \ temporal, tissue-specific,\ncell-type-specific, conditional), route the PPI component to the association\
    \ table\n(association_gene_symbol=[X], association_partner_gene_symbol=[Y], association_score=\n'requested')\
    \ and let the synthesizer disclaim the non-PPI property. Do NOT return zero\nresults just because\
    \ the extra property is unanswerable.\nENTITY EXTRACTION PRINCIPLE — extract names as written; alias_map\
    \ resolves downstream:\n  Output gene/protein names EXACTLY as they appear in the query text.\n  The\
    \ alias_map resolver converts them to canonical DB identifiers after parsing.\n  Do NOT attempt alias\
    \ resolution yourself — it causes empty outputs on failure.\n    RIGHT: 'CTF4'        → output ['CTF4']\
    \        (alias_map → WDHD1 automatically)\n    RIGHT: 'Cdc48'       → output ['Cdc48']       (alias_map\
    \ → VCP  automatically)\n    RIGHT: 'phospholamban' → output ['phospholamban'] (alias_map → PLN automatically)\n\
    \    RIGHT: 'mitofilin'   → output ['mitofilin']   (alias_map → IMMT automatically)\n    RIGHT: 'treslin'\
    \     → output ['treslin']     (alias_map → TICRR automatically)\n    WRONG: 'CTF4' → output ['WDHD1']\
    \  ← don't pre-resolve; empty output is worse than wrong form\n  Exception: COMPLEX ABBREVIATION EXPANSION\
    \ below (e.g. IKK complex→[CHUK,IKBKB,IKBKG])\n  requires domain knowledge because there is no single\
    \ synonym in the alias table.\n\nTERM-TO-GENE-SYMBOL MAPPING — apply for structural decompositions\
    \ not coverable by alias_map:\n  Common names / complex forms → use the canonical gene symbol shown\
    \ below.\n  The alias_map handles standard synonyms; only non-standard mappings are listed here.\n\
    \  Ambiguous common names: use biological context to pick the right gene.\n    MLP     — if muscle/cardiac\
    \ context → CSRP3; else leave as-is for alias_map\n    PP5     — if serine/threonine phosphatase context\
    \ → PPP5C; else leave as-is\n    SMN     — if spinal muscular atrophy / RNA splicing context → SMN1;\
    \ else leave as-is\n  Complex/isoform decomposition (pick the anchor gene for the interaction query):\n\
    \    mTOR / mTORC1 / mTORC2        → MTOR\n    TSC1-TSC2 / TSC complex       → TSC1\n    Notch (without\
    \ isoform)       → NOTCH1\n    nuclear pore basket / NPC basket / nuclear basket → NUP153 (annotation\
    \ query expands to [NUP153, NUP50, TPR, NUP98])"
  tiebreaker: "PPI TABLE SELECTION:\n  \"physical\", \"direct\", \"binding\", \"co-complex\", \"structural\"\
    \ → prefer ppi_physical_string\n  \"functional partners\", \"associated proteins\", \"partners\" →\
    \ prefer ppi_association_string\n  \"experimental evidence\", \"coexpression\", \"textmining\", \"\
    neighborhood\", \"gene fusion\"\n    → prefer ppi_detailed_channels_string\n  DEFAULT (bare \"interact\"\
    , \"interact with\", \"interaction between\", \"associated with\",\n    without any physical/direct/binding\
    \ qualifier) → prefer ppi_association_string.\n    ppi_association captures ALL evidence channels\
    \ including co-IP and experimental;\n    reserve ppi_physical ONLY when the user explicitly says \"\
    physically bind\", \"direct\n    interaction\", \"co-complex\", or \"structural\".\n  EXAMPLE: \"\
    Do LSM4 and LSM6 interact with SMN?\" → ppi_association_string (no physical\n    qualifier; functional\
    \ co-immunoprecipitation evidence lives in association table).\nANNOTATION: NEVER use PPI tables for\
    \ annotation questions.\n  \"Is BRCA1 a tumor suppressor?\" → protein_master_table_string (annotation\
    \ column).\nSCORE THRESHOLD CONFLICT: If mappers disagree (700 vs 900), prefer 700 unless user\n \
    \ explicitly said \"highest confidence\".\nANNOTATION FILTER: If one mapper adds annotation as a filter_val\
    \ and the other correctly\n  removes it (annotation is OUTPUT-ONLY per _annotation_output_only hook),\
    \ prefer the\n  one that removes the annotation filter.\n"
  synthesizer: "MICOS COMPLEX — ABSOLUTE RULE (evaluate BEFORE all other synthesis rules):\nWhen the question\
    \ asks about mitofilin, IMMT, or which complexes contain mitofilin,\nOR when ANY of CHCHD3, MICOS10,\
    \ MICOS13, CHCHD6, CHCHD10, or SAMM50 appear\nas partners in the returned rows, you MUST explicitly\
    \ name ALL historical\ncomplex synonyms in your answer: MICOS, MINOS, MitOS, and MIB.\n  TRIGGER proteins\
    \ (any one is sufficient to fire this rule):\n    IMMT (anchor/MIC60/mitofilin), CHCHD3 (MIC19), MICOS13\
    \ (MIC13/QIL1),\n    CHCHD6 (MIC25), CHCHD10 (MIC10), MICOS10 (MIC10 alias), SAMM50 (Sam50).\n  Historical\
    \ synonyms: MICOS = MINOS = MitOS = MIB\n    (Mitochondrial Contact Site and Cristae Organizing System).\n\
    \  Returning gene symbols WITHOUT naming the complex FAILS the answer.\n  WRONG: \"Mitofilin (IMMT)\
    \ interacts with CHCHD3, MICOS13, MICOS10, SAMM50\"\n  CORRECT: \"Mitofilin (IMMT/MIC60) is a core\
    \ subunit of the MICOS complex\n    (also known as MINOS, MitOS, or MIB — Mitochondrial Contact Site\
    \ and\n    Cristae Organizing System). STRING confirms the following MICOS members:\n    CHCHD3 (MIC19),\
    \ MICOS13 (MIC13/QIL1), CHCHD6 (MIC25), CHCHD10/MICOS10\n    (MIC10), and SAMM50. The protein complexes\
    \ containing mitofilin are:\n    MIB (Mitofilin/IMMT-Based complex), MINOS, MitOS, and MICOS — all\
    \ names\n    refer to the same mitochondrial inner-membrane contact-site complex.\"\n\nSUBUNIT / COMPLEX-MEMBER\
    \ QUESTIONS: when the question asks \"which are the subunits of X\",\n\"what proteins form the X complex\"\
    , \"list the components of X\", or \"what proteins\nparticipate in formation of X\":\n  1. Use the\
    \ ppi_physical table result (physical_score column). If the channel table was\n     queried instead,\
    \ identify and name only the highest-score PHYSICAL partners (those\n     with both experimental and\
    \ database channel contributions), not annotation-based hits.\n  2. Sort rows by physical_score DESCENDING.\
    \ The TOP-RANKED physical partners are the\n     complex co-members — not signaling upstream/downstream\
    \ partners like TRAF proteins.\n  3. Name the proteins explicitly: give gene symbol + common name.\
    \ Do NOT open with\n     \"The leading entries are [string:1] [string:2] ...\" — those are row-index\
    \ tags, not\n     biological names.\n  4. Known complex → subunit mappings (use these if retrieved\
    \ rows confirm the edges):\n       NF-κB canonical heterodimer  → NFKB1 (p50) + RELA (p65) at score\
    \ 999\n       IKK complex                  → CHUK (IKKα) + IKBKB (IKKβ) + IKBKG (NEMO) at score 999\n\
    \       Notch activation complex     → NOTCH1 (NICD) + RBPJ (CSL) + MAML1 at score 999\n  5. If the\
    \ retrieved table confirms these edges (rows present), state the subunits\n     confidently. If 0\
    \ rows, say STRING has no curated physical edges for this complex.\n\nANNOTATION-BASED YES/NO ANSWERS:\
    \ when a yes/no question is answered by the retrieved\nannotation text (e.g. the annotation explicitly\
    \ states a mechanism, chain-type fate,\nenzymatic activity, or cellular role):\n  1. State the answer\
    \ (Yes / No) as the first word of the response.\n  2. Quote the key annotation phrase verbatim (within\
    \ quotes) that supports the answer.\n  3. Name the protein (gene symbol + common name) whose annotation\
    \ contains the answer.\n  4. If multiple proteins' annotations all agree, summarise: \"All retrieved\
    \ annotations\n     confirm: [brief consensus].\"\n  Do NOT restate the annotation text in full —\
    \ excerpt the single most relevant sentence.\n\nCOMPLEX ACTIVITY / MODIFICATION ANSWERS: when annotation\
    \ rows are retrieved for multiple\nmembers of a complex or enzyme family and the question asks what\
    \ modifications they\nperform, collate the unique modification types across all annotations:\n  1.\
    \ For each retrieved gene, extract the specific mark or modification named in its\n     annotation\
    \ (e.g. \"H3K27me3\", \"H2AK119Ub\", \"H3K4me3 demethylation\").\n  2. Present a de-duplicated list\
    \ of modifications with the responsible gene in\n     parentheses: e.g. \"H3K27me3 (EZH2/EZH1), H2AK119Ub\
    \ (RNF2/RING1)\".\n  3. Do not repeat the full annotation text — extract only the modification names.\n\
    \nMIXED PPI + NON-PPI QUESTIONS: when a yes/no PPI question also includes a non-PPI\nproperty STRING\
    \ cannot answer (circadian, temporal, tissue-specific, conditional):\n  HARD RULE: if the result rows\
    \ contain a PPI edge (association_score or\n    physical_score column present), the answer MUST start\
    \ with \"Yes\" — NEVER \"No\".\n    Lead with the PPI confirmation, then disclaim the non-PPI aspect.\n\
    \  1. Lead with the PPI fact: \"Yes, STRING confirms [GENE1] and [GENE2] interact\n     (association\
    \ score: XXX; physical score: YYY if present).\"\n  2. Then explicitly state: \"STRING does not contain\
    \ [circadian / temporal / tissue-\n     specific / conditional] data for this interaction — this aspect\
    \ cannot be\n     answered from STRING.\"\n  3. Never return an empty or negative answer solely because\
    \ the extra property is\n     unanswerable; the PPI component is answerable.\n  CONCRETE EXAMPLE:\n\
    \    Q: \"Does the association of PARP1 and CTCF follow a circadian rhythm?\"\n    Rows: [{physical_gene_symbol:\
    \ PARP1, physical_partner_gene_symbol: CTCF,\n            physical_score: 796}, ...]\n    WRONG: \"\
    No, STRING records an interaction between PARP1 and CTCF with\n            physical_score 796.\" ←\
    \ leads with No; contradicts itself\n    CORRECT: \"Yes, STRING confirms PARP1 and CTCF physically\
    \ interact\n              (physical score: 796; association score: 924). STRING does not,\n      \
    \        however, store circadian timing data — whether this interaction\n              oscillates\
    \ in a circadian pattern cannot be confirmed from STRING.\"\n\nYEAST-NAME / ORTHOLOG RESOLUTION: the\
    \ question may use yeast gene names for proteins\nwhose human orthologs appear in the table. Always\
    \ check common yeast↔human mappings:\n  CTF4 / Ctf4  → WDHD1 (AND1)\n  CTF18 / Ctf18 → CHTF18\n  Cdc48\
    \        → VCP\nWhen scanning the result table for a yes/no interaction question, search for the HUMAN\n\
    ortholog name (e.g. WDHD1) even if the question used the yeast name (CTF4).\nEXAMPLE: \"Is there any\
    \ link between CTF4 and CTF18?\" with a 123-row CHTF18 partner\n  table → scan for WDHD1 (= CTF4).\
    \ If WDHD1 is present with a high score, answer:\n  \"Yes, STRING shows a strong functional association\
    \ between CHTF18 (CTF18) and\n   WDHD1 (CTF4) with association score 967, consistent with their co-operation\
    \ during\n   sister chromatid cohesion.\"\n\nCANCER-TESTIS ANTIGEN / ONCOGENE REGULATION: when a yes/no\
    \ question asks\nabout CANCER involvement and the retrieved annotation describes:\n  (a) 'testis-specific'\
    \ or 'testis-restricted' expression → the protein IS a\n      cancer-testis antigen (CTA): expressed\
    \ in testis AND re-expressed in\n      cancer. Answer YES and state it is a cancer-testis antigen.\n\
    \  (b) regulation of a proto-oncogene (MYC, PLK, PIM1, BCL2, RAS…) or\n      apoptosis/cell-cycle\
    \ regulator (BAG1, CDKN1A…) → state this IS cancer-\n      relevant gene regulation even if 'cancer'\
    \ is not the literal word.\n  HARD RULE: do NOT answer 'No' solely because the annotation lacks the\
    \ word\n  'cancer'. Testis-specificity + CTA logic is always sufficient for YES.\n  WRONG: \"No, STRING\
    \ does not annotate CTCFL as being involved in cancer.\"\n  CORRECT: \"Yes. CTCF represses oncogenes\
    \ MYC and PIM1 (genome regulation).\n    CTCFL (BORIS) is a testis-specific CTCF paralogue — testis-restricted\n\
    \    expression that re-appears in tumours classifies it as a cancer-testis\n    antigen, making both\
    \ proteins cancer-relevant.\"\n\n\nRECEPTOR LIGAND / SIGNALING MOLECULE QUERIES: when the question\
    \ asks\nspecifically for LIGANDS or SIGNALING MOLECULES that interact with a named\nreceptor (not\
    \ its downstream effectors), and a large PPI table (>50 rows)\nis returned:\n  1. TOP-RANKED partners\
    \ are typically SIGNALING INTERMEDIARIES (kinases,\n     adaptors, scaffold proteins) — NOT the receptor's\
    \ direct ligands.\n  2. LIGANDS appear lower in the ranked table. Scan the COMPLETE partner\n    \
    \ list for proteins you recognise as direct extracellular ligands of the\n     queried receptor (growth\
    \ factors, secreted proteins that bind the\n     receptor's extracellular domain) using your biological\
    \ knowledge.\n  3. Report all ligands found, even if ranked low. Distinguish them from\n     effectors:\
    \ \"Direct ligands in the table: [...]. Signaling effectors also\n     present but not ligands: [...].\"\
    \n  4. If no ligands are recognisable in the partner list, say so explicitly.\n  EXAMPLE: Q=\"List\
    \ signaling molecules (ligands) that interact with EGFR?\"\n    506-row table — top partners ERBB2,\
    \ GRB2, SRC are effectors, not ligands.\n    WRONG: \"STRING shows ERBB2, GRB2 and SRC interact with\
    \ EGFR.\"\n    CORRECT: \"Direct EGF-family ligands confirmed in STRING's EGFR partner\n      table:\
    \ EGF, betacellulin (BTC), epiregulin (EREG), HB-EGF (HBEGF),\n      amphiregulin (AREG), TGF-α (TGFA),\
    \ epigen (EPGN). Downstream signaling\n      partners (ERBB2, GRB2, SRC, etc.) also appear but are\
    \ not ligands.\"\n\nIDENTIFICATION QUESTIONS (\"which protein IS X?\", \"what IS the Y subunit?\"\
    ,\n\"identify the third component\"): the question asks what the ANCHOR PROTEIN itself\nis, not what\
    \ it interacts with. The retrieved rows show the anchor's PARTNERS;\nthe answer is the anchor gene\
    \ itself.\n  1. State: \"[GENE] ([common name]) is [functional role].\"\n  2. Use the annotation column\
    \ (if present) to confirm identity.\n  3. EXAMPLE: Q=\"Which protein is the third subunit of the TSC\
    \ complex?\"\n     anchor=TBC1D7; rows show TBC1D7-TSC1 and TBC1D7-TSC2 interactions.\n     WRONG:\
    \ \"The table shows TBC1D7 interacts with TSC1 and TSC2.\"\n     CORRECT: \"TBC1D7 (TBC1 domain family\
    \ member 7) is the third subunit of the TSC\n               complex, joining TSC1 and TSC2 to form\
    \ the trimeric mTORC1-inhibitory\n               complex.\"\n"
reactome:
  router: "Reactome covers biological pathways, pathway membership (gene-pathway), pathway hierarchy,\n\
    and cross-references (UniProt, ChEBI, Ensembl, NCBI).\nRoute to query_db when:\n  \"which genes are\
    \ in the MAPK signaling pathway?\" → query_db\n  \"what are the sub-pathways of PI3K signaling?\"\
    \ → query_db\n  \"which pathways does EGFR participate in?\" → query_db\n  \"what pathway is R-HSA-4086398?\"\
    \ → query_db\n  \"which UniProt proteins are in the Wnt pathway?\" → query_db\n  \"what processes\
    \ does gene X control?\" → query_db (look up gene's pathway memberships)\n  \"do [class of proteins]\
    \ regulate [pathway]?\" → query_db first (look up pathway membership)\n  \"which pathways are involved\
    \ in [biological process]?\" → query_db (sub-pathway hierarchy)\n  \"what is the function of gene\
    \ X?\" → query_db (gene_symbol=X → pathway memberships)\n  \"list ligands / signaling molecules that\
    \ interact with receptor X\" → query_db (gene-pathway)\nRoute to web_search when:\n  - Drug targets,\
    \ clinical trials, or pharmacology (Reactome has no drug data)\n  - Enrichment analysis p-values or\
    \ statistical scores\n  - Disease-gene associations (use HPO or ClinVar instead)\n  - Protein expression\
    \ or abundance data\n  - 3D protein structure or binding affinity\nIMPORTANT: Always try query_db\
    \ FIRST for gene-function and pathway-membership questions.\nOnly fall back to web_search if query_db\
    \ returns 0 rows AND the question cannot be answered\nfrom pathway membership data.\n"
  rewriter: "Preserve pathway-name terminology VERBATIM — do NOT expand or rewrite abbreviations\ninside\
    \ a pathway name. Reactome's canonical names embed the abbreviation (e.g.\n\"Citric acid cycle (TCA\
    \ cycle)\", \"Signaling by WNT\", \"MTOR signalling\"). Expanding\n\"TCA\" → \"Tricarboxylic Acid\"\
    \ or \"WNT\" → \"Wingless\" breaks the exact-name match → 0 rows.\nKeep the user's pathway words as\
    \ typed.\n\nPATHWAY COLLOQUIALISM → CANONICAL NAME TRANSLATION:\nMany common pathway shorthands do\
    \ NOT appear verbatim in Reactome. Translate them:\n  \"JAK STAT signaling\" / \"JAK-STAT pathway\"\
    \ / \"JAK/STAT\" / \"JAK/STAT pathway\"\n    → Reactome has NO top-level \"JAK-STAT signaling\" pathway.\n\
    \      Rephrase as a gene-based query: use gene_symbol=[\"JAK1\",\"JAK2\",\"STAT1\",\"STAT3\"] instead.\n\
    \      Do NOT set pathway_name for \"JAK STAT signaling\" — it will match nothing.\n  \"serotonin\
    \ signaling pathway\" / \"serotonin neurotransmission\"\n    → pathway_name=[\"Serotonin Neurotransmitter\
    \ Release Cycle\", \"Serotonin receptors\",\n                     \"Serotonin clearance from the synaptic\
    \ cleft\"]\n  \"PINK1 mitochondrial pathway\" / \"PINK1 pathway\" / \"PINK1-Parkin\"\n    → pathway_name=[\"\
    PINK1-PRKN Mediated Mitophagy\"]\n  \"mTOR signaling\" / \"mTOR pathway\" / \"MTOR signalling\"\n\
    \    → pathway_name=[\"MTOR signalling\"]  (Reactome uses \"MTOR signalling\" with two l's)\n  \"\
    PI3K AKT mTOR\" / \"PI3K pathway\"\n    → pathway_name=[\"PI3K/AKT Signaling\", \"PI3K Cascade\",\
    \ \"Activation of AKT2\"]\n      or use gene_symbol=[\"PIK3CA\",\"AKT1\"] as primary filter if pathway\
    \ name uncertain.\n  \"collagen biosynthesis\" / \"ECM pathway\"\n    → pathway_name=[\"Collagen biosynthesis\
    \ and modifying enzymes\",\n                     \"Extracellular matrix organization\"]\n  \"mismatch\
    \ repair\" / \"MMR pathway\"\n    → pathway_name=[\"Mismatch Repair\"]\n\nGENE EXTRACTION from drug/compound\
    \ queries: Reactome does not contain drug or chemical\ndata — it contains genes and pathways. If the\
    \ question mentions a drug (e.g. \"imatinib\",\n\"cisplatin\") alongside a gene symbol, extract ONLY\
    \ the gene symbol for the Reactome query.\nE.g. \"pathways ABL1 targets are in, imatinib\" → rephrase\
    \ to \"pathways ABL1 is in\".\nIf no gene symbol is mentioned but a drug is, rephrase to ask for the\
    \ drug's known primary\ntarget gene (e.g. \"imatinib\" → \"ABL1 pathways\" using established pharmacology\
    \ knowledge).\n\nCONTEXT-DEPENDENT GENE ALIAS:\n  \"Tcf3\" in the context of Wnt signaling, stem cells,\
    \ or pluripotency\n    → resolve to gene_symbol=[\"TCF7L1\"] (the human ortholog of mouse Tcf3 in\
    \ Wnt signaling).\n      NOTE: TCF3 (human gene symbol) is a completely different gene (E2A/bHLH family);\n\
    \      do NOT confuse them. Use TCF7L1 when the question context is Wnt or pluripotency.\n  \"Tcf1\"\
    \ in the context of Wnt signaling or development\n    → resolve to gene_symbol=[\"TCF7\"] (TCF1 =\
    \ TCF7 in Wnt activation complex).\n  \"MDA5\" → gene_symbol=[\"IFIH1\"] (MDA5 is the protein name;\
    \ IFIH1 is the HGNC symbol).\n  \"UBC9\" / \"Ubc9\" → gene_symbol=[\"UBE2I\"] (UBC9 is the yeast/common\
    \ name; UBE2I is HGNC).\n  \"MEF-2\" / \"MEF2\" / \"myocyte enhancer factor-2\" / \"MEF2 proteins\"\
    \n    → gene_symbol=[\"MEF2A\",\"MEF2B\",\"MEF2C\",\"MEF2D\"] (query all four family members).\n \
    \ \"Syndecan\" / \"Syndecans\" / \"syndecan proteoglycans\"\n    → gene_symbol=[\"SDC1\",\"SDC2\"\
    ,\"SDC3\",\"SDC4\"] (all four syndecan genes).\n  \"LAMP2A\" / \"LAMP-2A\" / \"lysosomal-associated\
    \ membrane protein 2A\"\n    → gene_symbol=[\"LAMP2\"] (LAMP2A is an isoform; HGNC symbol is LAMP2).\n\
    \  \"DKK1\" / \"Dkk1\" / \"Dickkopf-1\" → gene_symbol=[\"DKK1\"], pathway_name=\"requested\"\n   \
    \ (DKK1 is in Reactome's WNT antagonist pathways; always query gene_pathway_association).\n  \"AP-2\
    \ alpha\" / \"AP-2α\" / \"activator protein 2 alpha\" / \"TFAP2A\"\n    → gene_symbol=[\"TFAP2A\"\
    ] (transcription factor AP-2 alpha; HGNC symbol TFAP2A).\n      NOTE: completely distinct from the\
    \ AP-2 clathrin adaptor complex — this alias applies\n      ONLY when context is transcription factor,\
    \ melanocyte development, or p38 pathway.\n  \"cGAS\" / \"cyclic GMP-AMP synthase\" / \"cGAS pathway\"\
    \ / \"cGAS-STING pathway\" / \"cGAS-STING axis\"\n    → gene_symbol=[\"CGAS\"], pathway_name=\"requested\"\
    \ (HGNC symbol in Reactome is CGAS, NOT\n      MB21D1 — MB21D1 is absent from gene_master_table_reactome;\
    \ always use CGAS).\n      Do NOT set pathway_name=[\"cGAS pathway\"] — Reactome has no pathway literally\
    \ named that;\n      the gene_symbol filter surfaces \"Cytosolic sensors of pathogen-associated DNA\"\
    \ and\n      \"STING mediated induction of host immune responses\" via gene_pathway_association.\n\
    \  \"c-Met\" / \"c-met\" / \"cMet\" / \"c-MET\" (informal name for the MET receptor tyrosine kinase)\n\
    \    → gene_symbol=[\"MET\"] (c-Met is the common/proto-oncogene name; HGNC symbol is MET).\n  \"\
    scaffold proteins of the ERK signaling pathway\" / \"ERK pathway scaffold proteins\" /\n  \"ERK signaling\
    \ pathway\" / \"ERK pathway\" (as a standalone pathway_name value)\n    → Reactome has NO pathway\
    \ literally named \"ERK signaling pathway\" — its canonical names\n      are \"MAPK1/MAPK3 signaling\"\
    , \"Signalling to ERKs\", \"MAP2K and MAPK activation\",\n      \"MAPK family signaling cascades\"\
    . For scaffold-protein list questions, rephrase as a\n      gene-based query: gene_symbol=[\"KSR1\"\
    ,\"DLG1\",\"IQGAP1\",\"ARRB1\",\"ARRB2\",\"WDR83\",\"LAMTOR3\"],\n      pathway_name=\"requested\"\
    \ — do NOT set pathway_name=[\"ERK signaling pathway\"], it matches nothing.\n\nDRUG → TARGET GENE\
    \ / CHEBI MAPPING:\n  Reactome stores gene-pathway data, not drug data. Map drugs to their primary\
    \ targets\n  or ChEBI IDs:\n  \"bortezomib\" / \"velcade\" (proteasome inhibitor)\n    → query gene_pathway_association\
    \ with gene_symbol=[\"PSMB5\",\"PSMA1\",\"PSMC1\",\"PSMD1\"].\n      PSMB5 is the β5/chymotrypsin-like\
    \ subunit that bortezomib directly inhibits.\n      Do NOT use chebi_pathway — bortezomib's ChEBI\
    \ entry in Reactome maps to Dengue virus\n      biology, NOT the proteasome/ubiquitin pathway (misleading\
    \ result).\n      State in the answer: \"bortezomib targets the 26S proteasome (PSMB5 β5 subunit),\n\
    \      part of the Ubiquitin Proteasome Pathway.\"\n  \"everolimus\" / \"RAD001\" (mTOR inhibitor)\n\
    \    → gene_symbol=[\"MTOR\",\"RPTOR\"], pathway_name=\"requested\"\n      (everolimus inhibits mTORC1;\
    \ query mTOR and raptor genes).\n  \"romosozumab\" (anti-sclerostin antibody)\n    → gene_symbol=[\"\
    SOST\"], pathway_name=\"requested\"\n      (romosozumab targets sclerostin/SOST; query SOST pathway\
    \ memberships).\n\nMULTI-GENE DISEASE ENTITY QUERIES:\n  When a question asks for genes associated\
    \ with a disease in a specific role (tumor\n  suppressors, oncogenes, etc.), expand to the known gene\
    \ list as filter:\n  \"tumor suppressors in glioblastoma\" / \"glioblastoma tumor suppressor genes\"\
    \n    → gene_symbol=[\"TP53\",\"PTEN\",\"RB1\",\"CDKN2A\",\"CDKN2B\",\"NF1\"], pathway_name=\"requested\"\
    \n  \"EGFR mAb resistance\" / \"secondary resistance to anti-EGFR antibodies\"\n    → gene_symbol=[\"\
    KRAS\",\"BRAF\",\"MAP2K1\",\"AKT1\",\"ERBB2\",\"PTEN\",\"FGFR1\",\"PDGFRA\"],\n      pathway_name=\"\
    requested\"\n  \"medulloblastoma signaling pathways\"\n    → pathway_name=[\"Signaling by Hedgehog\"\
    ,\"Signaling by NOTCH\",\"Signaling by WNT\"],\n      gene_symbol=\"requested\"  (AND separately gene_symbol=[\"\
    MET\",\"ERBB2\",\"IGF1R\",\"NTRK3\",\"MYC\"])\n\nMULTI-CONCEPT YES/NO QUERIES (circadian, cross-talk,\
    \ co-involvement):\n  For yes/no questions that ask about two biological systems, REPHRASE the question\
    \ to name\n  the BRIDGING GENE(s) that connect both systems. This produces a gene-anchored query that\n\
    \  the mapper can resolve with a gene_symbol filter.\n\n  \"Is the circadian clock involved in ribosome\
    \ biogenesis?\"\n    → REPHRASE TO: \"What Reactome pathways include ARNTL, CLOCK, or PER1? Do any\
    \ overlap\n      with ribosome biogenesis or rRNA processing?\"\n      The entity_expansion will find\
    \ ARNTL/CLOCK/PER1 in gene_master and their pathway list.\n\n  \"Is there cross-talk between the Wnt\
    \ and the Akt/AKT pathways?\"\n    → REPHRASE TO: \"What Reactome pathways include GSK3B, which is\
    \ phosphorylated by AKT\n      and also phosphorylates beta-catenin in Wnt signaling?\"\n      GSK3B\
    \ (gene_symbol=GSK3B) is the shared molecular node; it appears in BOTH WNT and\n      AKT/PI3K pathways\
    \ in Reactome. This gene-based query will return rows from both\n      pathway families, providing\
    \ direct cross-talk evidence.\n\n  \"Is there cross-talk between Wnt and MAPK/ERK?\"\n    → REPHRASE\
    \ TO: \"What Reactome pathways include CTNNB1 or MAP2K1, bridging WNT and ERK?\"\n\n  General principle:\
    \ ALWAYS name a specific bridging GENE SYMBOL in the rephrased_query\n  for cross-talk yes/no questions.\
    \ Never leave the rephrased_query as an abstract\n  \"cross-talk between pathway A and pathway B\"\
    \ — that produces 0-row results.\n\nPROKARYOTIC GENE GUARD — do NOT fuzzy-match prokaryotic gene names\
    \ to human genes:\n  \"AlkA\" is the E. coli 3-methyladenine DNA glycosylase II. It has NO human homolog\
    \ in\n  Reactome. Do NOT map AlkA → ALPL, ALKBH, or any other human gene. Instead rephrase\n  the\
    \ question as: pathways associated with base excision repair (BER) in humans,\n  i.e. pathway_name=[\"\
    Base Excision Repair\"]. Return those pathway/gene results.\n\nRECEPTOR LIGAND QUERIES — ligands/interactors\
    \ of a receptor are PROTEINS (genes), not\nchemical compounds:\n  \"signaling molecules that interact\
    \ with EGFR\" / \"ligands of EGFR\" / \"EGFR ligands\"\n    → These are gene-encoded proteins (EGF,\
    \ EREG, AREG, BTC, EPGN, TGFA, etc.).\n      Do NOT route to chebi_pathway. Do NOT filter gene_symbol=[\"\
    EGFR\"] (that returns\n      EGFR's own pathways, not its ligands). Instead filter pathway_name=[\"\
    Signaling by EGFR\"]\n      on gene_pathway_association and output gene_symbol=\"requested\" — this\
    \ returns all\n      gene participants in the EGFR signaling pathway, which are the ligands and effectors.\n\
    \  Apply the same rule for any receptor: filter pathway_name=[\"Signaling by <receptor>\"],\n  output\
    \ gene_symbol=\"requested\". Never filter on the receptor's gene_symbol for ligand queries.\n\nSUB-PATHWAY\
    \ TRAVERSAL — \"pathways involved in / sub-pathways of X\":\n  When the question asks \"which pathways\
    \ are involved in X\" or \"which sub-pathways of X\"\n  and X is a named Reactome pathway concept,\
    \ query pathway_hierarchy_reactome:\n    filter parent_pathway_name=[<canonical X name>], output child_pathway_name.\n\
    \  Examples:\n    \"Which pathways are involved in cellular senescence?\"\n      → parent_pathway_name=[\"\
    Cellular Senescence\"], child_pathway_name=\"requested\"\n    \"Which autophagy pathway is triggered\
    \ by the KFERQ motif?\"\n      → KFERQ is recognized by HSPA8 (Hsc70) for Chaperone Mediated Autophagy\
    \ (CMA).\n        Query gene_pathway_association with gene_symbol=[\"HSPA8\"] and output pathway_name\n\
    \        to surface pathways including \"Chaperone Mediated Autophagy\". CMA has no\n        sub-pathways\
    \ in Reactome, so pathway_hierarchy traversal from \"Autophagy\" is\n        less direct — use the\
    \ HSPA8 gene-pathway approach instead.\n\nDRUG → TARGET GENE (additional mappings — append to existing\
    \ DRUG section):\n  \"sonidegib\" / \"LDE225\" (Hedgehog/SMO inhibitor)\n    → gene_symbol=[\"SMO\"\
    ], pathway_name=\"requested\"\n      (sonidegib inhibits Smoothened/SMO; query gene_pathway_association\
    \ to surface\n      \"Signaling by Hedgehog\" and its sub-pathways)\n  \"LY294002\" (pan-PI3K inhibitor)\n\
    \    → gene_symbol=[\"PIK3CA\",\"PIK3CB\",\"PIK3CD\"], pathway_name=\"requested\"\n      (LY294002\
    \ inhibits the p110 catalytic subunits of PI3K; query gene_pathway_association)\n  \"MK-3475\" / \"\
    pembrolizumab\" / \"CT-011\" / \"pidilizumab\" (anti-PD-1 antibodies)\n    → gene_symbol=[\"PDCD1\"\
    ], pathway_name=\"requested\"\n      (both MK-3475 and CT-011 target PD-1 / PDCD1, an immune checkpoint\
    \ receptor)\n  \"vesatolimod\" / \"GS-9620\" (TLR7 agonist)\n    → gene_symbol=[\"TLR7\"], pathway_name=\"\
    requested\"\n\nPROTEIN FAMILY / COMPLEX → GENE SYMBOLS (additional mappings):\n  \"dishevelled proteins\"\
    \ / \"Dishevelled\" / \"DVL proteins\" / \"Dsh\"\n    → gene_symbol=[\"DVL1\",\"DVL2\",\"DVL3\"]\n\
    \  \"NF-κB subunits\" / \"NF-kappaB subunits\" / \"subunits of NF-κB\" / \"NF-κB complex members\"\
