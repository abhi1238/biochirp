  mapper: "Pathway hierarchy uses two name columns in pathway_hierarchy_reactome:\nparent_pathway_name\
    \ (the broader/super pathway) and child_pathway_name (the narrower/sub pathway).\n- \"children of\
    \ X\" / \"sub-pathways of X\" / \"what is under X\" → filter parent_pathway_name=[X],\n  output child_pathway_name=\"\
    requested\". NEVER filter pathway_master_table.pathway_name for these.\n- \"parent of X\" / \"super-pathway\
    \ of X\" / \"what is X part of\" → filter child_pathway_name=[X],\n  output parent_pathway_name=\"\
    requested\".\nThe named pathway is always the FILTER value on the OPPOSITE column from what is requested.\n\
    CRITICAL: bind the pathway name to EXACTLY ONE of parent_pathway_name / child_pathway_name. The other\
    \ is\nOUTPUT-ONLY (\"requested\") and must NEVER carry a filter value. Putting the same name on BOTH\n\
    parent_pathway_name and child_pathway_name ANDs them together → 0 rows (no pathway is its own parent/child).\n\
    WRONG: \"children of Immune System\" → pathway_name=[\"Immune System\"]\nWRONG: \"parent of Apoptosis\"\
    \ → child_pathway_name=[\"Apoptosis\"], parent_pathway_name=[\"Apoptosis\"]  (both filtered → 0 rows)\n\
    RIGHT: \"children of Immune System\" → parent_pathway_name=[\"Immune System\"], child_pathway_name=\"\
    requested\"\nRIGHT: \"parent of Apoptosis\" → child_pathway_name=[\"Apoptosis\"], parent_pathway_name=\"\
    requested\"\nCOMPOUND \"<entity> OF the sub-pathways/children of X\" (e.g. \"genes / proteins / chemicals\n\
    associated with the sub-pathways of Cell Cycle\"): STILL bind the named pathway to the hierarchy\n\
    column as above — filter parent_pathway_name=[X] for \"...of the sub-pathways of X\" (or\nchild_pathway_name=[X]\
    \ for \"...of the parent of X\") — but the OUTPUT is the ENTITY, not the\npathway: set gene_symbol\
    \ / uniprot_accession / chebi_id / ensembl_id / ncbi_gene_id = \"requested\".\nDo NOT bind X to pathway_name\
    \ and do NOT output child_pathway_name in this case.\nRIGHT: \"genes of the sub-pathways of Cell Cycle\"\
    \ → parent_pathway_name=[\"Cell Cycle\"], gene_symbol=\"requested\"\n\nGENE-SYMBOL ANCHOR rule (applies\
    \ to all question types EXCEPT ligand/interactor queries):\nIf the question explicitly names a gene\
