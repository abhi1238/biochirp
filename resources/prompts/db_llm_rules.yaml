    ], pathway_name=\"requested\"\nRIGHT: \"Is JAK2 involved in the STAT pathway?\" → gene_symbol=[\"\
    JAK2\"], pathway_name=\"requested\"\nDECISION RULE: if the question contains a gene symbol AND a named\
