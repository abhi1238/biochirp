    \ over\n   one that redirects to STRING DB — the table exists with interaction_type/interactor_gene\n\
    \   columns. Only redirect to STRING for network-wide topology or confidence-scored queries.\n4. FUNCTION\
    \ QUERIES: PREFER protein_function_uniprot (function_text column, substring match)\n   over GO annotations\
    \ for \"what does X do\" / \"role of X\" / \"mechanism of X\" questions.\n5. For GO aspect conflicts:\
    \ 'molecular function' = F, 'biological process' = P, 'location/component' = C.\n6. protein_id column\
