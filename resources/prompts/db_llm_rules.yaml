    \ between Notch and Wnt\" → gene_symbol=[\"AXIN1\"], pathway_name=\"requested\"\nGeneral rule: when\
    \ in doubt, use the most well-known effector gene of one pathway.\n\nYES/NO GENE-PATHWAY ASSOCIATION\
