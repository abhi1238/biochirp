# BioChirp nginx rate-limit zones.
#
# These directives MUST live in the `http {}` context (not inside a server{}
# block). The simplest install is to drop this file into
# /etc/nginx/conf.d/ which nginx auto-includes at http scope:
#
#   sudo cp deploy/nginx-rate-limits.conf /etc/nginx/conf.d/biochirp-rate-limits.conf
#   sudo nginx -t && sudo systemctl reload nginx
#
# Pair this with the matching `limit_req` / `limit_conn` lines in
# nginx-mcp.conf, nginx-share.conf, and any chat-WS server block. The zones
# below are conservative — meant to bound abuse, not to throttle real users.
#
# All zones key on $binary_remote_addr so each client IP gets its own bucket.
# 10 MB of shared memory ≈ 160 000 unique IPs tracked.

# General-purpose chat / MCP traffic. 60 req/min ≈ 1/s steady, with a 30-req
# burst (~30 s of pent-up load). Anything faster is bot-like.
limit_req_zone $binary_remote_addr zone=biochirp_default:10m rate=60r/m;

# MCP SSE / streamable endpoints. Same headline rate, separate zone so we can
# observe and tune independently.
limit_req_zone $binary_remote_addr zone=biochirp_mcp:10m rate=60r/m;

# Share creation is a write op — strict. 10/min/IP is more than any human
# clicking the "Share" button needs.
limit_req_zone $binary_remote_addr zone=biochirp_share_post:10m rate=10r/m;

# Share viewing — read-only, link-shared, can spike legitimately.
limit_req_zone $binary_remote_addr zone=biochirp_share_get:10m rate=120r/m;

# Download endpoint — same logic as share GET but generally lower volume.
limit_req_zone $binary_remote_addr zone=biochirp_download:10m rate=30r/m;

# WebSocket connection opens (handshake only — once established the WS stays
# open). 12/min/IP catches reconnect storms without hurting legit users.
limit_req_zone $binary_remote_addr zone=biochirp_ws:10m rate=12r/m;

# Concurrent connection cap per IP — prevents a single client from holding
# open hundreds of WS connections.
limit_conn_zone $binary_remote_addr zone=biochirp_conn:10m;

# Centralised log format for limit events. Tail with:
#   sudo tail -F /var/log/nginx/biochirp-ratelimit.log
limit_req_log_level warn;
limit_conn_log_level warn;
