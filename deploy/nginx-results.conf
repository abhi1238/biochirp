# Public read-only HTTPS endpoint for BioChirp per-DB CSV results.
#
# Install:
#   1. sudo cp deploy/nginx-results.conf /etc/nginx/snippets/biochirp-results.conf
#   2. In /etc/nginx/sites-available/biochirp, INSIDE the `listen 443 ssl` block
#      (not the :80 redirect block — that catches it and 301s away), add:
#          include /etc/nginx/snippets/biochirp-results.conf;
#   3. sudo nginx -t && sudo systemctl reload nginx
#   4. Set the MCP env var so responses embed clickable URLs:
#         Environment=BIOCHIRP_PUBLIC_CSV_BASE=https://biochirp.iiitd.edu.in/results
#      Put this in /etc/systemd/system/biochirp-mcp.service alongside the other
#      Environment= lines, then:
#         sudo systemctl daemon-reload && sudo systemctl restart biochirp-mcp.service
#
# Security notes:
#   • CSV filenames are UUID-based (24+ random hex chars from uuid.uuid4()),
#     so the URLs are unguessable in practice. Treat them as bearer tokens.
#   • Files contain only public-tier biomedical data already served by the
#     parent BioChirp endpoints — nothing private or PHI.
#   • If you ever want auth, drop in an `auth_basic` directive here or front
#     the location with the same SSO the rest of the site uses.

location /results/ {
    alias /home/abhishekh/abhi/biochirp/results/;

    # Allow only files (no directory listing) and only the CSV extension we
    # actually emit. Reject anything funky in the URL.
    autoindex off;

    # Serve the static viewer HTML page that ships with the MCP server. It
    # reads ?file=foo.csv via JS and fetches /results/foo.csv. One physical
    # file, served from the mcp_server/web dir so it deploys with the
    # python package.
    location = /results/view.html {
        alias /home/abhishekh/abhi/biochirp/mcp_server/web/view.html;
        add_header Cache-Control          "public, max-age=300";
        add_header X-Content-Type-Options "nosniff";
        types { } default_type text/html;
    }

    location ~* \.csv$ {
        # Force download-friendly headers so browsers prompt save-as instead
        # of trying to render. Claude Desktop / claude.ai users tap the link
        # in the embedded resource block; this makes the click do the right
        # thing on every platform.
        add_header Content-Type           "text/csv; charset=utf-8";
        add_header Content-Disposition    "attachment";
        add_header Cache-Control          "private, max-age=600";
        add_header X-Content-Type-Options "nosniff";
        # Reflect Access-Control so a future fetch() from claude.ai works.
        add_header Access-Control-Allow-Origin "*";
        try_files $uri =404;
    }

    # Block all non-CSV access (.env, .py, dotfiles, traversal, etc.)
    location ~ /\. { deny all; }
    location ~ \.(py|env|sh|conf|service|log|md|txt|json|yml|yaml)$ { deny all; }

    # Default catch-all inside /results/ — reject anything that didn't match
    # the .csv block above. Prevents directory listing leaks.
    return 404;
}
