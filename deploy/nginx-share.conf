# Public HTTPS routing for the BioChirp share endpoints.
#
# These endpoints are served by the dedicated `biochirp_share_tool` service
# (app/tools/share/app/main.py, container port 8030) — a lean FastAPI + Redis
# service extracted from the decommissioned bio_chat orchestrator (2026-06-18),
# which used to serve /share at its root. They need their own location block
# since they aren't nested under any other service's URL prefix.
#
#   POST /share      → create a snapshot, return {id,url,expires_in_seconds}
#   GET  /s/{id}     → render the read-only snapshot
#
# Install:
#   1. sudo cp deploy/nginx-share.conf /etc/nginx/snippets/biochirp-share.conf
#   2. In /etc/nginx/sites-available/biochirp, INSIDE the `listen 443 ssl`
#      block (NOT the :80 redirect block — see nginx-results.conf for the
#      same gotcha), add:
#          include /etc/nginx/snippets/biochirp-share.conf;
#   3. sudo nginx -t && sudo systemctl reload nginx
#
# Notes:
#   • POST /share bodies can be up to MAX_SHARE_HTML_BYTES (5 MB default).
#     Make sure `client_max_body_size` in the surrounding server{} block is
#     at least that large.
#   • Snapshots stored with `unsafe: true` keep their inline scripts so the
#     viewer can expand panels and download CSVs. They're served inside a
#     sandboxed iframe srcdoc; the viewer's chat-input and websocket are
#     suppressed by a window-flag check in the captured page's bootstrap.

location = /share {
    # Rate-limit zones defined in deploy/nginx-rate-limits.conf.
    limit_req  zone=biochirp_share_post burst=5 nodelay;
    limit_conn biochirp_conn 16;
    proxy_pass http://127.0.0.1:8030;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;
    proxy_send_timeout 60s;
    # Snapshot HTML can be large (embedded tables, CSV strings).
    client_max_body_size 8m;
}

location ^~ /s/ {
    limit_req zone=biochirp_share_get burst=30 nodelay;
    proxy_pass http://127.0.0.1:8030;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;
    proxy_send_timeout 60s;
}
