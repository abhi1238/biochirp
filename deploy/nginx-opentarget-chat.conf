# ─────────────────────────────────────────────────────────────────────────────
# Open Targets (the 11th BioChirp DB) — standalone chat routes.
#
# WHY THIS FILE: OpenTargets chat used to be orchestrated THROUGH bio_chat
# (frontend SPECIAL_WS['opentarget'] = '/bio_chat/?locked_db=opentargets').
# bio_chat was decommissioned 2026-06-18 (port 8028/8030, removed). The frontend
# (frontend/assets/chat-bootstrap.js) now routes OpenTargets chat to its OWN
# backend: SPECIAL_WS['opentarget'] = '/opentarget/' → opentarget_service:8026.
#
# opentarget_service registers the WebSocket at BOTH /opentarget and /opentarget/
# (opentarget_service/app/main.py:446 + :950), so the `^~ /opentarget/` proxy
# below reaches it cleanly.
#
# These two `location` blocks belong in the main server{} block of the active
# site config (/etc/nginx/sites-enabled/biochirp or biochirp.conf). They are NOT
# emitted by scripts/gen_compose.py (that only generates the per-DB /<db>_chat/
# routes in nginx_chat_routes.conf). This file is the tracked reference copy.
# ─────────────────────────────────────────────────────────────────────────────

# Serve the Open Targets chat page.
location = /opentarget {
    root /home/abhishekh/abhi/biochirp/frontend;
    try_files /opentarget_api.html =404;
    default_type text/html;
}

# Proxy the WebSocket (and any /opentarget/*) to opentarget_service:8026.
location ^~ /opentarget/ {
    proxy_pass http://127.0.0.1:8026;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 300s;
    proxy_cache_bypass $http_upgrade;
}

# ── REMOVE the now-dead bio_chat routes from the active config (backend gone) ──
#   location = /bio_chat        { ... try_files /bio_chat_api.html ... }
#   location ^~ /bio_chat/      { proxy_pass http://127.0.0.1:8028; ... }   # and /bio_chat_v2/
# Nothing serves 8028/8030 anymore (bio_chat decommissioned).
