# BioChirp security response headers — include from each server { } block
# that serves the chat frontend or any HTML rendered with LLM/DB content.
#
# Usage (from /etc/nginx/sites-available/biochirp.conf, inside `server { ... }`):
#     include /etc/nginx/snippets/biochirp-security-headers.conf;
#     # or:
#     include /home/abhishekh/abhi/biochirp/deploy/nginx-security-headers.conf;
# then:
#     sudo nginx -t && sudo systemctl reload nginx
#
# CSP RATIONALE
# -------------
# The chat frontend currently embeds large inline <script> blocks (per-page
# logic, ~1500 lines each) and inline CSS via `style="..."` attributes.
# A fully strict CSP — `script-src 'self'` and `style-src 'self'` without
# `'unsafe-inline'` — would require moving every inline script to an
# external file (and either nonce-injecting CSS or moving every inline
# style to a stylesheet). That is a large, separate refactor.
#
# The CSP below is the strongest header we can ship TODAY without a
# behaviour-breaking rewrite:
#
#   • Blocks loading any remote script except the two trusted CDNs
#     (marked.js and DOMPurify on jsdelivr).
#   • Blocks Flash/Java/etc. plugins (`object-src 'none'`).
#   • Prevents `<base>` hijack (`base-uri 'self'`).
#   • Prevents this site being framed (`frame-ancestors 'none'`).
#   • Forces all sub-resources to HTTPS once the site is on HTTPS
#     (`upgrade-insecure-requests`).
#   • Restricts form submissions to same-origin (`form-action 'self'`).
#   • Allows `'unsafe-inline'` ONLY for scripts and styles, NOT for
#     anything else. Inline `onclick=`/`onload=`/etc. attributes have
#     already been removed from the chat pages (2026-05-12) in
#     preparation for tightening this further.
#
# CURRENT STATE (2026-05-17):
#   • script-src: 'unsafe-inline' DROPPED. Replaced with per-block SHA256
#     hashes of every inline <script> body in frontend/*.html. CDN
#     allowlist kept (jsdelivr for marked/DOMPurify/highlight, tailwind).
#     Auto-generated by scripts/security/regen_csp_hashes.py — re-run
#     after editing any inline <script> body.
#   • style-src: 'unsafe-inline' KEPT. Pervasive style="..." attributes
#     would break otherwise; removing them is a separate refactor with
#     lower XSS payoff than the script-src tightening.
#
# REGENERATING:
#   python3 scripts/security/regen_csp_hashes.py
#   sudo cp deploy/nginx-security-headers.conf /etc/nginx/snippets/biochirp-security-headers.conf
#   sudo nginx -t && sudo systemctl reload nginx

# >>> biochirp-csp-script-src >>>
# AUTOGENERATED by scripts/security/regen_csp_hashes.py — DO NOT EDIT BY HAND.
# 18 unique inline <script> hashes across frontend/*.html.
# 'unsafe-inline' is dropped from script-src; kept in style-src because
# pervasive style="..." attributes would otherwise break.
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'sha256-0oNYjVhrlgjyhtZWljjO3e8pxHc2Ejqw03Svf4A+S28=' 'sha256-2vcFgv4U6SQAKZlUJTLWfwYhpIQJP/5dBcDt+MZ442I=' 'sha256-5NYJnGN0QspR5Ot1wo/ZZ1uaqz75CSClp3MUQQpC0/4=' 'sha256-6Gu+1JPX176g1tc75GVcNGv3cN/84/LcbJHYNVqI/OQ=' 'sha256-86rh7T7eVqxVeRRKGFdbKCus4qSFLsW9/nVxV8BglkA=' 'sha256-CRju9hrCrr7E7/1bh7D1keWj+5glB7rc+JUa+x6W2Yg=' 'sha256-DOvpDp30cf/CGnMu+RfCIr+uYCldpJa8M0sZHCJm+c8=' 'sha256-Jeo1R62kpMj1AhNeNKAdR10cvtLSDPAz+nO7CXh/Yt8=' 'sha256-Lvp+bmzkH4lF4ybvBSNbhFdBPdqrJTZV9MtysQWgIHc=' 'sha256-OlxGmPw6sEYwVmzXXsMYXMB8ECmnBgUaHqXJV0Dsr/o=' 'sha256-X9SYl51FPsHjL018LRcWJ3wJj3Ep8q3jIARqQj6yb5Q=' 'sha256-ZUXZIvXFLvq8ItZmYm8beWORU1G+fhqrvq9Uc15e9N0=' 'sha256-aQUIfdu272Yg8nUoNO/Cz8gyU0SJ0iiPmmjiTmz8aYo=' 'sha256-fWuO98VnSexamk4FJQDLD0klDU54etn8xnsIto3zjmU=' 'sha256-jT2JpYilE8HtaNE9toYqY3mqIywTzn34XuB43r+HY4M=' 'sha256-tDWQovuE6Lbqi3szC+5LoHybHQ5GnkesSNbSQXRuxyw=' 'sha256-yFz75bQs3PFt2QCIx+E+8CmvUdS1pQr+4up0Qle/AjE=' 'sha256-ygnrOT9EYMVI8X3I2n6cQGoax2g+SZIcF6IGX4Q6W+Q=' https://cdn.jsdelivr.net https://cdn.tailwindcss.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' ws: wss:; frame-src https://www.youtube.com https://www.youtube-nocookie.com; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'; upgrade-insecure-requests" always;
# <<< biochirp-csp-script-src <<<

# Defense-in-depth companions. None of these require code changes.
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "no-referrer" always;
add_header Permissions-Policy "accelerometer=(), camera=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), payment=(), usb=()" always;

# Strict-Transport-Security: 180-day commitment to HTTPS-only. Bump to the
# preload form (max-age=63072000 + preload) after a couple of weeks of stable
# HTTPS operation if you want to submit to hstspreload.org.
add_header Strict-Transport-Security "max-age=15552000; includeSubDomains" always;
# add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
