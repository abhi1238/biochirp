[pytest]
# Use importlib import mode so test files with identical basenames in
# different directories (e.g. database/ttd/test_preprocess.py and
# database/hcdt/test_preprocess.py) coexist without rootdir collisions.
addopts = --import-mode=importlib
testpaths = database tests
python_files = test_*.py
# Do not collect tests from decommissioned archives (e.g. retired v1
# snapshots under database/<db>/_decommissioned_v1/) or common build dirs.
norecursedirs = _decommissioned* .* build dist *.egg node_modules venv
